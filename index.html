    <script>
/*
 * Chess Lords — version hors ligne : préparation du téléphone (script de la page, avant le jeu).
 *
 * 1. Sauvegardes : le jeu écrit dans le stockage local du navigateur ; chaque écriture est recopiée
 *    dans IndexedDB (base « chess-lords-offline »). Au lancement, si le stockage local a été vidé, les
 *    sauvegardes sont restaurées AVANT le démarrage du jeu (window.CHESS_LORDS_STORAGE_READY).
 *    Le navigateur est prié de garder ces données (navigator.storage.persist).
 * 2. Service Worker : enregistré au premier lancement (installation avec Internet).
 * 3. « Préparer le mode hors ligne » : téléchargement de toutes les ressources listées dans
 *    offline-assets.json, avec progression, reprise après coupure, vérification fichier par fichier
 *    (taille + empreinte). Le message « Chess Lords prêt pour le mode hors ligne » n'apparaît que si
 *    TOUTES les ressources sont présentes et intactes dans le cache.
 */
(function () {
  'use strict';
  window.CHESS_LORDS_OFFLINE = true;
  var ASSET_CACHE = 'cl-assets';
  var DB_NAME = 'chess-lords-offline';
  var READY_KEY = 'chesslords.offline.ready';
  var base = new URL('./', document.baseURI).href;
  var keep = function (k) { return typeof k === 'string' && (k === 'chess-factions.settings.v1' || (k.indexOf('chesslords.') === 0 && k.indexOf('chesslords.online.') !== 0)); };

  // ------------------------------------------------------------------ sauvegardes (IndexedDB)
  var storageProblem = null;
  function openDb() {
    return new Promise(function (resolve, reject) {
      if (!('indexedDB' in window)) return reject(new Error('IndexedDB indisponible'));
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  var dbp = openDb();
  dbp.catch(function (e) { storageProblem = e; });
  function idb(mode, fn) {
    return dbp.then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('kv', mode);
        fn(tx.objectStore('kv'));
        tx.oncomplete = function () { resolve(); };
        tx.onerror = tx.onabort = function () { reject(tx.error); };
      });
    });
  }
  window.CHESS_LORDS_STORAGE_READY = Promise.resolve()
    .then(function () {
      return dbp.then(function (db) {
        return new Promise(function (resolve) {
          var tx = db.transaction('kv', 'readonly');
          var st = tx.objectStore('kv');
          var keysReq = st.getAllKeys();
          var valsReq = st.getAll();
          tx.oncomplete = function () {
            var restored = 0;
            keysReq.result.forEach(function (k, i) {
              try {
                if (keep(k) && localStorage.getItem(k) === null) { localStorage.__clSet(k, valsReq.result[i]); restored++; }
              } catch (e) { storageProblem = e; }
            });
            // première fois : recopier ce qui existe déjà dans le stockage local
            try {
              for (var i = 0; i < localStorage.length; i++) {
                var key = localStorage.key(i);
                if (keep(key) && keysReq.result.indexOf(key) < 0) backup(key, localStorage.getItem(key));
              }
            } catch (e) { storageProblem = e; }
            resolve(restored);
          };
          tx.onerror = function () { resolve(0); };
        });
      });
    })
    .catch(function (e) { storageProblem = e; });

  function backup(key, value) {
    idb('readwrite', function (s) { return value === null ? s.delete(key) : s.put(value, key); }).catch(function (e) {
      storageProblem = e;
      notice('Sauvegarde de secours impossible sur ce téléphone (stockage plein ?). La partie continue ; la progression reste dans le navigateur.', true);
    });
  }
  try {
    var proto = Storage.prototype;
    var set = proto.setItem;
    var rem = proto.removeItem;
    proto.__clSet = set;
    proto.setItem = function (k, v) {
      set.call(this, k, v);
      if (this === window.localStorage && keep(k)) backup(k, String(v));
    };
    proto.removeItem = function (k) {
      rem.call(this, k);
      if (this === window.localStorage && keep(k)) backup(k, null);
    };
  } catch (e) { storageProblem = e; }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});

  // ------------------------------------------------------------------ interface (DOM, au-dessus du jeu)
  var css = '#cl-off{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(92vw,520px);z-index:50;background:#140f1c;border:2px solid #b8913a;border-radius:10px;color:#f2e6c8;font:16px/1.35 "Pixelify Sans",system-ui,sans-serif;padding:12px 14px;box-shadow:0 6px 24px #000a}' +
    '#cl-off b{color:#ffd77a}#cl-off .row{display:flex;gap:8px;margin-top:10px}#cl-off button{flex:1;font:inherit;padding:10px;border-radius:8px;border:2px solid #b8913a;background:#3a2a10;color:#ffe9b0}#cl-off button.sec{background:#1c1626;border-color:#6a5a7a;color:#d8cce8}' +
    '#cl-off .bar{height:12px;background:#2a2234;border-radius:6px;margin-top:10px;overflow:hidden}#cl-off .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8913a,#ffd77a)}#cl-off .small{font-size:13px;opacity:.8;margin-top:6px}' +
    '#cl-badge{position:fixed;top:max(6px,env(safe-area-inset-top));right:8px;z-index:50;font:13px "Pixelify Sans",system-ui,sans-serif;color:#9fe0a0;background:#0d1a10cc;border:1px solid #3a7a40;border-radius:6px;padding:3px 7px;transition:opacity .6s}';
  var panel = null;
  function el(html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstChild; }
  function mount() {
    if (!document.getElementById('cl-off-css')) { var s = document.createElement('style'); s.id = 'cl-off-css'; s.textContent = css; document.head.appendChild(s); }
    if (!panel) { panel = el('<div id="cl-off"></div>'); document.body.appendChild(panel); }
    return panel;
  }
  function close() { if (panel) { panel.remove(); panel = null; } }
  function mb(n) { return (n / 1048576).toFixed(n > 104857600 ? 0 : 1).replace('.', ',') + ' Mo'; }
  function notice(text, warn) {
    var p = mount();
    p.innerHTML = '<div>' + (warn ? '⚠ ' : '') + text + '</div><div class="row"><button class="sec" data-a="ok">OK</button></div>';
    p.querySelector('[data-a=ok]').onclick = close;
  }
  window.chessLordsOffline = { notice: notice };
  function badge(text) {
    var b = el('<div id="cl-badge">' + text + '</div>');
    document.body.appendChild(b);
    setTimeout(function () { b.style.opacity = '0'; }, 3500);
    setTimeout(function () { b.remove(); }, 4300);
  }

  // ------------------------------------------------------------------ ressources
  var list = null;
  function loadList() {
    if (list) return Promise.resolve(list);
    // la liste fait partie de la page en cache (installée avec le Service Worker)
    return fetch(base + 'offline-assets.json').then(function (r) {
      if (!r.ok) throw new Error('liste des ressources introuvable (' + r.status + ')');
      return r.json();
    }).then(function (j) { list = j; return j; });
  }
  function abs(u) { return new URL(u, base).href; }
  function hasGood(cache, f) {
    return cache.match(abs(f.url)).then(function (r) {
      if (!r || r.headers.get('X-CL-Hash') !== f.hash) return false;
      return r.blob().then(function (b) { return b.size === f.size; });
    });
  }
  /** Vérification complète : chaque ressource présente, à la bonne taille, avec la bonne empreinte. */
  function verify(onStep) {
    return Promise.all([loadList(), caches.open(ASSET_CACHE)]).then(function (a) {
      var files = a[0].files, cache = a[1], missing = [], i = 0;
      function next() {
        if (i >= files.length) return missing;
        var f = files[i++];
        return hasGood(cache, f).then(function (ok) { if (!ok) missing.push(f); if (onStep) onStep(i, files.length); return next(); });
      }
      return next();
    });
  }
  var running = false;
  function download() {
    if (running) return;
    running = true;
    var streakLost = false;
    var p = mount();
    p.innerHTML = '<div><b>Téléchargement des ressources…</b></div><div class="bar"><i></i></div><div class="small" data-t>Préparation…</div>';
    var bar = p.querySelector('.bar i'), txt = p.querySelector('[data-t]');
    var t0 = Date.now();
    loadList()
      .then(function (l) {
        return (navigator.storage && navigator.storage.estimate ? navigator.storage.estimate() : Promise.resolve(null)).then(function (est) {
          if (est && est.quota && est.quota - (est.usage || 0) < l.totalBytes * 1.05) {
            var e = new Error('Espace insuffisant sur le téléphone : il faut environ ' + mb(l.totalBytes) + ' libres (disponible pour le jeu : ' + mb(est.quota - (est.usage || 0)) + ').');
            e.quota = true;
            throw e;
          }
          return caches.open(ASSET_CACHE);
        }).then(function (cache) {
          var files = l.files, done = 0, bytes = 0, idx = 0, failed = [], streak = 0;
          function step(f) {
            return hasGood(cache, f).then(function (ok) {
              if (ok) return;
              var tries = 0;
              function attempt() {
                tries++;
                return fetch(abs(f.url), { cache: 'no-store' }).then(function (r) {
                  if (!r.ok) throw new Error(f.url + ' : ' + r.status);
                  return r.blob();
                }).then(function (b) {
                  if (b.size !== f.size) throw new Error(f.url + ' : taille inattendue');
                  var h = new Headers({ 'Content-Type': f.type, 'Content-Length': String(b.size), 'X-CL-Hash': f.hash, 'Accept-Ranges': 'bytes' });
                  return cache.put(abs(f.url), new Response(b, { status: 200, headers: h }));
                }).then(function () { streak = 0; }).catch(function (e) {
                  if (e && e.name === 'QuotaExceededError') { e.quota = true; throw e; }
                  if (tries < 3 && navigator.onLine !== false && streak < 6) return new Promise(function (r) { setTimeout(r, 800 * tries); }).then(attempt);
                  streak++;
                  failed.push(f.url);
                });
              }
              return attempt();
            }).then(function () {
              done++;
              bytes += f.size;
              bar.style.width = (100 * bytes / l.totalBytes).toFixed(1) + '%';
              txt.textContent = mb(bytes) + ' sur ' + mb(l.totalBytes) + ' · ' + done + ' / ' + files.length + ' fichiers';
            });
          }
          // connexion perdue (plusieurs échecs d'affilée) : on s'arrête vite, ce qui est téléchargé est gardé
          function worker() { if (streak >= 6) streakLost = true; if (idx >= files.length || streak >= 6) return Promise.resolve(); var f = files[idx++]; return step(f).then(worker); }
          return Promise.all([worker(), worker(), worker(), worker()]).then(function () { return failed; });
        });
      })
      .then(function () {
        txt.textContent = 'Vérification de chaque fichier…';
        return verify(function (i, n) { bar.style.width = (100 * i / n).toFixed(1) + '%'; });
      })
      .then(function (missing) {
        running = false;
        if (missing.length) {
          var lost = !navigator.onLine || missing.length > 0 && streakLost;
          p.innerHTML = '<div><b>' + (lost ? 'Téléchargement interrompu' : 'Téléchargement incomplet') + '</b> : ' + missing.length + ' fichier(s) manquant(s) sur ' + list.files.length + '.<br>Le jeu n’est PAS encore prêt pour le mode hors ligne. ' + (lost ? 'Reconnectez-vous à Internet puis reprenez : ce qui est déjà téléchargé est conservé.' : 'Reprenez le téléchargement : ce qui est déjà téléchargé est conservé.') + '</div><div class="row"><button data-a="go">Reprendre</button><button class="sec" data-a="later">Plus tard</button></div>';
          p.querySelector('[data-a=go]').onclick = download;
          p.querySelector('[data-a=later]').onclick = close;
          return;
        }
        try { localStorage.setItem(READY_KEY, list.version); } catch (e) { /* stockage plein : le contrôle sera refait au lancement */ }
        p.innerHTML = '<div><b>✓ Chess Lords prêt pour le mode hors ligne</b><br>Toutes les ressources (' + list.files.length + ' fichiers, ' + mb(list.totalBytes) + ') sont sur ce téléphone et ont été vérifiées. Vous pouvez activer le mode avion.</div><div class="small">Durée : ' + Math.round((Date.now() - t0) / 1000) + ' s</div><div class="row"><button data-a="ok">Jouer</button></div>';
        p.querySelector('[data-a=ok]').onclick = close;
      })
      .catch(function (e) {
        running = false;
        p.innerHTML = '<div><b>' + (e && e.quota ? 'Espace de stockage insuffisant' : 'Téléchargement interrompu') + '</b><br>' + (e && e.message ? e.message : String(e)) + '<br>Le jeu n’est PAS encore prêt pour le mode hors ligne.</div><div class="row"><button data-a="go">Réessayer</button><button class="sec" data-a="later">Plus tard</button></div>';
        p.querySelector('[data-a=go]').onclick = download;
        p.querySelector('[data-a=later]').onclick = close;
      });
  }
  window.chessLordsOffline.download = download;
  window.chessLordsOffline.verify = verify;

  function offerDownload(l, partialCount) {
    var p = mount();
    var again = partialCount > 0 && partialCount < l.files.length;
    // iPhone : l'application de l'écran d'accueil a son PROPRE stockage, séparé de Safari → installer d'abord
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches);
    if (ios && !standalone) {
      p.innerHTML = '<div><b>Installer Chess Lords sur l’iPhone</b><br>1. Touchez le bouton Partager de Safari (carré avec une flèche).<br>2. Choisissez « Sur l’écran d’accueil ».<br>3. Ouvrez Chess Lords depuis la nouvelle icône, puis touchez « Télécharger ».<br><span class="small">Sur iPhone, le téléchargement doit se faire depuis l’icône : Safari et l’application n’ont pas le même stockage.</span></div><div class="row"><button class="sec" data-a="later">Compris</button></div>';
      p.querySelector('[data-a=later]').onclick = close;
      return;
    }
    p.innerHTML = '<div><b>Préparer le mode hors ligne</b><br>' + (again ? 'Il manque ' + (l.files.length - partialCount) + ' fichier(s). ' : '') + 'Téléchargez une fois toutes les ressources du jeu (' + mb(l.totalBytes) + ', de préférence en Wi-Fi) pour jouer ensuite sans Internet, même en mode avion.</div><div class="row"><button data-a="go">Télécharger</button><button class="sec" data-a="later">Plus tard</button></div>';
    p.querySelector('[data-a=go]').onclick = download;
    p.querySelector('[data-a=later]').onclick = close;
  }

  // ------------------------------------------------------------------ démarrage
  window.addEventListener('load', function () {
    if (!('serviceWorker' in navigator) || !('caches' in window)) {
      notice('Ce navigateur ne permet pas le mode hors ligne. Sur iPhone, utilisez Safari ; sur Android, Chrome.', true);
      return;
    }
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function (e) {
      notice('Installation hors ligne impossible : ' + (e && e.message ? e.message : e), true);
    });
    loadList().then(function (l) {
      // contrôle rapide au lancement : chaque ressource de la liste est-elle dans le cache du téléphone ?
      // (la vérification complète, taille et empreinte, a été faite à la fin du téléchargement)
      return caches.open(ASSET_CACHE).then(function (cache) { return cache.keys(); }).then(function (keys) {
        var have = {};
        keys.forEach(function (r) { have[r.url] = 1; });
        var n = l.files.filter(function (f) { return have[abs(f.url)]; }).length;
        if (n === l.files.length) badge('✓ Prêt hors ligne');
        else if (!navigator.onLine) notice('Pas d’Internet : le jeu n’a pas encore été entièrement préparé pour le mode hors ligne (' + (l.files.length - n) + ' fichier(s) manquant(s)). Reconnectez-vous puis touchez « Télécharger ».', true);
        else offerDownload(l, n);
      });
    }).catch(function () {
      if (!navigator.onLine) notice('Pas d’Internet et le jeu n’a pas encore été préparé pour le mode hors ligne sur ce téléphone.', true);
    });
    setTimeout(function () { if (storageProblem) notice('Sauvegarde de secours indisponible sur ce téléphone : la progression reste enregistrée dans le navigateur.', true); }, 4000);
  });
})();

u",expression:"Neutre",side:"right",text:"Vous deux. Arr\xEAtez-vous."},{speaker:"aradin",expression:"Neutre",side:"left",text:"Encore un garde ? La journ\xE9e commence \xE0 \xEAtre longue."},{speaker:"gregor",as:"Chevalier inconnu",expression:"Neutre",text:"Je cherche une pierre."},{speaker:"yasmin",expression:"Reflechie",side:"left",text:"Une pierre ?"},{speaker:"gregor",as:"Chevalier inconnu",expression:"Colere",text:"Ne jouez pas avec moi. O\xF9 est-elle ?"},{speaker:"aradin",expression:"Surprise",side:"left",text:"Quelle pierre ? Il y en a des milliers dans ce d\xE9sert."},{speaker:"gregor",as:"Chevalier inconnu",expression:"Mepris",text:"Vous pensez vraiment que je vais croire \xE0 votre ignorance ?"},{speaker:"yasmin",expression:"Neutre",side:"left",text:"Nous ignorons de quoi vous parlez. Et je vous conseille de baisser votre arme."},{speaker:"gregor",as:"Chevalier inconnu",expression:"Determine",text:"Gregor. Retenez ce nom."},{speaker:"gregor",expression:"Neutre",text:"J\u2019ai travers\xE9 trop de terres pour repartir les mains vides."},{speaker:"aradin",expression:"Confiant",side:"left",text:"Et nous, on a d\xE9j\xE0 eu assez de probl\xE8mes pour aujourd\u2019hui."},{speaker:"gregor",expression:"Colere",text:"Alors \xE9cartez-vous. Ou d\xE9fendez-vous."}]},Y2={id:"haschachin-m09-gregor",backdrop:"battle",trigger:{kind:"event",name:"boss-rally"},entries:[{speaker:"gregor",expression:"Determine",side:"right",text:"Pas encore."}]},W2={id:"haschachin-m09-outro",backdrop:"battle",trigger:{kind:"victory"},entries:[{speaker:"gregor",expression:"Reflechi",side:"right",text:"Vous vous battez ensemble. Malgr\xE9 tout."},{speaker:"yasmin",expression:"Neutre",side:"left",text:"Nous avons choisi de le faire."},{speaker:"gregor",expression:"Determine",text:"Certains choix co\xFBtent davantage que vous ne l\u2019imaginez."},{speaker:"aradin",expression:"Neutre",side:"left",text:"Tu pourrais peut-\xEAtre nous expliquer."},{speaker:"gregor",expression:"Mepris",text:"Pas aujourd\u2019hui."},{direction:"Gregor se retire.",exit:["gregor"]},{speaker:"yasmin",expression:"Reflechie",side:"right",text:"Je crois qu\u2019il souffre plus qu\u2019il ne veut le montrer."},{speaker:"aradin",expression:"Neutre",side:"left",text:"\xC7a ne le rend pas moins dangereux."}]},vp=[V2,$2,J2,Y2,W2];var Q2={id:"haschachin-m10-intro",backdrop:"sanctuaire",trigger:{kind:"before"},music:"haschachin-map",entries:[{speaker:"fakir",expression:"Meditatif",side:"right",text:"Depuis le d\xE9part de la pierre, quelque chose a chang\xE9."},{speaker:"yasmin",expression:"Neutre",side:"left",text:"Chez le G\xE9nie ?"},{speaker:"fakir",expression:"Meditatif",text:"Son pouvoir semble moins stable. J\u2019ai parfois l\u2019impression d\u2019entendre deux voix."},{speaker:"aradin",expression:"Neutre",side:"left",text:"Tu crois qu\u2019il est prisonnier de quelque chose ?"},{speaker:"fakir",expression:"Inquiet",text:"Je le crains. Et cette chose commence \xE0 perdre son emprise."},{speaker:"yasmin",expression:"Reflechie",side:"left",text:"Alors nous pouvons encore le sauver."},{speaker:"fakir",expression:"Neutre",text:"Peut-\xEAtre. Mais elle sait d\xE9sormais que nous lui r\xE9sistons."},{direction:"Le sanctuaire est secou\xE9 par une manifestation de magie sombre.",fx:"flash",fxColor:9059583},{speaker:"aradin",expression:"Confiant",side:"left",text:"Alors on ferait mieux de ne pas la faire attendre."}]},X2={id:"haschachin-m10-confrontation",backdrop:"sanctuaire",trigger:{kind:"before"},transition:"fade",music:"haschachin-boss-01",entries:[{direction:"Le G\xE9nie poss\xE9d\xE9 attend au c\u0153ur du sanctuaire.",show:[{character:"genie-possede",expression:"Neutre",side:"right"}]},{speaker:"genie-possede",expression:"Neutre",side:"right",text:"Vous avez d\xE9truit l\u2019ordre que j\u2019avais patiemment construit."},{speaker:"yasmin",expression:"Colere",side:"left",text:"Vous avez dress\xE9 mon p\xE8re contre son propre peuple."},{speaker:"genie-possede",expression:"Meprisant",text:"Je n\u2019ai fait qu\u2019\xE9couter ses peurs. Il m\u2019a offert le reste."},{speaker:"aradin",expression:"Neutre",side:"left",text:"Alors tu aurais d\xFB comprendre qu\u2019il pouvait aussi changer."},{speaker:"genie-possede",expression:"Furieux",text:"Vous avez tout g\xE2ch\xE9 !"}]},Z2={id:"haschachin-m10-shaytan",backdrop:"battle",trigger:{kind:"event",name:"phase-end"},entries:[{direction:"Le corps du G\xE9nie se d\xE9forme. Une pr\xE9sence nouvelle se manifeste.",show:[{character:"genie-possede",expression:"Surpris",side:"right"}]},{exit:["genie-possede"],fx:"flash",fxColor:12728922,pause:500},{show:[{character:"shaytan",expression:"Intrigue",side:"right"}],pause:700},{speaker:"shaytan",expression:"Intrigue",side:"right",text:"Vous vous accrochez encore \xE0 l\u2019espoir\u2026"},{speaker:"aradin",expression:"Colere",side:"left",text:"Sors de ce corps !"},{speaker:"shaytan",expression:"Menacant",text:"Vous avez d\xE9fait ce que j\u2019avais sem\xE9 dans ce royaume. Vous allez le payer."},{speaker:"shaytan",expression:"Meprisant",text:"Alors voyons combien de temps vous tiendrez."}]},ey={id:"haschachin-m10-phase2",backdrop:"battle",trigger:{kind:"before"},entries:[{speaker:"shaytan",expression:"Intrigue",side:"right",text:"Muham serait peut-\xEAtre encore vivant si tu avais fait d\u2019autres choix."},{pause:1100},{speaker:"aradin",expression:"Tristesse",side:"left",text:"J\u2019y pense tous les jours."},{speaker:"shaytan",expression:"Meprisant",text:"Et maintenant, des dizaines d\u2019hommes attendent tes ordres."},{speaker:"aradin",expression:"Neutre",text:"Je sais que je peux me tromper."},{direction:"Il rel\xE8ve les yeux."},{speaker:"aradin",expression:"Confiant",text:"Mais je ne les abandonnerai pas."},{speaker:"shaytan",expression:"Menacant",text:"Tu as d\xE9fi\xE9 ton p\xE8re. D\xE9stabilis\xE9 son royaume. Et tu appelles cela de la sagesse ?"},{speaker:"yasmin",expression:"Reflechie",side:"left",text:"J\u2019ai eu peur de lui d\xE9sob\xE9ir."},{speaker:"shaytan",expression:"Intrigue",text:"Et tu as encore peur de tout perdre."},{speaker:"yasmin",expression:"Neutre",text:"Oui. Mais je pr\xE9f\xE8re cette peur au regret de n\u2019avoir rien fait."},{speaker:"shaytan",expression:"Meprisant",text:"Vous continuerez \xE0 douter. Tous les deux."},{speaker:"aradin",expression:"Neutre",side:"left",text:"Probablement."},{speaker:"yasmin",expression:"Sourire",side:"left",text:"Mais nous n\u2019avons pas \xE0 affronter cela seuls."},{speaker:"yasmin",expression:"Colere",text:"Le G\xE9nie est \xE0 bout de forces. Prot\xE9gez-le !"}]},ty={id:"haschachin-m10-outro",backdrop:"battle",trigger:{kind:"victory"},entries:[{speaker:"shaytan",expression:"Fureur",side:"right",text:"Vous croyez m\u2019avoir vaincu ?"},{speaker:"aradin",expression:"Neutre",side:"left",text:"On t\u2019a emp\xEAch\xE9 de le d\xE9truire."},{speaker:"shaytan",expression:"Menacant",text:"Tant que les hommes auront peur, je trouverai un chemin."},{direction:"La manifestation de Shaytan se dissipe.",exit:["shaytan"],fx:"flash",fxColor:10479359}]},ry={id:"haschachin-m10-genie-libre",backdrop:"sanctuaire",trigger:{kind:"victory"},music:"haschachin-map",musicFade:2.6,mood:"calm",entries:[{direction:"Le G\xE9nie retrouve son apparence libre.",show:[{character:"genie-libre",expression:"Surpris",side:"right"}]},{speaker:"genie-libre",expression:"Surpris",side:"right",text:"Je\u2026 Je suis encore l\xE0 ?"},{speaker:"yasmin",expression:"Sourire",side:"left",text:"Vous \xEAtes libre."},{speaker:"genie-libre",expression:"Serieux",text:"Apr\xE8s tout ce que j\u2019ai laiss\xE9 faire\u2026"},{speaker:"aradin",expression:"Neutre",side:"left",text:"Alors aide-nous \xE0 r\xE9parer ce qui peut encore l\u2019\xEAtre."},{direction:"Le Fakir s\u2019approche.",exit:["aradin"],show:[{character:"fakir",expression:"Neutre",side:"left"}]},{speaker:"fakir",expression:"Neutre",side:"left",text:"Il reste beaucoup \xE0 reconstruire."},{speaker:"genie-libre",expression:"Determine",text:"Cette fois, je veux le faire de mon propre choix."}]},sy={id:"haschachin-m10-epilogue",backdrop:"palais",trigger:{kind:"victory"},music:"haschachin-map",mood:"calm",entries:[{direction:"De retour au palais royal."},{speaker:"sultan",expression:"Reflechi",side:"right",text:"J\u2019ai laiss\xE9 mon royaume se diviser sous mes propres yeux."},{speaker:"yasmin",expression:"Neutre",side:"left",text:"Alors nous devons commencer par ceux qui ont \xE9t\xE9 oubli\xE9s."},{speaker:"sultan",expression:"Neutre",text:"Les villages des fronti\xE8res."},{speaker:"yasmin",expression:"Reflechie",text:"Ils ont besoin de protection. Pas seulement de nouvelles taxes."},{direction:"Aradin intervient.",exit:["yasmin"],show:[{character:"aradin",expression:"Confiant",side:"left"}]},{speaker:"aradin",expression:"Confiant",side:"left",text:"Je connais justement quelques personnes qui savent se battre."},{speaker:"sultan",expression:"Neutre",text:"Les Scorpions Noirs ?"},{speaker:"aradin",expression:"Neutre",text:"Ils ont perdu leur chef. Mais pas leur volont\xE9 de vivre autrement."},{speaker:"yasmin",expression:"Sourire",side:"right",text:"Ils pourraient former le c\u0153ur d\u2019une nouvelle garde charg\xE9e des villages."},{direction:"Le Sultan r\xE9fl\xE9chit.",show:[{character:"sultan",expression:"Reflechi",side:"right"}],pause:1200},{speaker:"sultan",expression:"Neutre",text:"Qu\u2019ils prot\xE8gent les habitants et r\xE9pondent de leurs actes. Je leur accorderai cette chance."},{speaker:"aradin",expression:"Confiant",text:"Muham aurait aim\xE9 n\xE9gocier les conditions."},{speaker:"yasmin",expression:"Sourire",side:"right",text:"Et toi ?"},{speaker:"aradin",expression:"Neutre",text:"Moi, je vais essayer d\u2019\xEAtre \xE0 la hauteur."},{pause:1400}]},iy={id:"haschachin-m10-etoile",backdrop:"palais",trigger:{kind:"victory"},transition:"fade",music:"haschachin-map",mood:"calm",night:!0,entries:[{direction:"La f\xEAte s\u2019ach\xE8ve. Aradin rejoint Yasmin \xE0 l\u2019\xE9cart."},{speaker:"yasmin",expression:"Sourire",side:"right",text:"Alors, chef des Scorpions Noirs\u2026 Comment te sens-tu ?"},{speaker:"aradin",expression:"Neutre",side:"left",text:"Un peu terrifi\xE9, pour \xEAtre sinc\xE8re."},{speaker:"yasmin",expression:"Reflechie",text:"\xC7a ne te ressemble pas de l\u2019avouer."},{speaker:"aradin",expression:"Confiant",text:"Je commence \xE0 prendre de mauvaises habitudes."},{show:[{character:"aradin",expression:"Joie",side:"left"},{character:"yasmin",expression:"Sourire",side:"right"}],pause:1300},{direction:"Yasmin sort une petite fleur s\xE9ch\xE9e de son carnet."},{speaker:"aradin",expression:"Surprise",text:"Tu l\u2019as gard\xE9e ?"},{speaker:"yasmin",expression:"Sourire",text:"Les \xC9toiles des Dunes sont rares. On ne les abandonne pas si facilement."},{pause:1400},{speaker:"aradin",expression:"Neutre",text:"Tu te souviens ? Tu m\u2019avais demand\xE9 si on se reverrait."},{speaker:"yasmin",expression:"Sourire",text:"Tu ne m\u2019avais jamais r\xE9pondu."},{speaker:"aradin",expression:"Confiant",text:"Je peux r\xE9pondre maintenant ?"},{direction:"Yasmin prend sa main. Ils s\u2019embrassent doucement."},{pause:2800}]},kp=[Q2,X2,Z2,ey,ty,ry,sy,iy];var ay={id:"esperia-m01-intro",backdrop:"esperia-field",trigger:{kind:"before"},music:"esperia-map",entries:[{speaker:"garde-esperia-homme",expression:"NEUTRE",side:"right",text:"Les lignes du Sultanat sont en place, Majest\xE9. Ils n\u2019ont pas recul\xE9 d\u2019un pas."},{speaker:"eustach-bon",expression:"NEUTRE",side:"left",text:"Alors nous ne reculerons pas davantage. Cette fronti\xE8re appartient \xE0 Esperia."},{exit:["garde-esperia-homme"]},{speaker:"von-schwartz",expression:"REFLEXION",side:"right",text:"Leur chef attend que nous perdions patience, Majest\xE9. Les vieilles chroniques du d\xE9sert le disent : qui charge le premier offre sa nuque."},{speaker:"eustach-bon",expression:"SOURIRE",text:"Toujours un livre pour chaque bataille, Von Schwartz."},{speaker:"von-schwartz",expression:"NEUTRE",text:"Et une bataille pour chaque livre, Majest\xE9."},{exit:["von-schwartz"]},{speaker:"edward",expression:"NEUTRE",side:"right",text:"Nos cavaliers peuvent contourner leur premi\xE8re ligne. Donnez-nous quelques instants."},{exit:["eustach-bon"]},{speaker:"lars",expression:"PRETENTIEUX",side:"left",text:"Quelques instants ? Tu me connais. Je vais essayer d\u2019\xEAtre lent."},{speaker:"edward",expression:"SOURIRE_COOL",text:"C\u2019est pr\xE9cis\xE9ment ce qui m\u2019inqui\xE8te."},{exit:["edward"]},{speaker:"rodolf",expression:"GROS_RIRE",side:"right",text:"S\u2019il revient avec deux arm\xE9es \xE0 ses trousses, je ne porterai pas ses bagages !"},{exit:["lars"]},{speaker:"clea",expression:"JOIE",side:"left",text:"Tu dis cela chaque fois. Et chaque fois, tu finis par les porter."},{exit:["rodolf"]},{speaker:"lars",expression:"SOURIRE_JOYEUX",side:"right",text:"Je savais que quelqu\u2019un m\u2019appr\xE9ciait ici."},{exit:["clea","lars"]},{speaker:"eustach-bon",expression:"NEUTRE",side:"left",text:"Edward. Lars. \xC0 vos postes. Que cette bataille s\u2019ach\xE8ve sans carnage inutile."},{direction:"Le roi vacille un instant et s\u2019appuie sur la garde de son \xE9p\xE9e. Edward a remarqu\xE9 le geste.",show:[{character:"eustach-bon",expression:"MALADE",side:"left"},{character:"edward",expression:"SURPRISE",side:"right"}]},{speaker:"edward",expression:"SURPRISE",side:"right",text:"P\xE8re\u2026 vous allez bien ?"},{speaker:"eustach-bon",expression:"SOURIRE",text:"Ne t\u2019inqui\xE8te pas, mon fils. Ce n\u2019est rien. Va."}]},oy={id:"esperia-m01-lignes",backdrop:"esperia-field",trigger:{kind:"before"},music:"esperia-combat-01",entries:[{speaker:"soldat-royal-01",as:"Soldat du Sultanat",expression:"Colere",side:"right",text:"Ils cherchent \xE0 nous d\xE9border ! Tenez les positions du Sultanat !"},{speaker:"brigand-01",as:"Brigand du Sultanat",expression:"Mefiant",side:"left",text:"Les cavaliers d\u2019Esperia arrivent sur notre flanc !"}]},ny={id:"esperia-m01-flanc",backdrop:"battle",trigger:{kind:"afterTurn",turn:6},entries:[{speaker:"lars",expression:"COLERE",side:"left",text:"Ils r\xE9sistent ! Enfin un peu de r\xE9pondant."},{speaker:"edward",expression:"NEUTRE",side:"right",text:"N\u2019oublie pas notre flanc droit. Tu n\u2019es pas seul sur ce champ."},{speaker:"lars",expression:"PRETENTIEUX",text:"Avec toi derri\xE8re moi ? Jamais."}]},ly={id:"esperia-m01-camp",backdrop:"esperia-royal-camp",trigger:{kind:"victory"},music:"esperia-map",mood:"calm",entries:[{speaker:"garde-esperia-femme",expression:"NEUTRE",side:"right",text:"La fronti\xE8re est tenue, Majest\xE9. Leurs troupes se retirent."},{exit:["garde-esperia-femme"]},{speaker:"rodolf",expression:"SOURIRE",side:"left",text:"Je propose qu\u2019on c\xE9l\xE8bre \xE7a avec un repas \xE9norme."},{speaker:"clea",expression:"NEUTRE",side:"right",text:"Je propose qu\u2019on commence par soigner les bless\xE9s."},{speaker:"rodolf",expression:"NEUTRE",text:"Les deux propositions me semblent compatibles."},{exit:["rodolf","clea"]},{direction:"Le roi est pris d\u2019une quinte de toux plus longue. Un silence s\u2019installe.",show:[{character:"eustach-bon",expression:"MALADE",side:"right"},{character:"edward",expression:"TRISTESSE",side:"left"}]},{speaker:"edward",expression:"TRISTESSE",side:"left",text:"P\xE8re. Ce n\u2019\xE9tait pas \xAB rien \xBB, sur le champ de bataille."},{speaker:"eustach-bon",expression:"MALADE",side:"right",text:"Non. Depuis des mois, ce mal me ronge. Les gu\xE9risseurs d\u2019Esperia n\u2019ont plus de r\xE9ponse."},{exit:["edward"]},{speaker:"lars",expression:"NEUTRE",side:"left",text:"Alors trouvons-en d\u2019autres. Il doit bien rester quelqu\u2019un capable de vous aider."},{exit:["eustach-bon"]},{speaker:"von-schwartz",expression:"REFLEXION",side:"right",text:"Il existe une piste. Des textes anciens parlent d\u2019un rem\xE8de cach\xE9 dans les terres du d\xE9sert. J\u2019en connais les routes."},{exit:["lars"]},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Vous accompagneriez mon p\xE8re, Von Schwartz ?"},{speaker:"von-schwartz",expression:"NEUTRE",text:"Je ne le quitterai pas un instant, prince. Vous avez ma parole."},{exit:["von-schwartz"],show:[{character:"eustach-bon",expression:"NEUTRE",side:"right"}]},{speaker:"eustach-bon",expression:"NEUTRE",side:"right",text:"C\u2019est d\xE9cid\xE9. Je partirai avec une escorte r\xE9duite."},{speaker:"edward",expression:"SURPRISE",side:"left",text:"Si loin ? Vous ne pouvez pas quitter le royaume maintenant."},{speaker:"eustach-bon",expression:"NEUTRE",text:"C\u2019est pr\xE9cis\xE9ment pour cela que tu prendras ma place jusqu\u2019\xE0 mon retour."},{speaker:"edward",expression:"NEUTRE",text:"Je ne vous d\xE9cevrai pas."},{speaker:"eustach-bon",expression:"SOURIRE",text:"Tu me surprendras peut-\xEAtre. C\u2019est ce que j\u2019esp\xE8re."},{direction:"Le roi part vers le sud. Edward et Lars regardent l\u2019escorte s\u2019\xE9loigner.",exit:["eustach-bon"],show:[{character:"lars",expression:"NEUTRE",side:"right"}]},{speaker:"lars",expression:"NEUTRE",side:"right",text:"Alors, Votre Majest\xE9 provisoire\u2026 on fait quoi en premier ?"},{speaker:"edward",expression:"SOURIRE_COOL",side:"left",text:"On essaie de ne pas mettre le feu au royaume."},{speaker:"lars",expression:"SOURIRE_JOYEUX",text:"Tu me demandes beaucoup."}]},cy={id:"esperia-m02-conseil",backdrop:"esperia-castle-gate",trigger:{kind:"before"},music:"esperia-map",entries:[{speaker:"garde-esperia-femme",expression:"INQUIETE",side:"right",text:"Des Sombrelames ont franchi les anciennes bornes. Le fort demande des renforts."},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Nos deux peuples se disputent cette fronti\xE8re depuis des g\xE9n\xE9rations. Je ne leur laisserai pas croire que l\u2019absence du roi nous rend faibles."},{exit:["garde-esperia-femme"]},{speaker:"lars",expression:"SOURIRE_JOYEUX",side:"right",text:"Voil\xE0 enfin une d\xE9cision que j\u2019aime."},{exit:["edward"]},{speaker:"clea",expression:"JOIE",side:"left",text:"Lars, tu aimerais aussi une d\xE9claration de guerre pour un pain vol\xE9."},{speaker:"lars",expression:"PRETENTIEUX",text:"\xC7a d\xE9pend du pain."},{exit:["clea"]},{speaker:"rodolf",expression:"GROS_RIRE",side:"left",text:"Et de qui l\u2019a mang\xE9."}]},uy={id:"esperia-m02-griffe",backdrop:"esperia-frontier-fort",trigger:{kind:"before"},music:"esperia-combat-03",entries:[{direction:"Devant la forteresse, des Sombrelames barrent la route.",show:[{character:"griffe",expression:"NEUTRE",side:"right"}]},{speaker:"griffe",expression:"NEUTRE",side:"right",text:"Un prince au lieu d\u2019un roi malade. Esperia nous envoie ses enfants, d\xE9sormais ?"},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Je dirige en son absence. Retirez votre troupe de notre territoire."},{speaker:"griffe",expression:"SATISFAITE",text:"Tant de certitude. Les jeunes souverains sont toujours les plus int\xE9ressants \xE0 voir tomber."},{exit:["edward"]},{speaker:"lars",expression:"COLERE",side:"left",text:"R\xE9p\xE8te un peu pour voir."},{exit:["lars"]},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Lars. Pas de pr\xE9cipitation."},{exit:["edward"]},{speaker:"lars",expression:"PRETENTIEUX",side:"left",text:"Je n\u2019ai encore rien fait."},{speaker:"griffe",expression:"MYSTERIEUSE",text:"Alors faisons parler les armes."}]},dy={id:"esperia-m02-milieu",backdrop:"battle",trigger:{kind:"afterTurn",turn:7},entries:[{speaker:"garde-sombrelame-1",expression:"COLERE",side:"right",text:"Prot\xE9gez la commandante !"},{speaker:"griffe",expression:"NEUTRE",side:"right",text:"Ne craignez pas ses banni\xE8res. Il n\u2019a pas encore appris \xE0 les porter."},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Restez unis. Nous tenons cette position."}]},py={id:"esperia-m02-retraite",backdrop:"esperia-frontier-fort",trigger:{kind:"victory"},entries:[{speaker:"griffe",expression:"REFLEXION",side:"right",text:"Tu n\u2019as pas la main d\u2019un novice. J\u2019avais mal jug\xE9."},{speaker:"edward",expression:"NEUTRE",side:"left",text:"La route est libre. Reprenez vos hommes et quittez nos terres."},{speaker:"griffe",expression:"COLERE",text:"Nous nous reverrons, prince."},{direction:"Griffe dispara\xEEt avec les survivants.",exit:["griffe"]},{speaker:"rodolf",expression:"SOURIRE",side:"right",text:"Elle avait l\u2019air ravie."},{exit:["edward"]},{speaker:"lars",expression:"PRETENTIEUX",side:"left",text:"Je dirais surtout qu\u2019elle reviendra."},{exit:["lars"]},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Alors nous serons pr\xEAts."},{exit:["rodolf"]},{speaker:"clea",expression:"JOIE",side:"right",text:"Tu t\u2019es bien d\xE9brouill\xE9. Et tu as \xE9cout\xE9 les autres. C\u2019est plus rare chez un souverain qu\u2019on ne le croit."},{speaker:"edward",expression:"SOURIRE_COOL",text:"Je m\u2019entra\xEEne."}]},hy={id:"esperia-m02-regence",backdrop:"esperia-castle-gate",trigger:{kind:"victory"},transition:"fade",music:"esperia-map",mood:"calm",entries:[{show:[{character:"edward",expression:"NEUTRE",side:"left"}],pause:500},{direction:"Au ch\xE2teau, Edward est officiellement confirm\xE9 r\xE9gent provisoire, jusqu\u2019au retour du roi."}]},my={id:"esperia-m03-intro",backdrop:"esperia-village-road",trigger:{kind:"before"},music:"esperia-combat-03",entries:[{speaker:"garde-esperia-homme",expression:"INQUIET",side:"right",text:"Les mercenaires ran\xE7onnent le village. Ils poss\xE8dent des armes enchant\xE9es. Nos miliciens n\u2019ont que leurs lances."},{speaker:"lars",expression:"SOURIRE_JOYEUX",side:"left",text:"Parfait. On leur prend leurs armes et on en parle plus."},{exit:["garde-esperia-homme"]},{speaker:"edward",expression:"NEUTRE",side:"right",text:"Pas si nous \xE9crasons le village avec eux. On n\u2019engage pas une bataille rang\xE9e au milieu des maisons."},{exit:["lars"]},{speaker:"rodolf",expression:"SURPRISE",side:"left",text:"Alors tu comptes les arr\xEAter avec ces paysans ?"},{speaker:"edward",expression:"NEUTRE",text:"Ils connaissent chaque ruelle. Si nous tenons les passages, l\u2019avantage de l\u2019ennemi dispara\xEEt."},{exit:["rodolf"]},{speaker:"clea",expression:"DETERMINEE",side:"left",text:"Ils auront peur. Tu devras leur montrer que tu leur fais confiance."},{speaker:"edward",expression:"NEUTRE",text:"C\u2019est justement ce que je veux faire."},{exit:["clea"]},{speaker:"garde-esperia-femme",expression:"INQUIETE",side:"left",text:"Ils sont men\xE9s par deux combattantes redoutables. Elles ont d\xE9j\xE0 mis \xE0 terre plusieurs patrouilles."},{exit:["garde-esperia-femme"]},{speaker:"lars",expression:"PRETENTIEUX",side:"left",text:"J\u2019en prends une, vous gardez l\u2019autre ?"},{speaker:"edward",expression:"SOURIRE_COOL",text:"Non. Aujourd\u2019hui, tu apprends \xE0 laisser les autres se battre."}]},fy={id:"esperia-m03-milice",backdrop:"battle",trigger:{kind:"afterTurn",turn:3},entries:[{speaker:"rodolf",expression:"NEUTRE",side:"left",text:"Nos miliciens tiennent bon !"},{speaker:"edward",expression:"NEUTRE",side:"right",text:"Ces villageois n\u2019ont peut-\xEAtre jamais combattu, mais s\u2019ils tiennent leurs positions, nous avons une chance."}]},yy={id:"esperia-m03-outro",backdrop:"esperia-village-road",trigger:{kind:"victory"},music:"esperia-map",entries:[{speaker:"garde-esperia-femme",expression:"NEUTRE",side:"right",text:"Le village est sauv\xE9. Les mercenaires se replient."},{exit:["garde-esperia-femme"]},{speaker:"rodolf",expression:"GROS_RIRE",side:"left",text:"Et pas un seul de ces miliciens n\u2019avait ma carrure. C\u2019est vexant !"},{speaker:"lars",expression:"NEUTRE",side:"right",text:"Ils avaient mieux : un plan."},{speaker:"rodolf",expression:"SURPRISE",text:"C\u2019\xE9tait une attaque personnelle, \xE7a ?"},{exit:["lars"]},{speaker:"clea",expression:"JOIE",side:"right",text:"Non. Mais elle \xE9tait assez m\xE9rit\xE9e."},{exit:["rodolf","clea"]},{speaker:"edward",expression:"SOURIRE_COOL",side:"left",text:"Mon p\xE8re m\u2019a appris \xE0 commander des chevaliers. Aujourd\u2019hui, ce sont des villageois qui m\u2019ont appris \xE0 les \xE9couter."}]},gy={id:"esperia-a01-intro",backdrop:"esperia-village-road",trigger:{kind:"before"},music:"esperia-combat-03",entries:[{speaker:"rodolf",expression:"GROS_RIRE",side:"left",text:"Une petite escorte tranquille, avait-il dit. On reviendra pour le d\xEEner, avait-il dit."},{speaker:"edward",expression:"NEUTRE",side:"right",text:"Tu aurais pr\xE9f\xE9r\xE9 que je t\u2019annonce des brigands ?"},{speaker:"rodolf",expression:"SOURIRE",text:"Au moins, j\u2019aurais mang\xE9 avant de partir."},{exit:["edward"]},{speaker:"lars",expression:"SOURIRE_JOYEUX",side:"right",text:"\xC9coute-le. Il parle comme si un repas pouvait lui manquer."},{exit:["rodolf"]},{speaker:"clea",expression:"DETERMINEE",side:"left",text:"\xC0 tous les deux : les gens dans ce convoi comptent sur nous."},{exit:["lars"]},{speaker:"edward",expression:"NEUTRE",side:"right",text:"On les fait traverser le pont. Ensemble."},{exit:["clea"]},{speaker:"lars",expression:"PRETENTIEUX",side:"left",text:"Tant que tu ne me demandes pas de rester derri\xE8re."},{speaker:"edward",expression:"SOURIRE_COOL",text:"Je n\u2019oserais jamais."}]},by={id:"esperia-a01-passage",backdrop:"battle",trigger:{kind:"afterTurn",turn:5},entries:[{speaker:"clea",expression:"DETERMINEE",side:"left",text:"Nous sommes presque sortis. Gardez le passage libre."},{speaker:"rodolf",expression:"COLERE",side:"right",text:"Ceux-l\xE0 devront d\u2019abord passer sur mon ventre !"},{exit:["clea"]},{speaker:"lars",expression:"NEUTRE",side:"left",text:"\xC7a leur prendrait du temps."}]},xy={id:"esperia-a01-pont",backdrop:"battle",trigger:{kind:"victory"},entries:[{direction:"Le convoi a travers\xE9. Le soir tombe sur le camp royal."}]},vy={id:"esperia-a01-feu",backdrop:"esperia-royal-camp",trigger:{kind:"victory"},music:"esperia-map",mood:"calm",musicFade:1.8,entries:[{speaker:"rodolf",expression:"GROS_RIRE",side:"left",text:"Et je vous assure que le chef des brigands s\u2019est enfui en voyant mon ombre !"},{speaker:"lars",expression:"PRETENTIEUX",side:"right",text:"C\u2019\xE9tait ton ventre qu\u2019il voyait. Tu cachais le soleil."},{speaker:"rodolf",expression:"SURPRISE",text:"Trahison. J\u2019ai prot\xE9g\xE9 cet homme aujourd\u2019hui !"},{exit:["lars"]},{speaker:"clea",expression:"JOIE",side:"right",text:"Tu t\u2019es surtout jet\xE9 sur son adversaire avant qu\u2019on t\u2019en donne l\u2019ordre."},{speaker:"rodolf",expression:"SOURIRE",text:"J\u2019ai une certaine intuition tactique."},{exit:["clea"]},{speaker:"edward",expression:"SOURIRE_COOL",side:"right",text:"Tu as tr\xE9buch\xE9 sur un tonneau."},{direction:"Un petit silence, puis tout le monde \xE9clate de rire. M\xEAme Lars sourit.",exit:["edward"],show:[{character:"lars",expression:"SOURIRE_JOYEUX",side:"right"}]},{speaker:"lars",expression:"SOURIRE_JOYEUX",side:"right",text:"Il faut lui laisser \xE7a : le tonneau n\u2019a pas surv\xE9cu."},{speaker:"rodolf",expression:"GROS_RIRE",text:"Enfin quelqu\u2019un qui reconna\xEEt mes victoires !"},{exit:["rodolf","lars"]},{speaker:"clea",expression:"NEUTRE",side:"left",text:"Edward, tu n\u2019as presque rien mang\xE9."},{speaker:"edward",expression:"NEUTRE",side:"right",text:"J\u2019ai encore des rapports \xE0 lire \xE0 l\u2019aube."},{speaker:"clea",expression:"JOIE",text:"Les rapports seront toujours l\xE0 demain."},{direction:"Elle lui tend une part de repas. Il l\u2019accepte et la remercie d\u2019un regard.",pause:400},{speaker:"edward",expression:"SOURIRE_COOL",text:"Merci, Cl\xE9a."},{exit:["clea"]},{speaker:"rodolf",expression:"NEUTRE",side:"left",text:"Vous savez, quand Edward sera roi pour de bon, il faudra l\u2019appeler \xAB Sa Majest\xE9 \xBB m\xEAme quand il ronfle."},{exit:["rodolf"]},{speaker:"lars",expression:"NEUTRE",side:"left",text:"Je l\u2019appelle d\xE9j\xE0 \xAB Votre Majest\xE9 \xBB quand il devient insupportable."},{speaker:"edward",expression:"PRETENTIEUX",text:"Et pourtant, tu continues \xE0 me suivre."},{speaker:"lars",expression:"NEUTRE",text:"Parce que tu as besoin de quelqu\u2019un pour te dire quand tu as tort."},{speaker:"edward",expression:"SOURIRE_COOL",text:"Je le sais."},{pause:1200},{exit:["lars"]},{speaker:"clea",expression:"JOIE",side:"left",text:"Vous \xEAtes p\xE9nibles tous les trois."},{exit:["edward"]},{speaker:"rodolf",expression:"SOURIRE",side:"right",text:"Et pourtant, tu continues \xE0 nous suivre."},{speaker:"clea",expression:"JOIE",text:"Malheureusement, quelqu\u2019un doit veiller sur vous."},{direction:"Le feu cr\xE9pite.",pause:1400}]},ky={id:"esperia-m04-intro",backdrop:"esperia-frontier-fort",trigger:{kind:"before"},music:"esperia-combat-02",entries:[{speaker:"garde-esperia-homme",expression:"INQUIET",side:"right",text:"La troupe de Griffe est revenue. Cette fois, elle attaque nos d\xE9p\xF4ts pr\xE8s du fort."},{speaker:"rodolf",expression:"NEUTRE",side:"left",text:"Elle a une sacr\xE9e m\xE9moire des rancunes."},{exit:["garde-esperia-homme"]},{speaker:"lars",expression:"PRETENTIEUX",side:"right",text:"Moi aussi. J\u2019aime bien les seconds rounds."},{exit:["rodolf"]},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Nous ne sommes pas l\xE0 pour satisfaire ton go\xFBt du combat, Lars."},{speaker:"lars",expression:"SOURIRE_JOYEUX",text:"Tu peux au moins me laisser l\u2019appr\xE9cier."},{exit:["lars"]},{speaker:"griffe",expression:"COLERE",side:"right",text:"Prince ! Je t\u2019avais promis que nous nous reverrions."},{speaker:"edward",expression:"NEUTRE",text:"Et je t\u2019avais demand\xE9 de quitter cette fronti\xE8re."},{speaker:"griffe",expression:"MYSTERIEUSE",text:"Les promesses sont faciles, surtout derri\xE8re les murs d\u2019un ch\xE2teau."},{speaker:"griffe",expression:"SATISFAITE",text:"Regardez bien."}]},Sy={id:"esperia-m04-breche",backdrop:"battle",trigger:{kind:"event",name:"boss-opening"},entries:[{speaker:"rodolf",expression:"SURPRISE",side:"left",text:"Ils viennent d\u2019ouvrir une br\xE8che !"},{speaker:"edward",expression:"NEUTRE",side:"right",text:"Alors nous la refermerons. Tous ensemble."}]},Ey={id:"esperia-m04-griffe",backdrop:"battle",trigger:{kind:"afterTurn",turn:8},entries:[{speaker:"griffe",expression:"COLERE",side:"right",text:"Cette fois, je ne te sous-estimerai pas !"},{speaker:"lars",expression:"PRETENTIEUX",side:"left",text:"C\u2019est dommage. Nous, on comptait justement sur \xE7a."}]},wy={id:"esperia-m04-outro",backdrop:"esperia-frontier-fort",trigger:{kind:"victory"},music:"esperia-map",musicFade:1.6,entries:[{speaker:"griffe",expression:"TRISTE",side:"right",text:"Encore\u2026 Tu as encore d\xE9jou\xE9 mon attaque."},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Rappelle tes hommes. Il y a d\xE9j\xE0 eu assez de morts."},{speaker:"griffe",expression:"COLERE",text:"Ne prends pas ma retraite pour une reddition."},{direction:"Griffe s\u2019enfuit, furieuse et humili\xE9e \u2014 mais vivante.",exit:["griffe"]},{speaker:"rodolf",expression:"GROS_RIRE",side:"right",text:"Deux victoires ! Il para\xEEt qu\u2019\xE0 la troisi\xE8me, ils offrent un troph\xE9e !"},{exit:["edward"]},{speaker:"lars",expression:"SOURIRE_JOYEUX",side:"left",text:"Je me contenterai d\u2019une troisi\xE8me bataille."},{exit:["rodolf"]},{speaker:"clea",expression:"NEUTRE",side:"right",text:"J\u2019esp\xE8re surtout qu\u2019il n\u2019y en aura pas."},{exit:["lars"]},{speaker:"edward",expression:"SOURIRE_COOL",side:"left",text:"Le royaume peut souffler. Rentrons. Mon p\xE8re sera peut-\xEAtre de retour."}]},Sp=[ay,oy,ny,ly,cy,uy,dy,py,hy,my,fy,yy,gy,by,xy,vy,ky,Sy,Ey,wy];var Ry={id:"esperia-m05-retour",backdrop:"esperia-castle-gate",trigger:{kind:"before"},music:"esperia-map",entries:[{speaker:"rodolf",expression:"SOURIRE",side:"left",text:"J\u2019esp\xE8re qu\u2019on aura droit \xE0 un banquet. On vient quand m\xEAme de sauver la fronti\xE8re deux fois."},{speaker:"lars",expression:"NEUTRE",side:"right",text:"Tu dirais \xE7a m\xEAme si on avait perdu."},{exit:["rodolf"]},{speaker:"clea",expression:"NEUTRE",side:"left",text:"Laissez Edward respirer. Il n\u2019a pas vu son p\xE8re depuis des semaines."},{exit:["lars"]},{speaker:"edward",expression:"SOURIRE_COOL",side:"right",text:"Je vais surtout lui demander s\u2019il a trouv\xE9 de quoi gu\xE9rir."}]},Py={id:"esperia-m05-trone",backdrop:"esperia-throne",trigger:{kind:"before"},transition:"fade",music:"esperia-boss-01",musicFade:2,entries:[{show:[{character:"eustach-corrompu",expression:"NEUTRE",side:"right"}],pause:700},{direction:"Le roi est l\xE0, debout, l\u2019\u0153il vif \u2014 gu\xE9ri, en apparence. Von Schwartz, son conseiller, se tient \xE0 ses c\xF4t\xE9s."},{speaker:"edward",expression:"SURPRISE",side:"left",text:"P\xE8re ! Vous \xEAtes revenu ! Et\u2026 vous semblez aller mieux."},{speaker:"eustach-corrompu",expression:"NEUTRE",side:"right",text:"Je vais parfaitement bien. Mieux que je ne l\u2019ai jamais \xE9t\xE9."},{speaker:"edward",expression:"NEUTRE",text:"Le royaume a tenu. Les postes-fronti\xE8res sont s\xFBrs, les villages ont \xE9t\xE9 prot\xE9g\xE9s\u2026"},{speaker:"eustach-corrompu",expression:"MEPRIS",text:"Je suis au courant. On prononce ton nom dans les rues comme si tu avais fond\xE9 Esperia."},{speaker:"edward",expression:"SURPRISE",text:"Je n\u2019ai fait que gouverner en votre absence. Comme vous me l\u2019aviez demand\xE9."},{exit:["eustach-corrompu"]},{speaker:"von-schwartz",expression:"MALEFIQUE",side:"right",text:"La popularit\xE9 est une chose \xE9trange, Votre Majest\xE9. Elle fait parfois na\xEEtre des ambitions qu\u2019on ne soup\xE7onnait pas."},{exit:["von-schwartz"]},{speaker:"eustach-corrompu",expression:"COLERE",side:"right",text:"Je t\u2019ai laiss\xE9 mon tr\xF4ne pour quelques semaines. Te voil\xE0 pr\xEAt \xE0 me le reprendre."},{speaker:"edward",expression:"NEUTRE",text:"Jamais je n\u2019ai voulu vous prendre quoi que ce soit. Je suis votre fils."},{speaker:"eustach-corrompu",expression:"MEPRIS",text:"Justement. Le seul homme dont le sang pourrait un jour l\xE9gitimer ma chute."},{exit:["edward"]},{speaker:"lars",expression:"COLERE",side:"left",text:"Vous vous entendez parler ? Il a d\xE9fendu votre royaume pendant que vous \xE9tiez absent !"},{exit:["eustach-corrompu"]},{speaker:"von-schwartz",expression:"MEPRIS",side:"right",text:"Gardes."},{direction:"Les gardes s\u2019avancent.",exit:["lars"],pause:300},{speaker:"clea",expression:"SURPRISE",side:"left",text:"Votre Majest\xE9, il doit y avoir un malentendu\u2026"},{exit:["von-schwartz"]},{speaker:"eustach-corrompu",expression:"COLERE",side:"right",text:"Il n\u2019y en a aucun. Ex\xE9cutez le prince. Et ceux qui se mettront entre lui et ma volont\xE9."},{exit:["clea"]},{speaker:"edward",expression:"COLERE",side:"left",text:"P\xE8re !"},{exit:["eustach-corrompu"]},{speaker:"von-schwartz",expression:"MALEFIQUE",side:"right",text:"Vous comptiez sur l\u2019ordre ancien de vos arm\xE9es ? Alors regardez-les autrement."},{direction:"Une lueur violette parcourt la salle : les rangs des deux arm\xE9es se m\xEAlent.",fx:"flash",fxColor:11553535}]},My={id:"esperia-m05-issue",backdrop:"battle",trigger:{kind:"afterTurn",turn:3},entries:[{speaker:"lars",expression:"COLERE",side:"left",text:"Edward ! Trouve une sortie !"},{speaker:"edward",expression:"NEUTRE",side:"right",text:"Restez group\xE9s, je vais ouvrir le passage !"},{exit:["lars"]},{speaker:"von-schwartz",expression:"MALEFIQUE",side:"left",text:"Vous ne savez m\xEAme plus o\xF9 se trouvent vos propres alli\xE9s."}]},Cy={id:"esperia-m05-fuite",backdrop:"battle",trigger:{kind:"victory"},entries:[{direction:"Les portes c\xE8dent. Le groupe tente de fuir, mais les soldats du roi convergent de toutes parts."},{speaker:"rodolf",expression:"COLERE",side:"left",text:"Ils arrivent de partout ! On va \xEAtre encercl\xE9s !"},{speaker:"lars",expression:"COLERE",side:"right",text:"Pas si je les arr\xEAte avant."},{exit:["rodolf"]},{speaker:"edward",expression:"SURPRISE",side:"left",text:"Lars, non ! Reviens !"},{direction:"Lars se rue seul sur les gardes et les repousse. Von Schwartz l\xE8ve la main.",exit:["lars"]},{speaker:"von-schwartz",expression:"MALEFIQUE",side:"right",text:"Quelle fougue. Voyons ce qu\u2019il en reste lorsque la douleur la poss\xE8de."},{exit:["von-schwartz"],fx:"flash",fxColor:11553535,pause:500},{show:[{character:"lars-maudit",expression:"SOUFFRANCE",side:"right"}],pause:400},{speaker:"lars-maudit",expression:"SOUFFRANCE",side:"right",text:"Aaaah\u2026 !"},{exit:["edward"]},{speaker:"clea",expression:"SURPRISE",side:"left",text:"Lars ! Le sort le d\xE9vore !"},{exit:["clea"]},{speaker:"edward",expression:"COLERE",side:"left",text:"Arr\xEAtez ! Laissez-le !"},{direction:"Lars peine \xE0 se redresser ; il retient encore les gardes alors que l\u2019ombre l\u2019envahit. Il croise le regard d\u2019Edward."},{speaker:"lars-maudit",expression:"SOUFFRANCE",text:"Edward\u2026 cours."},{speaker:"edward",expression:"TRISTESSE",text:"Je ne partirai pas sans toi."},{speaker:"lars-maudit",expression:"SOUFFRANCE",text:"Pour une fois\u2026 \xE9coute-moi."},{pause:1300},{speaker:"lars-maudit",expression:"SOUFFRANCE",text:"Adieu mes amis"},{direction:"Une explosion de lueur violette. Lars dispara\xEEt derri\xE8re une porte envahie de fum\xE9e. Des chutes, des cris \u2014 puis plus rien.",fx:"flash",fxColor:11553535,exit:["lars-maudit"]},{speaker:"rodolf",expression:"COLERE",side:"right",text:"EDWARD ! IL NOUS A OUVERT LE PASSAGE !"},{exit:["rodolf"]},{speaker:"clea",expression:"DETERMINEE",side:"right",text:"Il faut partir ! Maintenant !"},{direction:"Edward h\xE9site, le visage fig\xE9. Puis il c\xE8de.",show:[{character:"edward",expression:"TRISTESSE",side:"left"}]},{speaker:"edward",expression:"TRISTESSE",text:"Lars\u2026"}]},Ty={id:"esperia-m05-silence",backdrop:"esperia-village-road",trigger:{kind:"victory"},transition:"fade",night:!0,music:"silence",musicFade:1.4,mood:"calm",entries:[{pause:1600},{direction:"La fuite, dans la nuit. Ils courent jusqu\u2019\xE0 la lisi\xE8re de la for\xEAt."}]},Ay={id:"esperia-m05-foret",backdrop:"esperia-village-road",trigger:{kind:"victory"},night:!0,music:"esperia-sad",musicFade:2.6,mood:"calm",entries:[{show:[{character:"edward",expression:"TRISTESSE",side:"left"},{character:"clea",expression:"TRISTE",side:"right"}],pause:900},{direction:"Edward, Rodolf et Cl\xE9a, bless\xE9s et \xE0 bout de forces, s\u2019effondrent \xE0 l\u2019or\xE9e de la for\xEAt."},{exit:["edward","clea"],pause:1200}]},Iy={id:"esperia-m06-reveil",backdrop:"esperia-refuge",trigger:{kind:"before"},music:"esperia-sad",musicFade:2,mood:"calm",entries:[{pause:900},{speaker:"edward",expression:"TRISTESSE",side:"left",text:"Lars\u2026 ?"},{speaker:"clea",expression:"NEUTRE",side:"right",text:"Edward. Doucement. Ne te rel\xE8ve pas si vite."},{speaker:"edward",expression:"SURPRISE",text:"O\xF9 sommes-nous ? Et les autres ?"},{exit:["clea"]},{speaker:"rodolf",expression:"NEUTRE",side:"right",text:"L\xE0. Entier, \xE0 peu pr\xE8s. Ce qui est d\xE9j\xE0 plus que je n\u2019esp\xE9rais."},{exit:["rodolf"]},{speaker:"albus",expression:"MALICIEUX",side:"right",text:"Trois invit\xE9s, des bandages en moins et ma r\xE9serve d\u2019onguents r\xE9duite de moiti\xE9. Je crois que vous nous devez une explication."},{exit:["edward"]},{speaker:"brumebarbe",expression:"SOURIRE",side:"left",text:"Les pr\xE9sentations d\u2019abord, Albus. Ils viennent \xE0 peine de revenir parmi nous."},{speaker:"albus",expression:"NEUTRE",text:"Je suis Albus. Le grand elfe qui r\xE2le \xE0 c\xF4t\xE9 de moi s\u2019appelle Brumebarbe. C\u2019est un mage \u2014 moi, je m\u2019occupe surtout des onguents."},{speaker:"brumebarbe",expression:"SOURIRE",text:"Sage, para\xEEt-il. Et assez patient pour supporter ce jeune gnome."},{exit:["brumebarbe"]},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Edward, fils d\u2019Eustach\u2026 anciennement r\xE9gent d\u2019Esperia. Vous nous avez sauv\xE9s ?"},{exit:["albus"]},{speaker:"brumebarbe",expression:"NEUTRE",side:"right",text:"Nous vous avons trouv\xE9s au bord de la for\xEAt. Vous \xE9tiez tous les trois gri\xE8vement bless\xE9s."},{speaker:"edward",expression:"TRISTESSE",text:"Tous les trois\u2026"},{exit:["brumebarbe"],pause:1400},{speaker:"clea",expression:"TRISTE",side:"right",text:"Je suis d\xE9sol\xE9e, Edward. Nous n\u2019avons pas pu revenir chercher Lars."},{speaker:"edward",expression:"TRISTESSE",text:"Il est mort pour que nous vivions."},{exit:["clea"]},{speaker:"rodolf",expression:"PLEURS",side:"right",text:"Et lui, qui se plaignait toujours qu\u2019on manquait de bagarres\u2026"},{pause:1800},{exit:["rodolf"]},{speaker:"albus",expression:"TRISTE",side:"right",text:"Nous ne connaissions pas votre ami. Mais je crois comprendre ce qu\u2019il repr\xE9sentait pour vous."}]},Oy={id:"esperia-m06-pierre",backdrop:"esperia-refuge",trigger:{kind:"before"},transition:"fade",music:"esperia-map",musicFade:2.4,mood:"calm",entries:[{direction:"Quelques jours de soins plus tard."},{speaker:"brumebarbe",expression:"REFLEXION",side:"right",text:"Nous cherchons une pierre que certains nomment l\u2019Obscure Clart\xE9."},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Mon p\xE8re est revenu d\u2019un voyage dans le d\xE9sert. Depuis, il ne se reconna\xEEt plus. Et Von Schwartz ne le quitte plus."},{exit:["brumebarbe"]},{speaker:"albus",expression:"REFLEXION",side:"right",text:"Voil\xE0 qui correspond \xE0 ce que nous redoutions. Ce n\u2019est pas un poison, ni m\xEAme une mal\xE9diction ordinaire."},{exit:["edward"]},{speaker:"clea",expression:"SURPRISE",side:"left",text:"Qu\u2019est-ce que cette pierre fait aux gens ?"},{exit:["albus"]},{speaker:"brumebarbe",expression:"NEUTRE",side:"right",text:"Elle ne choisit pas le bien ou le mal. Elle amplifie ce qui existe d\xE9j\xE0 : les \xE9lans g\xE9n\xE9reux comme les d\xE9sirs les plus sombres."},{exit:["brumebarbe"]},{speaker:"albus",expression:"NEUTRE",side:"right",text:"Une \xE2me ambitieuse peut s\u2019y perdre. Une \xE2me charitable pourrait y puiser autre chose. C\u2019est pr\xE9cis\xE9ment ce qui la rend dangereuse."},{exit:["clea"]},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Mon p\xE8re aimait r\xE9gner. Mais jamais il n\u2019aurait voulu ma mort."},{exit:["albus"]},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"right",text:"La pierre a fait de son ambition une prison."},{exit:["brumebarbe"]},{speaker:"albus",expression:"REFLEXION",side:"right",text:"Nous voulons la ramener dans la for\xEAt sylvestre. Les arbres ne r\xEAvent ni de tr\xF4ne, ni de conqu\xEAte."},{exit:["albus"]},{speaker:"brumebarbe",expression:"SOURIRE",side:"right",text:"M\xEAme si certains ch\xEAnes ont un caract\xE8re d\xE9testable."},{direction:"Albus sourit bri\xE8vement. Edward reste s\xE9rieux.",show:[{character:"edward",expression:"NEUTRE",side:"left"}]},{speaker:"edward",expression:"NEUTRE",text:"Mon p\xE8re a tent\xE9 de me faire tuer. Tel qu\u2019il est devenu, il est une menace pour Esperia. Il faut l\u2019arr\xEAter. Pour le royaume. Et pour Lars."},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",text:"Alors prends garde, Edward. La justice peut te guider ; la vengeance, elle, finira par te d\xE9vorer."},{speaker:"edward",expression:"NEUTRE",text:"Je ne cherche pas la vengeance. Je veux seulement que cela cesse."},{speaker:"brumebarbe",expression:"REFLEXION",text:"Souviens-toi de cette r\xE9ponse lorsque la col\xE8re reviendra."}]},Ly={id:"esperia-m06-releve",backdrop:"esperia-village-road",trigger:{kind:"before"},transition:"fade",music:"esperia-combat-03",entries:[{speaker:"garde-esperia-femme",expression:"INQUIETE",side:"right",text:"Des villageois veulent se joindre \xE0 vous. Ils ignorent presque tout du combat. Des patrouilles les cherchent."},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Nous leur ouvrirons le passage. Je ne laisserai personne derri\xE8re."},{exit:["garde-esperia-femme"]},{speaker:"albus",expression:"MALICIEUX",side:"right",text:"Les plus humbles deviennent parfois les plus redoutables. Tout est une affaire de bon chemin."},{exit:["edward"]},{speaker:"rodolf",expression:"SOURIRE",side:"left",text:"Tant mieux. Moi, les itin\xE9raires, je les confonds toujours."}]},qy={id:"esperia-m06-outro",backdrop:"esperia-village-road",trigger:{kind:"victory"},music:"esperia-map",entries:[{speaker:"revolutionnaire-homme",expression:"SOURIRE",side:"right",text:"Les villageois sont pass\xE9s. Ils veulent se battre \xE0 vos c\xF4t\xE9s."},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Qu\u2019ils aient d\u2019abord de quoi manger et se soigner. Le reste viendra."},{exit:["revolutionnaire-homme"]},{speaker:"clea",expression:"JOIE",side:"right",text:"C\u2019est la bonne d\xE9cision."},{exit:["edward","clea"]},{speaker:"albus",expression:"SOURIRE",side:"left",text:"Vous voyez, Brumebarbe ? Il n\u2019a pas perdu ce qui fait de lui un bon chef."},{speaker:"brumebarbe",expression:"REFLEXION",side:"right",text:"Non. Mais il faudra veiller \xE0 ce qu\u2019il le garde."}]},Ny={id:"esperia-a02-intro",backdrop:"esperia-village-road",trigger:{kind:"before"},music:"esperia-map",entries:[{speaker:"revolutionnaire-femme",expression:"COLERE",side:"right",text:"Mon fr\xE8re a \xE9t\xE9 arr\xEAt\xE9 parce qu\u2019il a refus\xE9 de br\xFBler les r\xE9serves du village. Le roi appelle cela de la d\xE9sob\xE9issance."},{speaker:"edward",expression:"NEUTRE",side:"left",text:"O\xF9 le retiennent-ils ?"},{speaker:"revolutionnaire-femme",expression:"NEUTRE",text:"Dans les anciens entrep\xF4ts, pr\xE8s du pont. Il n\u2019est pas seul."},{exit:["edward"]},{speaker:"rodolf",expression:"COLERE",side:"left",text:"Br\xFBler les r\xE9serves des familles\u2026 Ils n\u2019ont donc plus aucune limite ?"},{exit:["revolutionnaire-femme"]},{speaker:"clea",expression:"DETERMINEE",side:"right",text:"Si nous intervenons, il faudra d\u2019abord faire sortir les captifs. Pas seulement vaincre les gardes."},{exit:["rodolf"]},{speaker:"edward",expression:"NEUTRE",side:"left",text:"C\u2019est notre priorit\xE9. Aucun prisonnier ne sera abandonn\xE9."},{exit:["clea"]},{speaker:"albus",expression:"MALICIEUX",side:"right",text:"Et si l\u2019on \xE9vitait de d\xE9molir le pont en passant ? Je l\u2019aime bien, ce pont."},{exit:["edward"]},{speaker:"brumebarbe",expression:"SOURIRE",side:"left",text:"Pour une fois, voil\xE0 un conseil plein de sagesse."}]},_y={id:"esperia-a02-sortie",backdrop:"battle",trigger:{kind:"afterTurn",turn:6},entries:[{speaker:"revolutionnaire-homme",expression:"CRI",side:"right",text:"Le dernier groupe arrive ! Prot\xE9gez la sortie !"},{speaker:"clea",expression:"DETERMINEE",side:"left",text:"Ils sont \xE9puis\xE9s. Laissez-les passer devant vous."}]},Dy={id:"esperia-a02-outro",backdrop:"esperia-rebel-camp",trigger:{kind:"victory"},transition:"fade",music:"esperia-map",mood:"calm",entries:[{speaker:"revolutionnaire-femme",expression:"SOURIRE",side:"right",text:"Vous avez tenu parole. Les familles ne l\u2019oublieront pas."},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Nous n\u2019avons fait que ce qui devait \xEAtre fait."},{exit:["revolutionnaire-femme"]},{speaker:"clea",expression:"JOIE",side:"right",text:"Tu dis cela chaque fois, et tu oublies toujours de soigner tes propres blessures."},{speaker:"edward",expression:"SOURIRE_COOL",text:"Je me doutais que tu le remarquerais."},{speaker:"clea",expression:"JOIE",text:"Je remarque beaucoup de choses."},{pause:1100},{exit:["clea"]},{speaker:"brumebarbe",expression:"REFLEXION",side:"right",text:"Un peuple ne se rallie pas \xE0 des discours. Il se rallie \xE0 des actes."},{speaker:"edward",expression:"NEUTRE",text:"Alors continuons."}]},Ep=[Ry,Py,My,Cy,Ty,Ay,Iy,Oy,Ly,qy,Ny,_y,Dy];var Uy={id:"esperia-m07-intro",backdrop:"esperia-rebel-camp",trigger:{kind:"before"},music:"esperia-map",entries:[{direction:"Un mois plus tard."},{speaker:"revolutionnaire-homme",expression:"NEUTRE",side:"right",text:"Les anciennes garnisons de l\u2019ouest nous ont rejoints. Des villages nous envoient du ravitaillement."},{exit:["revolutionnaire-homme"]},{speaker:"revolutionnaire-femme",expression:"COLERE",side:"right",text:"Le roi a fait condamner des familles enti\xE8res pour avoir nourri nos hommes. Il faut que cela cesse."},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Cela cessera. Nous ouvrirons la route du ch\xE2teau aujourd\u2019hui."},{exit:["revolutionnaire-femme"]},{speaker:"rodolf",expression:"NEUTRE",side:"right",text:"Nos gens tiennent \xE0 peine sur leurs pieds. Tu comptes leur laisser souffler un peu ?"},{speaker:"edward",expression:"NEUTRE",text:"Ils ont attendu un mois. Le peuple n\u2019a pas ce luxe."},{exit:["rodolf"]},{speaker:"clea",expression:"DETERMINEE",side:"right",text:"Rodolf a raison sur un point. Les bless\xE9s doivent rester ici. J\u2019ai d\xE9j\xE0 pr\xE9par\xE9 une \xE9quipe pour eux."},{speaker:"edward",expression:"NEUTRE",text:"Bien. Tu superviseras les soins."},{exit:["clea"]},{speaker:"albus",expression:"REFLEXION",side:"right",text:"J\u2019ai rep\xE9r\xE9 un passage que les gardes du ch\xE2teau n\u2019ont pas encore fortifi\xE9."},{exit:["albus"]},{speaker:"brumebarbe",expression:"NEUTRE",side:"right",text:"Et je vous demande une derni\xE8re chose : lorsque les portes c\xE9deront, souvenez-vous pourquoi vous \xEAtes venus."},{speaker:"edward",expression:"NEUTRE",text:"Pour mettre fin \xE0 la souffrance de ce royaume."},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",text:"Que ce soit toujours vrai, m\xEAme devant votre p\xE8re."},{direction:"Edward incline la t\xEAte. Son regard reste dur.",pause:300}]},Fy={id:"esperia-m07-porte",backdrop:"battle",trigger:{kind:"afterTurn",turn:8},entries:[{speaker:"rodolf",expression:"COLERE",side:"right",text:"La porte tient bon ! Encore un effort !"},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Pas de poursuite inutile. Notre objectif est le passage, pas le massacre."}]},By={id:"esperia-m07-outro",backdrop:"esperia-castle-gate",trigger:{kind:"victory"},transition:"fade",music:"esperia-map",entries:[{speaker:"revolutionnaire-femme",expression:"SOURIRE",side:"right",text:"Le chemin du ch\xE2teau est ouvert."},{exit:["revolutionnaire-femme"]},{speaker:"rodolf",expression:"SOURIRE",side:"right",text:"Voil\xE0. Le reste, c\u2019est une simple petite visite au roi."},{speaker:"clea",expression:"NEUTRE",side:"left",text:"Rodolf\u2026"},{speaker:"rodolf",expression:"NEUTRE",text:"Oui. D\u2019accord. Ce n\u2019\xE9tait pas dr\xF4le."},{exit:["rodolf","clea"]},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Merci \xE0 tous. Aucun de vous n\u2019\xE9tait oblig\xE9 de revenir pour moi."},{speaker:"revolutionnaire-homme",expression:"NEUTRE",side:"right",text:"Nous ne revenons pas seulement pour vous, mon prince. Nous revenons pour Esperia."},{speaker:"edward",expression:"TRISTESSE",text:"Alors ne laissons pas notre royaume tomber une seconde fois."}]},jy={id:"esperia-m08-porte",backdrop:"esperia-castle-gate",trigger:{kind:"before"},music:"esperia-map",entries:[{show:[{character:"edward",expression:"NEUTRE",side:"left"},{character:"clea",expression:"DETERMINEE",side:"right"}],pause:600},{direction:"Le groupe franchit les portes du ch\xE2teau. M\xEAme salle du tr\xF4ne qu\u2019autrefois."}]},Gy={id:"esperia-m08-trone",backdrop:"esperia-throne",trigger:{kind:"before"},transition:"fade",music:"esperia-boss-02",musicFade:2,entries:[{speaker:"eustach-corrompu",expression:"MEPRIS",side:"right",text:"Te voil\xE0 donc revenu, Edward. Entour\xE9 de ceux qui ont trahi leur roi."},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Ils ont refus\xE9 vos ordres parce qu\u2019ils \xE9taient injustes. Votre peuple a faim pendant que vous traquez ceux qui osent le dire."},{speaker:"eustach-corrompu",expression:"COLERE",text:"Mon peuple ? Tu parles comme si tu portais d\xE9j\xE0 ma couronne."},{speaker:"edward",expression:"NEUTRE",text:"Je n\u2019en veux pas \xE0 ce prix. Rendez-vous. Laissez-les vivre."},{exit:["eustach-corrompu"]},{speaker:"von-schwartz",expression:"MEPRIS",side:"right",text:"Quelle modestie, prince. Vous voici pourtant avec une arm\xE9e jusque dans la salle du tr\xF4ne."},{exit:["edward"]},{speaker:"rodolf",expression:"COLERE",side:"left",text:"Et vous, vous vous tenez toujours \xE0 l\u2019abri derri\xE8re lui."},{speaker:"von-schwartz",expression:"MALEFIQUE",text:"J\u2019ai appris que la bravoure n\u2019est qu\u2019un autre nom de l\u2019imprudence."},{exit:["rodolf"]},{speaker:"edward",expression:"COLERE",side:"left",text:"Vous avez tu\xE9 Lars."},{speaker:"von-schwartz",expression:"MALEFIQUE",text:"Votre ami s\u2019est offert lui-m\xEAme."},{direction:"Edward serre les poings. Cl\xE9a a remarqu\xE9 sa col\xE8re.",exit:["von-schwartz"],show:[{character:"clea",expression:"DETERMINEE",side:"right"}]},{speaker:"clea",expression:"DETERMINEE",side:"right",text:"Edward\u2026 n\u2019oublie pas ce que tu nous as promis."},{speaker:"edward",expression:"NEUTRE",text:"Je sais."},{exit:["clea"]},{speaker:"eustach-corrompu",expression:"COLERE",side:"right",text:"Assez. Cette fois, il n\u2019y aura pas de sortie."},{exit:["eustach-corrompu"]},{speaker:"von-schwartz",expression:"MALEFIQUE",side:"right",text:"Alors perdons-nous une derni\xE8re fois dans le mensonge des apparences."},{direction:"L\u2019illusion de Von Schwartz se referme sur la salle : les rangs se m\xEAlent.",fx:"flash",fxColor:11553535}]},Ky={id:"esperia-m08-illusion",backdrop:"battle",trigger:{kind:"afterTurn",turn:2},entries:[{speaker:"albus",expression:"REFLEXION",side:"right",text:"Ce sort trouble nos perceptions\u2026 M\xEAme nos formations nous paraissent \xE9trang\xE8res !"},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Une illusion puissante, certes. Mais aucune magie n\u2019est sans limites. Restez unis et combattez !"},{exit:["brumebarbe"]},{speaker:"edward",expression:"NEUTRE",side:"left",text:"Nous avons d\xE9j\xE0 vu ce tour. Il ne nous trompera plus."}]},zy={id:"esperia-m08-blessures",backdrop:"esperia-throne",trigger:{kind:"before"},music:"esperia-boss-02",entries:[{direction:"Le sort se d\xE9chire : la salle du tr\xF4ne retrouve son vrai visage, et chaque soldat sa place.",fx:"flash",fxColor:16777215},{speaker:"von-schwartz",expression:"COLERE",side:"right",text:"Vous osez briser mon sort ?!"},{direction:"Von Schwartz frappe le groupe d\u2019une d\xE9charge de magie. Rodolf s\u2019interpose ; Cl\xE9a est touch\xE9e \xE0 l\u2019\xE9paule.",fx:"flash",fxColor:11553535},{speaker:"rodolf",expression:"COLERE",side:"left",text:"Argh\u2026 !"},{exit:["rodolf"]},{speaker:"clea",expression:"SURPRISE",side:"left",text:"Rodolf !"},{exit:["clea"]},{speaker:"edward",expression:"SURPRISE",side:"left",text:"Non ! Repliez-vous !"},{exit:["edward"]},{speaker:"rodolf",expression:"NEUTRE",side:"left",text:"J\u2019ai connu\u2026 des coups plus polis. Va finir ce que tu as commenc\xE9."},{exit:["von-schwartz"]},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"right",text:"Ses blessures sont graves. Albus, aide-moi."},{exit:["brumebarbe"]},{speaker:"albus",expression:"COLERE",side:"right",text:"Il nous faut du temps !"},{exit:["albus","rodolf"]},{speaker:"von-schwartz",expression:"MALEFIQUE",side:"right",text:"Il ne vous en reste presque plus."}]},Hy={id:"esperia-m08-sceaux",backdrop:"battle",trigger:{kind:"event",name:"boss-bound-lost"},entries:[{speaker:"von-schwartz",expression:"CRI",side:"right",text:"Impossible\u2026 Mes sceaux !"},{speaker:"edward",expression:"COLERE",side:"left",text:"C\u2019est fini. Tu ne nous prendras plus rien."}]},Vy={id:"esperia-m08-rodolf",backdrop:"esperia-throne",trigger:{kind:"victory"},transition:"fade",music:"esperia-sad",musicFade:2.8,mood:"calm",entries:[{direction:"Le dernier coup est jou\xE9. La salle du tr\xF4ne est plong\xE9e dans un silence presque total.",pause:400},{speaker:"rodolf",expression:"NEUTRE",side:"right",text:"Alors\u2026 on l\u2019a fait ?"},{speaker:"edward",expression:"SURPRISE",side:"left",text:"Rodolf ! Tiens bon ! Cl\xE9a peut encore te soigner."},{exit:["edward"]},{speaker:"clea",expression:"TRISTE",side:"left",text:"Je fais tout ce que je peux\u2026 mais la magie de Von Schwartz est encore dans la blessure."},{speaker:"rodolf",expression:"SOURIRE",text:"Ce n\u2019est pas\u2026 la t\xEAte que je faisais pour mon grand retour triomphal."},{exit:["clea"]},{speaker:"edward",expression:"TRISTESSE",side:"left",text:"Ne plaisante pas. Pas maintenant."},{speaker:"rodolf",expression:"NEUTRE",text:"Si je ne plaisante pas maintenant\u2026 quand est-ce que je le ferai ?"},{direction:"Il tente de sourire. Sa respiration faiblit.",pause:600},{speaker:"rodolf",expression:"NEUTRE",text:"Vous \xE9tiez\u2026 les meilleurs compagnons\u2026 qu\u2019un gros idiot pouvait esp\xE9rer."},{exit:["edward"]},{speaker:"clea",expression:"TRISTE",side:"left",text:"Tu n\u2019es pas un idiot."},{speaker:"rodolf",expression:"SOURIRE",text:"Ah\u2026 voil\xE0 quelque chose\u2026 \xE0 dire \xE0 Lars\u2026"},{show:[{character:"rodolf",expression:"NEUTRE",side:"right"}],pause:900},{exit:["rodolf"],pause:2600},{exit:["clea"]},{speaker:"edward",expression:"TRISTESSE",side:"left",text:"Pas toi aussi\u2026"},{pause:1600}]},$y={id:"esperia-m08-pierre",backdrop:"esperia-throne",trigger:{kind:"victory"},music:"esperia-sad",entries:[{direction:"Edward se rel\xE8ve. Son chagrin devient une col\xE8re implacable. Eustach et Von Schwartz sont vaincus \u2014 mais encore l\xE0.",show:[{character:"edward",expression:"COLERE",side:"left"},{character:"von-schwartz",expression:"MEPRIS",side:"right"}]},{speaker:"von-schwartz",expression:"MEPRIS",side:"right",text:"Voil\xE0 le prix de votre r\xE9bellion."},{speaker:"edward",expression:"COLERE",side:"left",text:"Non. Voil\xE0 le prix de vos crimes."},{exit:["von-schwartz"]},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"right",text:"Edward. La bataille est termin\xE9e."},{exit:["brumebarbe"]},{direction:"Edward tue Von Schwartz.",fx:"flash",fxColor:7999520,pause:900},{speaker:"eustach-corrompu",expression:"COLERE",side:"right",text:"Tu oses lever la main sur ceux qui servent ton roi ?"},{speaker:"edward",expression:"COLERE",text:"Il ne reste plus rien du p\xE8re que j\u2019ai connu."},{speaker:"eustach-corrompu",expression:"MEPRIS",text:"Tu as toujours convoit\xE9 ma place."},{speaker:"edward",expression:"TRISTESSE",text:"J\u2019aurais pr\xE9f\xE9r\xE9 qu\u2019elle reste la v\xF4tre."},{direction:"Edward tue son p\xE8re.",exit:["eustach-corrompu"],pause:1800},{show:[{character:"clea",expression:"TRISTE",side:"right"}],pause:500},{speaker:"clea",expression:"TRISTE",side:"right",text:"Edward\u2026 c\u2019est termin\xE9. Viens."},{speaker:"edward",expression:"NEUTRE",text:"Non."},{direction:"Il remarque la pierre et la ramasse. Une lueur sombre se d\xE9ploie autour de lui."},{exit:["edward"],fx:"flash",fxColor:11553535,pause:300},{show:[{character:"edward-corrompu",expression:"NEUTRE",side:"left"}],pause:1400},{exit:["clea"]},{speaker:"albus",expression:"SURPRISE",side:"right",text:"Brumebarbe\u2026 la pierre !"},{exit:["albus"]},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"right",text:"Edward ! L\xE2chez-la imm\xE9diatement !"},{direction:"Edward se tourne lentement vers eux. Il n\u2019a plus le regard de son ancien lui.",pause:600}]},Jy={id:"esperia-m08-fuite",backdrop:"esperia-throne",trigger:{kind:"victory"},mood:"calm",entries:[{show:[{character:"edward-corrompu",expression:"NEUTRE",side:"left"},{character:"clea",expression:"TRISTE",side:"right"}],pause:500},{speaker:"clea",expression:"TRISTE",side:"right",text:"Edward ? C\u2019est moi\u2026 Regarde-moi, s\u2019il te pla\xEEt."},{direction:"Malgr\xE9 sa blessure, Cl\xE9a veut avancer vers lui. Albus et Brumebarbe la retiennent.",exit:["edward-corrompu"],show:[{character:"albus",expression:"TRISTE",side:"left"}]},{speaker:"albus",expression:"TRISTE",side:"left",text:"Cl\xE9a, non !"},{speaker:"clea",expression:"COLERE",side:"right",text:"Il m\u2019entendra. Il doit m\u2019entendre !"},{exit:["albus"]},{speaker:"brumebarbe",expression:"TRISTE",side:"left",text:"L\u2019Edward que vous connaissiez ne peut plus vous r\xE9pondre. Pas maintenant."},{speaker:"clea",expression:"COLERE",text:"On ne peut pas le laisser ici !"},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",text:"Si nous restons, la pierre nous prendra aussi. Il est trop tard pour l\u2019atteindre aujourd\u2019hui."},{direction:"Elle reste fig\xE9e. Puis Albus et Brumebarbe l\u2019entra\xEEnent vers la sortie.",exit:["brumebarbe"],pause:400},{speaker:"clea",expression:"TRISTE",side:"right",text:"Edward\u2026"},{exit:["clea"],pause:900},{show:[{character:"edward-corrompu",expression:"NEUTRE",side:"left"}],pause:1600},{direction:"Edward reste seul dans la salle du tr\xF4ne, la pierre entre les mains."},{exit:["edward-corrompu"],pause:1e3}]},Yy={id:"esperia-m08-foret",backdrop:"esperia-refuge",trigger:{kind:"victory"},transition:"fade",night:!0,mood:"calm",entries:[{pause:900},{direction:"Loin du ch\xE2teau, Cl\xE9a, Albus et Brumebarbe s\u2019enfoncent dans la for\xEAt sylvestre."},{direction:"Fin de la campagne d\u2019Esperia."}]},wp=[Uy,Fy,By,jy,Gy,Ky,zy,Hy,Vy,$y,Jy,Yy];var Wy={id:"onishima-m01-the",backdrop:"oni-pavillon-nuit",trigger:{kind:"before"},music:"onishima-map",mood:"calm",entries:[{direction:"Le pavillon des jardins, tard dans la nuit. La lune est pleine."},{speaker:"hikaru",expression:"SOURIRE",side:"right",text:"Tu es en retard, princesse. J\u2019ai failli croire que tu avais trouv\xE9 un pr\xE9tendant plus int\xE9ressant que moi."},{speaker:"akaza",expression:"JOIE",side:"left",text:"Il n\u2019y en a pas. J\u2019ai cherch\xE9, pourtant. Ma m\xE8re m\u2019en pr\xE9sente un nouveau chaque saison."},{speaker:"hikaru",expression:"RIRE",text:"Et tu les fais tous fuir a
