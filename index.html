vec ton sabre de bois."},{speaker:"akaza",expression:"JOIE",text:"Seulement ceux qui le m\xE9ritent."},{pause:500},{speaker:"hikaru",expression:"NEUTRE",text:"Akaza\u2026 Il faut que je te dise quelque chose. Ce matin, un garde m\u2019a salu\xE9 par mon nom. Il ne m\u2019avait jamais adress\xE9 la parole."},{speaker:"akaza",expression:"NEUTRE",text:"Les gardes saluent tout le monde."},{speaker:"hikaru",expression:"NEUTRE",text:"Pas un serviteur des cuisines. Et hier, la dame de compagnie de ta m\xE8re m\u2019a demand\xE9 si je dormais bien. Elle souriait."},{speaker:"hikaru",expression:"NEUTRE",text:"Je crois que notre secret n\u2019en est plus un."},{speaker:"akaza",expression:"DETERMINEE",text:"Alors qu\u2019ils sachent. Je suis la fille du Shogun. Personne ne touchera \xE0 un homme que j\u2019ai choisi."},{speaker:"hikaru",expression:"NEUTRE",text:"C\u2019est justement parce que tu es sa fille que j\u2019ai peur."},{speaker:"akaza",expression:"JOIE",text:"Tu t\u2019inqui\xE8tes trop. Demain, j\u2019irai parler \xE0 ma m\xE8re. Ce soir, je veux seulement boire un th\xE9 avec toi."},{speaker:"hikaru",expression:"SOURIRE",text:"Le th\xE9 est froid depuis longtemps."},{speaker:"akaza",expression:"JOIE",text:"Alors je vais en refaire. Ne bouge pas."},{speaker:"hikaru",expression:"SOURIRE",text:"Je ne bouge jamais quand tu me le demandes."},{exit:["akaza"]},{direction:"Akaza s\u2019\xE9loigne vers la petite cuisine du jardin. Hikaru reste seul sous les lanternes.",pause:400}]},Qy={id:"onishima-m01-cri",backdrop:"oni-pavillon-nuit",trigger:{kind:"before"},music:"silence",entries:[{direction:"L\u2019eau commence \xE0 fr\xE9mir dans la bouilloire. Puis les lanternes du jardin s\u2019\xE9teignent, toutes en m\xEAme temps."},{fx:"flash",fxColor:11563263},{direction:"Un cri, bref. Puis plus rien.",pause:600},{speaker:"akaza",expression:"SURPRISE",side:"left",text:"Hikaru ?"},{direction:"Akaza court jusqu\u2019au pavillon. Hikaru est \xE9tendu pr\xE8s de la table basse. Il ne respire plus."},{speaker:"akaza",expression:"TRISTE",text:"Non\u2026 non, non. Hikaru, regarde-moi. Regarde-moi !"},{show:[{character:"ombre",expression:"VIOLETTE",side:"right"}]},{direction:"Des silhouettes sortent de l\u2019obscurit\xE9. Elles n\u2019ont pas de visage. Leur armure fume comme une braise froide."},{speaker:"akaza",expression:"COLERE",text:"Qui vous envoie ? R\xE9pondez !"},{direction:"Les ombres ne r\xE9pondent pas. Elles avancent."},{exit:["ombre"]},{speaker:"kimiko",expression:"DETERMINEE",side:"right",text:"Akaza ! Derri\xE8re moi, vite !"},{speaker:"akaza",expression:"TRISTE",text:"Kimiko\u2026 Il est mort. Ils l\u2019ont tu\xE9 pendant que je faisais chauffer de l\u2019eau."},{speaker:"kimiko",expression:"COLERE",text:"Je sais. Et ils vont te tuer aussi si tu restes \xE0 genoux. L\xE8ve-toi."},{speaker:"kimiko",expression:"DETERMINEE",text:"Il y en a d\u2019autres derri\xE8re. Toute une arm\xE9e. Quelque chose les appelle, l\xE0-bas, au fond du jardin : il faut l\u2019\xE9teindre, ou ils ne s\u2019arr\xEAteront jamais."},{speaker:"akaza",expression:"COLERE",text:"Je ne le laisse pas ici."},{speaker:"kimiko",expression:"TRISTE",text:"On reviendra pour lui. Je te le promets. Mais pas cette nuit."}]},Xy={id:"onishima-m01-vague",backdrop:"battle",trigger:{kind:"afterTurn",turn:2},entries:[{speaker:"kimiko",expression:"SURPRISE",side:"right",text:"Les cavaliers d\u2019ombre ! La deuxi\xE8me vague arrive !"},{speaker:"akaza",expression:"COLERE",side:"left",text:"Ils ne saignent pas. Ils ne crient pas. Qu\u2019est-ce que c\u2019est que ces choses ?"},{speaker:"kimiko",expression:"DETERMINEE",text:"Des choses qui ob\xE9issent \xE0 quelqu\u2019un. Frappe ce qui les appelle, et elles tomberont."}]},Zy={id:"onishima-m01-fuite",backdrop:"battle",trigger:{kind:"victory"},entries:[{direction:"Les ombres restantes se dissolvent comme de l\u2019encre dans l\u2019eau."},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"Elles reculent\u2026 Non. Elles disparaissent. Quelqu\u2019un les a rappel\xE9es."},{speaker:"akaza",expression:"TRISTE",side:"left",text:"Rappel\xE9es o\xF9 ?"},{speaker:"kimiko",expression:"NEUTRE",text:"Vers le palais. J\u2019ai vu leur fum\xE9e remonter vers les toits."}]},eg={id:"onishima-m01-aube",backdrop:"oni-pavillon-jour",trigger:{kind:"victory"},transition:"fade",music:"onishima-map",mood:"calm",musicFade:2,entries:[{direction:"\xC0 l\u2019aube. Le pavillon a \xE9t\xE9 lav\xE9. Il n\u2019y a plus de sang, plus de tasses, plus rien."},{speaker:"akaza",expression:"TRISTE",side:"left",text:"Ils ont tout nettoy\xE9 avant le lever du soleil. Comme s\u2019il n\u2019avait jamais exist\xE9."},{speaker:"kimiko",expression:"TRISTE",side:"right",text:"Le corps d\u2019Hikaru a \xE9t\xE9 emport\xE9 par les gens du palais. On dit qu\u2019il est tomb\xE9 dans l\u2019\xE9tang. Ivre."},{speaker:"akaza",expression:"COLERE",text:"Hikaru ne buvait pas."},{speaker:"kimiko",expression:"NEUTRE",text:"Je sais."},{pause:500},{speaker:"akaza",expression:"TRISTE",text:"Il m\u2019a dit que notre secret \xE9tait connu. Je lui ai r\xE9pondu qu\u2019il s\u2019inqui\xE9tait trop. Je suis partie faire du th\xE9."},{speaker:"kimiko",expression:"TRISTE",text:"Tu ne pouvais pas savoir."},{speaker:"akaza",expression:"TRISTE",text:"Si. Il me l\u2019a dit. Je n\u2019ai pas voulu l\u2019entendre."},{speaker:"kimiko",expression:"NEUTRE",text:"Ces ombres n\u2019\xE9taient pas des assassins ordinaires. On ne loue pas des choses pareilles au march\xE9."},{speaker:"akaza",expression:"DETERMINEE",text:"Alors quelqu\u2019un, ici, sait les appeler. Et je vais trouver qui."},{speaker:"kimiko",expression:"NEUTRE",text:"Doucement. Si c\u2019est quelqu\u2019un du palais, il nous regarde d\xE9j\xE0."},{speaker:"akaza",expression:"DETERMINEE",text:"Qu\u2019il regarde."}]},tg={id:"onishima-m02-cour",backdrop:"oni-cour-interieure-jour",trigger:{kind:"before"},music:"onishima-map-dark",entries:[{direction:"Trois jours plus tard. La cour int\xE9rieure du palais."},{speaker:"noble-02",expression:"PRETENTIEUX",side:"right",text:"Le seigneur Ishida, noy\xE9 dans son bain. Le vieux Morikawa, tomb\xE9 de son cheval. Quelle semaine malchanceuse."},{speaker:"noble-03",expression:"PRETENTIEUSE",side:"left",text:"Sans parler de ce gar\xE7on des cuisines. Les accidents, voyez-vous, vont toujours par trois."},{speaker:"noble-02",expression:"PRETENTIEUX",text:"Par quatre, Dame Sayuri. Mais qui compte les serviteurs ?"},{exit:["noble-03"]},{speaker:"akaza",expression:"COLERE",side:"left",text:"Moi, seigneur Kanemori. Je compte tout le monde."},{speaker:"noble-02",expression:"EFFRAYE",text:"Princesse ! Je\u2026 je ne vous avais pas vue."},{speaker:"akaza",expression:"NEUTRE",text:"Ishida et Morikawa \xE9taient dans le jardin, le soir de la f\xEAte des lanternes. Ils sont morts tous les deux depuis."},{speaker:"noble-02",expression:"NEUTRE",text:"Je l\u2019ignorais. Si vous voulez bien m\u2019excuser, princesse."},{exit:["noble-02"]},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"Tu viens de faire tr\xE8s peur \xE0 un homme qui ne savait rien. Bravo."},{speaker:"akaza",expression:"DETERMINEE",text:"Il sait qu\u2019il y a quelque chose \xE0 savoir. C\u2019est d\xE9j\xE0 beaucoup."}]},rg={id:"onishima-m02-trone",backdrop:"oni-trone-jour",trigger:{kind:"before"},entries:[{direction:"La salle du tr\xF4ne. Le Shogun est assis dans son armure, comme toujours. Personne ne se souvient de l\u2019avoir vu sans elle."},{speaker:"akaza",expression:"DETERMINEE",side:"left",text:"P\xE8re. Je demande une enqu\xEAte sur la mort d\u2019Hikaru, des cuisines du palais. Et sur celles des seigneurs Ishida et Morikawa."},{speaker:"fuji-maudit",expression:"NEUTRE",side:"right",text:"Un serviteur s\u2019est noy\xE9. Deux vieillards sont morts de vieillesse. Le palais a d\u2019autres soucis."},{speaker:"akaza",expression:"COLERE",text:"J\u2019\xE9tais l\xE0, cette nuit-l\xE0. J\u2019ai vu des ombres sans visage."},{pause:400},{speaker:"fuji-maudit",expression:"NEUTRE",text:"Tu \xE9tais l\xE0."},{exit:["fuji-maudit"]},{speaker:"dame-onishima",expression:"EVENTAIL",side:"right",text:"Dans un pavillon d\xE9sert, au milieu de la nuit, ma fille. Que faisais-tu donc si loin de tes appartements ?"},{speaker:"akaza",expression:"NEUTRE",text:"Je prenais le th\xE9."},{speaker:"dame-onishima",expression:"MALICE",text:"Avec un gar\xE7on des cuisines. Comme c\u2019est touchant."},{speaker:"akaza",expression:"SURPRISE",text:"Vous saviez."},{speaker:"dame-onishima",expression:"NEUTRE",text:"Tout le palais savait, Akaza. C\u2019est bien l\xE0 le probl\xE8me. Une princesse n\u2019a pas de secrets : seulement des rumeurs qu\u2019on laisse courir ou qu\u2019on fait taire."},{speaker:"akaza",expression:"COLERE",text:"Et celle-l\xE0, vous l\u2019avez fait taire ?"},{speaker:"dame-onishima",expression:"COLERE",text:"Surveille ta langue devant ton p\xE8re."},{show:[{character:"fuji-maudit",expression:"COLERE",side:"right"}]},{speaker:"fuji-maudit",expression:"COLERE",text:"Assez. L\u2019affaire est close. Va-t\u2019en."},{direction:"L\u2019armure du Shogun craque, comme du bois qui travaille. Un instant, ses yeux semblent briller sous le casque.",pause:300}]},sg={id:"onishima-m02-tadamasa",backdrop:"oni-cour-interieure-nuit",trigger:{kind:"before"},music:"onishima-map-dark",entries:[{direction:"La nuit suivante. Un message gliss\xE9 sous la porte d\u2019Akaza : le seigneur Tadamasa demande \xE0 la voir, en secret."},{speaker:"noble-01",expression:"EFFRAYE",side:"right",text:"Princesse\u2026 Merci d\u2019\xEAtre venue. Je n\u2019ose plus sortir de mes appartements."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Vous \xE9tiez au jardin le soir des lanternes, avec Ishida et Morikawa."},{speaker:"noble-01",expression:"EFFRAYE",text:"Nous avons vu quelque chose que nous n\u2019aurions pas d\xFB voir. Je vous dirai tout, mais pas ici. Les murs\u2026"},{speaker:"kimiko",expression:"SURPRISE",side:"left",text:"Trop tard pour les murs. Il y a du monde sur les toits."},{speaker:"noble-01",expression:"EFFRAYE",text:"Ils viennent pour moi !"},{speaker:"akaza",expression:"DETERMINEE",text:"Ils devront passer par nous. Restez entre Kimiko et moi, seigneur. Ne bougez pas avant que je vous le dise."}]},ig={id:"onishima-m02-lames",backdrop:"battle",trigger:{kind:"afterTurn",turn:3},entries:[{speaker:"kimiko",expression:"COLERE",side:"right",text:"Ce sont des gens du palais. Je reconnais leur fa\xE7on de tenir la lame."},{speaker:"akaza",expression:"DETERMINEE",side:"left",text:"Alors le palais vient de se trahir. Tenez bon, seigneur !"}]},ag={id:"onishima-m02-aveu",backdrop:"battle",trigger:{kind:"victory"},entries:[{speaker:"noble-01",expression:"EFFRAYE",side:"right",text:"Ils sont partis ? Vraiment partis ?"},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Pour cette nuit. Parlez, seigneur. Qu\u2019avez-vous vu au jardin ?"},{speaker:"noble-01",expression:"NEUTRE",text:"Des hommes sans visage, qui sortaient de l\u2019armurerie du Shogun. Ils marchaient sans bruit. Ils ne laissaient pas de traces dans la ros\xE9e."},{speaker:"noble-01",expression:"NEUTRE",text:"Et cette nuit-l\xE0, la garde du pavillon des jardins avait \xE9t\xE9 relev\xE9e plus t\xF4t que d\u2019habitude. Sur ordre. Un ordre venu d\u2019en haut."},{speaker:"akaza",expression:"SURPRISE",text:"D\u2019en haut\u2026 de qui ?"},{speaker:"noble-01",expression:"EFFRAYE",text:"Je ne sais pas, et je ne veux pas le savoir. Je quitte la capitale demain. Ne me cherchez pas, princesse. Je vous en supplie."}]},og={id:"onishima-m02-nuit",backdrop:"oni-quartier-canal-nuit",trigger:{kind:"victory"},transition:"fade",music:"onishima-map-dark",entries:[{direction:"Plus tard, au bord du canal, loin des oreilles du palais."},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"L\u2019armurerie de ton p\xE8re. Tu as entendu comme moi."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"L\u2019armurerie n\u2019est pas mon p\xE8re. Cent personnes y entrent chaque jour."},{speaker:"kimiko",expression:"NEUTRE",text:"Cent personnes ne peuvent pas relever la garde des jardins."},{speaker:"akaza",expression:"COLERE",text:"Je le sais, Kimiko ! Ne me le fais pas dire."},{pause:400},{speaker:"akaza",expression:"TRISTE",text:"Pardon. Je ne veux pas le croire. Pas encore. Il me faut plus qu\u2019un vieillard terrifi\xE9."},{speaker:"kimiko",expression:"NEUTRE",text:"Alors \xE9coute \xE7a : le Shogun pr\xE9pare une exp\xE9dition vers les terres maudites du sud. Elle part dans trois jours. Ses meilleurs soldats."},{speaker:"akaza",expression:"SURPRISE",text:"Les terres maudites ? Personne n\u2019y va depuis quinze ans."},{speaker:"kimiko",expression:"NEUTRE",text:"Depuis que ton p\xE8re en est revenu avec son armure. Les ombres du jardin avaient la m\xEAme odeur que les vents du sud. Une odeur de cendre froide."},{speaker:"akaza",expression:"DETERMINEE",text:"Alors c\u2019est l\xE0-bas que se trouvent les r\xE9ponses. Je pars avec l\u2019exp\xE9dition."},{speaker:"kimiko",expression:"NEUTRE",text:"Ton p\xE8re ne te laissera jamais partir."},{speaker:"akaza",expression:"DETERMINEE",text:"Je ne compte pas lui demander."}]},ng={id:"onishima-m03-armurerie",backdrop:"oni-armurerie-salle-guerre",trigger:{kind:"before"},music:"onishima-map",entries:[{direction:"L\u2019armurerie du palais, la veille du d\xE9part."},{speaker:"fuji-maudit",expression:"NEUTRE",side:"right",text:"Tu ne partiras pas avec l\u2019exp\xE9dition."},{speaker:"akaza",expression:"DETERMINEE",side:"left",text:"Je suis la meilleure lame de ce palais apr\xE8s vous. Vous l\u2019avez dit vous-m\xEAme."},{speaker:"fuji-maudit",expression:"NEUTRE",text:"Je l\u2019ai dit quand tu avais douze ans. Les terres du sud ne sont pas un terrain d\u2019entra\xEEnement."},{speaker:"akaza",expression:"NEUTRE",text:"Qu\u2019est-ce que vos hommes vont chercher l\xE0-bas, p\xE8re ?"},{speaker:"fuji-maudit",expression:"COLERE",text:"Ce qui m\u2019appartient. Je reste au palais, et toi aussi. C\u2019est un ordre."},{exit:["fuji-maudit"]},{direction:"Le lendemain, \xE0 l\u2019aube, une colonne de soldats quitte la capitale. Le Shogun la regarde partir du haut des remparts, sans la suivre. Dans le dernier rang, un soldat un peu trop mince garde les yeux baiss\xE9s sous son casque."},{speaker:"soldat-02",expression:"NEUTRE",side:"right",text:"Toi, la recrue ! Ton nom ?"},{speaker:"akaza",expression:"NEUTRE",side:"left",as:"Recrue",text:"Aka\u2026 Akio. Akio, sergent."},{speaker:"soldat-02",expression:"NEUTRE",text:"Eh bien, Akio, tu porteras les vivres avec le convoi. Et redresse ce casque, on dirait qu\u2019il est trop grand pour toi."},{exit:["soldat-02"]},{speaker:"kimiko",expression:"JOIE",side:"right",as:"Recrue",text:"Akio. Vraiment. C\u2019est tout ce que tu as trouv\xE9 ?"},{speaker:"akaza",expression:"SURPRISE",text:"Kimiko ! Tu n\u2019\xE9tais pas cens\xE9e venir."},{speaker:"kimiko",expression:"NEUTRE",text:"Et toi, tu n\u2019\xE9tais pas cens\xE9e d\xE9sob\xE9ir au Shogun. On fait toutes les deux de notre mieux."}]},lg={id:"onishima-m03-col",backdrop:"oni-col-pont-nuit",trigger:{kind:"before"},entries:[{direction:"Le cinqui\xE8me soir. Le col de la route du sud, o\xF9 la montagne se resserre en un d\xE9fil\xE9."},{speaker:"soldat-01",expression:"NEUTRE",side:"right",text:"Le pont est \xE0 une heure de marche. Une fois de l\u2019autre c\xF4t\xE9, la route descend vers les terres maudites."},{speaker:"soldat-02",expression:"NEUTRE",side:"right",text:"Gardez les yeux ouverts. Le d\xE9fil\xE9 est un nid de r\u014Dnin. Ils pillent tout ce qui passe."},{exit:["soldat-01"]},{speaker:"kimiko",expression:"NEUTRE",side:"left",text:"Des pierres viennent de rouler, l\xE0-haut. Ce n\u2019est pas le vent."},{speaker:"soldat-02",expression:"CRI",text:"Embuscade ! Formez le cercle autour du convoi ! Sans vivres, nous n\u2019atteindrons jamais le sud !"},{speaker:"akaza",expression:"DETERMINEE",side:"left",text:"Kimiko, avec moi. Personne ne touche aux chariots."}]},cg={id:"onishima-m03-embuscade",backdrop:"battle",trigger:{kind:"afterTurn",turn:3},entries:[{speaker:"soldat-02",expression:"CRI",side:"right",text:"Ils visent les chariots ! Tenez la ligne !"},{speaker:"akaza",expression:"DETERMINEE",side:"left",text:"Encore un peu. Ils manqueront de souffle avant nous."}]},ug={id:"onishima-m03-bivouac",backdrop:"oni-col-pont-nuit",trigger:{kind:"victory"},transition:"fade",music:"onishima-map",entries:[{direction:"Le bivouac, de l\u2019autre c\xF4t\xE9 du pont."},{speaker:"soldat-02",expression:"NEUTRE",side:"right",text:"Pas un chariot perdu. Akio, tu te bats comme quelqu\u2019un qui a eu un tr\xE8s bon ma\xEEtre d\u2019armes."},{speaker:"akaza",expression:"NEUTRE",side:"left",as:"Recrue",text:"Mon p\xE8re tenait \xE0 ce que j\u2019apprenne, sergent."},{speaker:"soldat-02",expression:"NEUTRE",text:"Le mien aussi. Je m\u2019appelle Daigo. J\u2019\xE9tais d\xE9j\xE0 de l\u2019exp\xE9dition, il y a quinze ans. La premi\xE8re."},{speaker:"akaza",expression:"SURPRISE",text:"Celle dont le Shogun est revenu avec son armure ?"},{speaker:"soldat-02",expression:"TRISTE",text:"Celle dont personne d\u2019autre n\u2019est revenu, ou presque. Je n\u2019aime pas en parler."},{exit:["soldat-02"]},{speaker:"soldat-01",expression:"NEUTRE",side:"right",text:"Il y a autre chose, sergent. Les r\u014Dnin parlaient de deux voyageurs pass\xE9s avant nous sur la route. Une petite femme ronde, avec des lunettes\u2026 et un rocher qui marchait derri\xE8re elle."},{speaker:"kimiko",expression:"SURPRISE",side:"left",text:"Un rocher qui marchait."},{speaker:"soldat-01",expression:"NEUTRE",text:"C\u2019est ce qu\u2019ils ont dit. Ils avaient s\xFBrement trop bu."},{exit:["soldat-01"]},{speaker:"kimiko",expression:"NEUTRE",text:"Des r\u014Dnin qui ont peur de quelqu\u2019un. Ce n\u2019est pas tous les jours."},{speaker:"akaza",expression:"NEUTRE",text:"Peu importe qui marche devant nous. Ce que mon p\xE8re nous envoie chercher est au bout de cette route."}]},dg={id:"onishima-a01-intro",backdrop:"oni-village-brule-nuit",trigger:{kind:"before"},music:"onishima-map-dark",entries:[{direction:"Un poste de relais, dans la montagne. Il br\xFBle encore."},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"Le cheval du messager est revenu seul au bivouac. La selle \xE9tait encore chaude."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Et le messager ?"},{speaker:"kimiko",expression:"NEUTRE",text:"L\xE0-bas, au milieu des r\u014Dnin. Ils l\u2019ont attach\xE9 pr\xE8s de la r\xE9serve. Ils attendent s\xFBrement qu\u2019on paie pour lui."},{speaker:"akaza",expression:"DETERMINEE",text:"Nous ne paierons rien. On va le chercher et on le ram\xE8ne dans nos lignes."}]},pg={id:"onishima-a01-outro",backdrop:"oni-village-brule-nuit",trigger:{kind:"victory"},transition:"fade",entries:[{speaker:"soldat-01",expression:"NEUTRE",side:"right",as:"Le messager",text:"Merci\u2026 J\u2019ai cru que je finirais vendu dans une vall\xE9e perdue."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Que portais-tu de si pr\xE9cieux ?"},{speaker:"soldat-01",expression:"NEUTRE",as:"Le messager",text:"Des ordres pour les garnisons du sud. Elles doivent se replier vers le col et laisser la route libre. Je ne comprends pas pourquoi."},{speaker:"kimiko",expression:"NEUTRE",text:"Laisser la route libre\u2026 pour qui ?"},{speaker:"soldat-01",expression:"PEUR",as:"Le messager",text:"Je ne sais pas. Mais le sceau sur ces ordres n\u2019\xE9tait pas celui de l\u2019\xE9tat-major. C\u2019\xE9tait celui du Shogun lui-m\xEAme."},{speaker:"akaza",expression:"NEUTRE",text:"Garde ces ordres pour toi. Et reste pr\xE8s du sergent Daigo jusqu\u2019\xE0 la fin de la route."}]},Rp=[Wy,Qy,Xy,Zy,eg,tg,rg,sg,ig,ag,og,ng,lg,cg,ug,dg,pg];var hg={id:"onishima-m04-brume",backdrop:"oni-necropole-brumeuse",trigger:{kind:"before"},music:"onishima-map-dark",entries:[{direction:"Les terres maudites. La brume ne se l\xE8ve plus depuis trois jours. Les \xE9claireurs partis \xE0 l\u2019aube ne sont pas revenus."},{speaker:"soldat-02",expression:"PEUR",side:"right",text:"C\u2019est ici. C\u2019est exactement ici que tout a commenc\xE9, il y a quinze ans. Je reconnais ces arches."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Daigo. Qu\u2019est-ce qui s\u2019est pass\xE9 ici ?"},{speaker:"soldat-02",expression:"TRISTE",text:"Nous \xE9tions trois cents. Les morts se sont lev\xE9s de la terre et ont march\xE9 sur nous. Ils portaient nos armures, nos banni\xE8res. Ils avaient nos visages."},{exit:["soldat-02"]},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"Akaza. Il y a quelqu\u2019un, l\xE0, entre les pierres. Deux silhouettes. Une petite, et\u2026 une tr\xE8s grande."}]},mg={id:"onishima-m04-merella",backdrop:"oni-necropole-brumeuse",trigger:{kind:"before"},entries:[{show:[{character:"caillou",expression:"COLERE",side:"right"}]},{direction:"Une masse de pierre couverte de mousse se dresse entre elles et la brume. Deux yeux turquoise s\u2019allument au milieu de la roche."},{speaker:"caillou",expression:"COLERE",text:"Grrrmmm\u2026"},{speaker:"kimiko",expression:"SURPRISE",side:"left",text:"Un rocher qui marche. Les r\u014Dnin n\u2019avaient pas trop bu."},{speaker:"merella",expression:"SURPRISE",side:"right",text:"Caillou ! Doucement, voyons. Ce ne sont pas des morts : regarde, elles respirent. Elles respirent m\xEAme tr\xE8s fort."},{show:[{character:"caillou",expression:"INQUIET",side:"right"}]},{direction:"Le golem baisse lentement le bras, sans quitter Kimiko des yeux."},{exit:["caillou"]},{speaker:"merella",expression:"SOURIRE",side:"right",text:"Pardonnez-le. Il est tr\xE8s protecteur. Je m\u2019appelle Merella. Je viens de la for\xEAt de l\u2019Alliance Sylvestre, de l\u2019autre c\xF4t\xE9 des montagnes."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Akaza, du clan \u014Cnishima. Que fait une mage de la for\xEAt dans les terres maudites ?"},{speaker:"merella",expression:"REFLEXION",text:"Je cherche une pierre. Une pierre noire qui brille sans lumi\xE8re. On l\u2019appelle l\u2019Obscure Clart\xE9."},{speaker:"merella",expression:"REFLEXION",text:"Mon mari, Albus, la cherche de son c\xF4t\xE9 depuis des ann\xE9es. Elle a quitt\xE9 notre for\xEAt, et partout o\xF9 elle passe, les morts se r\xE9veillent."},{speaker:"kimiko",expression:"NEUTRE",text:"Et vous pensez qu\u2019elle est ici ?"},{speaker:"merella",expression:"NEUTRE",text:"Je pense qu\u2019elle y est pass\xE9e. Ce sol en garde la trace, comme une br\xFBlure. Mais elle n\u2019y est plus."},{show:[{character:"caillou",expression:"INQUIET",side:"right"}]},{direction:"Caillou tourne brusquement la t\xEAte vers la brume. Un grondement sourd monte de sa poitrine. Il tend un bras de pierre devant Merella."},{speaker:"caillou",expression:"INQUIET",text:"Rrrrr\u2026"},{exit:["caillou"]},{speaker:"merella",expression:"SURPRISE",text:"Il les a sentis avant nous. Ils arrivent. Beaucoup."},{show:[{character:"samourai-mort",expression:"VERTE",side:"right"}]},{direction:"Des rang\xE9es de samoura\xEFs sortent de la brume, armures rong\xE9es, yeux de feu vert. Ils marchent au pas, comme une arm\xE9e."},{speaker:"akaza",expression:"DETERMINEE",text:"Ils portent les couleurs de mon clan\u2026"},{exit:["samourai-mort"]},{speaker:"merella",expression:"COLERE",side:"right",text:"Ce combat est le v\xF4tre, princesse. Caillou et moi, nous tiendrons le passage derri\xE8re vous, pour qu\u2019ils ne vous prennent pas \xE0 revers."},{speaker:"akaza",expression:"DETERMINEE",text:"Kimiko, Daigo : en formation. Cette fois, ce sont eux qui vont reculer."}]},fg={id:"onishima-m04-mur",backdrop:"battle",trigger:{kind:"afterTurn",turn:6},entries:[{speaker:"soldat-02",expression:"CRI",side:"right",text:"Ils ne tombent pas ! Ils se rel\xE8vent !"},{speaker:"akaza",expression:"DETERMINEE",side:"left",text:"Leur commandant les tient debout. Abattez le commandant, et les autres suivront."}]},yg={id:"onishima-m04-silence",backdrop:"battle",trigger:{kind:"victory"},entries:[{direction:"Le commandant mort-vivant s\u2019effondre. Autour de lui, les rangs se d\xE9font et retombent en poussi\xE8re."},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"C\u2019est fini. Ils ne se rel\xE8vent plus."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Pour combien de temps ?"}]},gg={id:"onishima-m04-depart",backdrop:"oni-necropole-brumeuse",trigger:{kind:"victory"},transition:"fade",music:"onishima-map",entries:[{direction:"Plus tard. Le passage est vide : Merella et le golem sont partis vers le sud, sans attendre."},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"Ils ont tenu le passage, comme promis. Et ils ont disparu. Elle a laiss\xE9 ce mot sur une pierre : \xAB La br\xFBlure continue vers le nord. Bonne chance, princesse. \xBB"},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Vers le nord\u2026 vers chez nous."},{show:[{character:"soldat-02",expression:"TRISTE",side:"right"}]},{speaker:"soldat-02",expression:"TRISTE",text:"Le commandant portait un vieux sceau. Je l\u2019ai connu, princesse. C\u2019\xE9tait le capitaine H\u014Dj\u014D. Il est mort ici, il y a quinze ans, pour couvrir la retraite du Shogun."},{speaker:"akaza",expression:"SURPRISE",text:"Tu savais qui j\u2019\xE9tais."},{speaker:"soldat-02",expression:"NEUTRE",text:"Depuis le premier jour, princesse. Personne ne redresse un casque de cette fa\xE7on, \xE0 part votre p\xE8re."},{speaker:"akaza",expression:"DETERMINEE",text:"Alors raconte-moi, Daigo. Raconte-moi ce qui s\u2019est pass\xE9 ici il y a quinze ans. Tout."}]},bg={id:"onishima-m05-legende",backdrop:"oni-necropole-brumeuse",trigger:{kind:"before"},music:"onishima-map-dark",entries:[{direction:"Le soir, autour d\u2019un feu maigre, au milieu des ruines."},{speaker:"soldat-02",expression:"NEUTRE",side:"right",text:"Il y a quinze ans, un d\xE9mon s\u2019\xE9tait install\xE9 dans un sanctuaire, au c\u0153ur de ces terres. Les gens l\u2019appelaient Onikami. Les morts se levaient pour lui."},{speaker:"soldat-02",expression:"NEUTRE",text:"Votre p\xE8re a refus\xE9 de laisser le sud mourir. Il a men\xE9 l\u2019arm\xE9e jusqu\u2019au sanctuaire. Moi, j\u2019\xE9tais devant la porte. Je n\u2019ai vu que la fin."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Et la fin ?"},{speaker:"soldat-02",expression:"TRISTE",text:"Il est ressorti seul. Il portait une armure que personne n\u2019avait jamais vue. Et il ne l\u2019a plus jamais enlev\xE9e."},{direction:"Les flammes baissent. Akaza ferme les yeux et tente d\u2019imaginer son p\xE8re, quinze ans plus t\xF4t, devant la porte du sanctuaire."}]},xg={id:"onishima-m05-souvenir",backdrop:"oni-sanctuaire-demoniaque",trigger:{kind:"before"},transition:"fade",music:"onishima-combat-03",entries:[{direction:"Quinze ans plus t\xF4t. Le sanctuaire d\u2019Onikami, sous une lune rouge."},{speaker:"fuji",expression:"NEUTRE",side:"left",text:"Onikami. Je suis Fuji, Shogun du clan \u014Cnishima. Tes morts ont pris trois de mes villages. Je viens te chasser de mes terres."},{fx:"flash",fxColor:16730682},{speaker:"onikami",expression:"Intrigue",side:"right",text:"Le Shogun \u014Cnishima. On m\u2019avait dit que tu \xE9tais fier. On ne m\u2019avait pas dit que tu \xE9tais seul."},{speaker:"fuji",expression:"STRATEGE",text:"Je ne suis pas seul. Mon arm\xE9e tient ta porte. Et tes deux gardiens ne passeront pas la nuit."},{speaker:"onikami",expression:"Meprisant",text:"Mes gardiens. Tu les regardes comme un fermier regarde des loups. Approche, alors. Montre-moi ce que vaut un homme qui veut prot\xE9ger son peuple."},{speaker:"fuji",expression:"COLERE",text:"Tu vas le voir."}]},vg={id:"onishima-m05-tentation",backdrop:"battle",trigger:{kind:"afterTurn",turn:3},entries:[{speaker:"onikami",expression:"Intrigue",side:"right",text:"Combien d\u2019hommes perdras-tu ce soir, Shogun ? Et demain ? Et l\u2019ann\xE9e prochaine ? Ta force a des limites. La mienne n\u2019en a pas."},{speaker:"fuji",expression:"NEUTRE",side:"left",text:"Garde tes paroles. Je n\u2019ai besoin que de mon sabre."}]},kg={id:"onishima-m05-griffe",backdrop:"battle",trigger:{kind:"event",name:"boss-opening"},entries:[{speaker:"onikami",expression:"Meprisant",side:"right",text:"Une lame d\u2019ombre, et l\u2019un de tes braves n\u2019est plus. Ce n\u2019\xE9tait qu\u2019un avant-go\xFBt, Shogun."},{speaker:"fuji",expression:"COLERE",side:"left",text:"Tu frappes dans le dos, d\xE9mon. Mon sabre, lui, te regardera en face."}]},Sg={id:"onishima-m05-armure",backdrop:"oni-sanctuaire-demoniaque",trigger:{kind:"victory"},transition:"fade",entries:[{direction:"Les deux gardiens sont tomb\xE9s. Onikami recule jusqu\u2019\xE0 l\u2019autel. Il ne para\xEEt ni bless\xE9, ni effray\xE9."},{speaker:"onikami",expression:"Triomphant",side:"right",text:"Bien. Tr\xE8s bien. Tu as gagn\xE9 cette nuit, Shogun. Je m\u2019en vais."},{speaker:"fuji",expression:"STRATEGE",side:"left",text:"Comme \xE7a ? Sans combattre ?"},{speaker:"onikami",expression:"Neutre",text:"Je ne combats que ce qui me r\xE9siste. Toi, tu as d\xE9j\xE0 commenc\xE9 \xE0 vouloir autre chose."},{direction:"Sur l\u2019autel repose une armure noire et rouge. Elle semble respirer."},{speaker:"onikami",expression:"Intrigue",text:"Elle est \xE0 toi. C\u2019est l\u2019armure du gardien de ce sanctuaire. Avec elle, plus aucun de tes hommes ne mourra \xE0 ta place. Tu pourras commander aux ombres elles-m\xEAmes."},{speaker:"fuji",expression:"NEUTRE",text:"Tu me laisses une arme. Pourquoi ?"},{speaker:"onikami",expression:"Triomphant",text:"Parce que tu la prendras de toute fa\xE7on. Les hommes comme toi prennent toujours."},{fx:"flash",fxColor:11563263},{direction:"Onikami se dissout dans l\u2019ombre de l\u2019autel. Le silence retombe. Fuji reste longtemps immobile devant l\u2019armure."},{speaker:"fuji",expression:"NEUTRE",text:"Plus aucun mort pour me prot\xE9ger\u2026"},{speaker:"fuji",expression:"COLERE",text:"Je sais ce que tu es. Je sais ce que tu co\xFBtes. Je te prends quand m\xEAme."},{direction:"Il tend la main vers l\u2019armure.",pause:600}]},Eg={id:"onishima-m05-present",backdrop:"oni-necropole-brumeuse",trigger:{kind:"victory"},transition:"fade",music:"onishima-map",mood:"calm",entries:[{direction:"Le pr\xE9sent. Le feu est presque \xE9teint."},{speaker:"akaza",expression:"TRISTE",side:"left",text:"Il ne l\u2019a pas vaincu. Le d\xE9mon est parti\u2026 et il lui a laiss\xE9 l\u2019armure."},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"On ne laisse pas un cadeau pareil \xE0 son ennemi sans raison."},{speaker:"akaza",expression:"NEUTRE",text:"Les ombres du jardin. Les hommes sans visage qui sortaient de l\u2019armurerie. Tout revient \xE0 cette armure."},{speaker:"kimiko",expression:"NEUTRE",text:"Et la pierre de Merella ? Sa \xAB br\xFBlure \xBB qui remonte vers le nord ?"},{speaker:"akaza",expression:"DETERMINEE",text:"Je ne sais pas encore. Mais tout ce que mon p\xE8re fait, il l\u2019\xE9crit. Les archives du palais gardent ses ordres depuis vingt ans. Nous rentrons."}]},wg={id:"onishima-m06-nuit",backdrop:"oni-cour-eau-nuit",trigger:{kind:"before"},music:"onishima-map-dark",entries:[{direction:"De retour \xE0 la capitale. Une nuit sans lune, au bord de l\u2019\xE9tang du palais."},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"Les archives secr\xE8tes sont sous l\u2019aile est. Deux gardes \xE0 la porte, quatre \xE0 l\u2019int\xE9rieur, et un archiviste qui ne dort jamais."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Je pourrais entrer par la grande porte. Je suis la princesse."},{speaker:"kimiko",expression:"COLERE",text:"Et la princesse aurait \xE9t\xE9 vue par six personnes avant d\u2019ouvrir un seul tiroir. Non. Tu fais le guet, je vais chercher le registre."},{speaker:"akaza",expression:"DETERMINEE",text:"Tu entres, je couvre. Si quelqu\u2019un te voit, je le retiens."},{speaker:"kimiko",expression:"JOIE",text:"Voil\xE0. Tu commences \xE0 penser comme une ninja."}]},Rg={id:"onishima-m06-archives",backdrop:"oni-archives-palais",trigger:{kind:"before"},entries:[{direction:"Les archives. Des milliers de rouleaux, sous la lumi\xE8re des lanternes."},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"Les registres du Shogun sont rang\xE9s au fond, sous scell\xE9. Celui de l\u2019ann\xE9e de l\u2019armure doit \xEAtre sur la table de l\u2019archiviste."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Prends-le et file par la fen\xEAtre du nord. Je m\u2019occupe des gardes."}]},Pg={id:"onishima-m06-alerte",backdrop:"battle",trigger:{kind:"afterTurn",turn:3},entries:[{speaker:"soldat-01",expression:"CRI",side:"right",as:"Garde des archives",text:"Des intrus ! Br\xFBlez les registres scell\xE9s, ordre du chambellan !"},{speaker:"kimiko",expression:"DETERMINEE",side:"left",text:"Ils veulent tout br\xFBler. Plus vite !"}]},Mg={id:"onishima-m06-registre",backdrop:"oni-cour-eau-nuit",trigger:{kind:"victory"},transition:"fade",music:"onishima-map-dark",entries:[{direction:"Plus tard, \xE0 l\u2019abri, sous une lanterne masqu\xE9e. Kimiko d\xE9roule le registre."},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"\xAB Ordre secret. Une troupe de six ninjas se rendra dans la for\xEAt de l\u2019Alliance Sylvestre. Elle en rapportera la pierre noire appel\xE9e l\u2019Obscure Clart\xE9, gard\xE9e dans le sanctuaire du c\u0153ur de la for\xEAt. \xBB Le sceau est celui de ton p\xE8re."},{speaker:"akaza",expression:"SURPRISE",side:"left",text:"L\u2019Obscure Clart\xE9\u2026 La pierre que cherche Merella."},{speaker:"kimiko",expression:"NEUTRE",text:"Il y a une note de la main de l\u2019archiviste : \xAB La pierre \xE9tait scell\xE9e. Le sceau a \xE9t\xE9 bris\xE9. Deux des six ne sont pas revenus. \xBB"},{speaker:"akaza",expression:"COLERE",text:"Il a fait voler une chose sacr\xE9e chez nos voisins. Pourquoi ? Que voulait-il en faire ?"},{speaker:"kimiko",expression:"NEUTRE",text:"Ce n\u2019est pas \xE9crit ici. La derni\xE8re ligne dit seulement : \xAB La pierre a quitt\xE9 nos coffres. Voir le registre du pavillon diplomatique. \xBB"},{speaker:"akaza",expression:"DETERMINEE",text:"Alors nous irons voir le pavillon diplomatique."}]},Cg={id:"onishima-m07-pavillon",backdrop:"oni-pavillon-diplomatique",trigger:{kind:"before"},music:"onishima-map-dark",entries:[{direction:"Le pavillon diplomatique, o\xF9 le clan re\xE7oit les ambassades. Des tentures bleues du Sultanat pendent encore aux murs."},{speaker:"noble-03",expression:"NEUTRE",side:"right",text:"Princesse Akaza. Ce pavillon est ferm\xE9 depuis la signature de la paix du d\xE9sert. Que venez-vous y chercher ?"},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Le texte de cette paix, Dame Sayuri."},{speaker:"noble-03",expression:"PRETENTIEUSE",text:"Il est gard\xE9 par le chef des gardes, en personne, sur ordre du Shogun et de la reine. Vous n\u2019y toucherez pas."},{exit:["noble-03"]},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"Le chef des gardes porte un \xE9tui de laque \xE0 la ceinture. Il ne s\u2019en s\xE9pare jamais."},{speaker:"akaza",expression:"DETERMINEE",text:"Alors c\u2019est lui qu\u2019il nous faut. Les autres ne m\u2019int\xE9ressent pas."}]},Tg={id:"onishima-m07-chef",backdrop:"battle",trigger:{kind:"afterTurn",turn:7},entries:[{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"Le chef des gardes se met \xE0 l\u2019abri derri\xE8re ses hommes. Il sait ce qu\u2019il porte."},{speaker:"akaza",expression:"DETERMINEE",side:"left",text:"Il ne pourra pas se cacher longtemps."}]},Ag={id:"onishima-m07-traite",backdrop:"oni-pavillon-diplomatique",trigger:{kind:"victory"},transition:"fade",entries:[{direction:"L\u2019\xE9tui de laque est ouvert sur la table basse. \xC0 l\u2019int\xE9rieur, un trait\xE9 en deux langues."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"\xAB Le clan \u014Cnishima remet au G\xE9nie du Sultanat la pierre appel\xE9e l\u2019Obscure Clart\xE9. En \xE9change, le Sultanat reconna\xEEt pour toujours les fronti\xE8res de l\u2019est et renonce \xE0 toute guerre contre le clan. \xBB"},{speaker:"kimiko",expression:"SURPRISE",side:"right",text:"La paix du d\xE9sert. On l\u2019a f\xEAt\xE9e pendant une semaine. Tout le monde disait que le Shogun l\u2019avait obtenue par la seule force de son nom."},{speaker:"akaza",expression:"COLERE",text:"Il l\u2019a achet\xE9e. Avec une chose vol\xE9e."},{speaker:"kimiko",expression:"NEUTRE",text:"Regarde en bas. Il y a deux sceaux."},{speaker:"akaza",expression:"SURPRISE",text:"Celui de mon p\xE8re\u2026 et celui de ma m\xE8re."},{pause:500},{speaker:"akaza",expression:"TRISTE",text:"Ma m\xE8re lisait chaque lettre qui sortait du palais. Rien ne se d\xE9cidait sans elle. Rien."}]},Ig={id:"onishima-m07-nuit",backdrop:"oni-quartier-canal-nuit",trigger:{kind:"victory"},transition:"fade",music:"onishima-map",mood:"calm",entries:[{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"La pierre vol\xE9e dans la for\xEAt. La pierre donn\xE9e au G\xE9nie. Et des morts qui se l\xE8vent partout o\xF9 elle passe. Merella avait raison de la chercher."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Mon p\xE8re a vendu un malheur pour acheter une fronti\xE8re. Et ma m\xE8re a sign\xE9."},{speaker:"kimiko",expression:"NEUTRE",text:"Tu penses encore \xE0 Hikaru."},{speaker:"akaza",expression:"TRISTE",text:"Je ne pense qu\u2019\xE0 lui. La garde relev\xE9e sur un ordre venu d\u2019en haut. Les ombres qui sortent de l\u2019armurerie. Et deux sceaux au bas d\u2019un trait\xE9."},{speaker:"akaza",expression:"DETERMINEE",text:"Je vais parler \xE0 ma m\xE8re. Seule."},{speaker:"kimiko",expression:"COLERE",text:"Seule ? Dans ses appartements ? Avec sa garde derri\xE8re chaque paravent ?"},{speaker:"akaza",expression:"NEUTRE",text:"Tu seras derri\xE8re le mien."}]},Og={id:"onishima-a02-intro",backdrop:"oni-sanctuaire-bambou-nuit",trigger:{kind:"before"},music:"onishima-map-dark",entries:[{direction:"Un sanctuaire perdu au milieu des bambous, \xE0 une journ\xE9e de la capitale."},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"Le registre parlait de six ninjas. Deux ne sont pas revenus. Trois sont morts depuis, de \xAB maladie \xBB. Le dernier vit ici."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Alors il sait ce qu\u2019il risque en nous parlant."}]},Lg={id:"onishima-a02-recit",backdrop:"oni-sanctuaire-bambou-nuit",trigger:{kind:"before"},entries:[{speaker:"vieux-ninja",expression:"NEUTRE",side:"right",text:"Je vous attendais, princesse. Pas vous exactement. Quelqu\u2019un. T\xF4t ou tard, on vient toujours chercher le dernier t\xE9moin."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Racontez-moi la nuit de la for\xEAt."},{speaker:"vieux-ninja",expression:"NEUTRE",text:"La pierre reposait sous un arbre immense, dans un cercle de racines. Les gens de la for\xEAt disaient qu\u2019une Dame Nature s\u2019\xE9tait donn\xE9e tout enti\xE8re pour la sceller. On sentait encore sa pr\xE9sence. Comme une main sur l\u2019\xE9paule."},{speaker:"vieux-ninja",expression:"NEUTRE",text:"Nous avons bris\xE9 le sceau. L\u2019arbre a cri\xE9. Je l\u2019entends encore, certaines nuits."},{speaker:"vieux-ninja",expression:"NEUTRE",text:"Sur le chemin du retour, nous avons crois\xE9 des guerriers en armure noire, les Sombrelames. Ils ont seulement regard\xE9 la pierre passer\u2026 et quelque chose s\u2019est \xE9teint dans leurs yeux. La pierre les avait d\xE9j\xE0 touch\xE9s, avant nous."},{speaker:"kimiko",expression:"SURPRISE",side:"right",text:"Des bruits, dans les bambous. Ils vous ont suivis, ou ils nous ont suivies."},{speaker:"vieux-ninja",expression:"NEUTRE",text:"Les assassins du palais. Ils ont mis dix ans \xE0 venir. Ce sont des gens patients."},{speaker:"akaza",expression:"DETERMINEE",text:"Ils repartiront les mains vides. Kimiko, on le descend jusqu\u2019\xE0 l\u2019escalier du sanctuaire."}]},qg={id:"onishima-a02-outro",backdrop:"oni-sanctuaire-bambou-nuit",trigger:{kind:"victory"},transition:"fade",entries:[{speaker:"vieux-ninja",expression:"NEUTRE",side:"right",text:"Merci, princesse. Je vais dispara\xEEtre, cette fois pour de bon. Mais retenez ceci : la pierre n\u2019a pas de ma\xEEtre. Elle choisit ceux qui la portent, puis elle les d\xE9vore."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Et l\u2019armure de mon p\xE8re ? Vient-elle de la m\xEAme source ?"},{speaker:"vieux-ninja",expression:"NEUTRE",text:"Je l\u2019ignore. Mais la pierre et l\u2019armure sentaient la m\xEAme chose. La cendre froide."},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"La cendre froide. Comme les ombres du jardin."}]},Pp=[hg,mg,fg,yg,gg,bg,xg,vg,kg,Sg,Eg,wg,Rg,Pg,Mg,Cg,Tg,Ag,Ig,Og,Lg,qg];var Ng={id:"onishima-m08-appartements",backdrop:"oni-appartements-reine",trigger:{kind:"before"},music:"onishima-map-dark",entries:[{direction:"Les appartements de Dame \u014Cnishima. L\u2019encens br\xFBle. La reine ne l\xE8ve pas les yeux de sa lecture."},{speaker:"dame-onishima",expression:"NEUTRE",side:"right",text:"Tu entres sans te faire annoncer. Ton p\xE8re a raison : tu as perdu toutes tes mani\xE8res dans le sud."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Vous saviez que j\u2019\xE9tais partie avec l\u2019exp\xE9dition."},{speaker:"dame-onishima",expression:"MALICE",text:"Je sais tout ce qui se passe dans ce palais, ma fille. C\u2019est mon r\xF4le."},{speaker:"akaza",expression:"DETERMINEE",text:"Alors vous savez ce que j\u2019ai trouv\xE9. Un ordre de vol, scell\xE9 par mon p\xE8re. Un trait\xE9 de paix, scell\xE9 par vous deux. Une pierre sacr\xE9e \xE9chang\xE9e contre une fronti\xE8re."},{speaker:"dame-onishima",expression:"REFLEXION",text:"Une pierre contre dix ans de paix. Des milliers de vies \xE9pargn\xE9es. Tu appelles cela un crime ? Moi, j\u2019appelle cela gouverner."}]},_g={id:"onishima-m08-aveu",backdrop:"oni-appartements-reine",trigger:{kind:"before"},entries:[{speaker:"akaza",expression:"COLERE",side:"left",text:"Et Hikaru ? C\u2019\xE9tait aussi gouverner ?"},{pause:500},{speaker:"dame-onishima",expression:"NEUTRE",side:"right",text:"Oui."},{speaker:"akaza",expression:"SURPRISE",text:"Vous\u2026"},{speaker:"dame-onishima",expression:"NEUTRE",text:"Une princesse et un gar\xE7on des cuisines. La cour en parlait d\xE9j\xE0. Dans un mois, le Sultanat en aurait ri. Dans un an, nos ennemis s\u2019en seraient servis."},{speaker:"dame-onishima",expression:"NEUTRE",text:"Ton p\xE8re et moi l\u2019avons d\xE9cid\xE9 ensemble, un soir, dans cette chambre. Il a appel\xE9 ses ombres. J\u2019ai fait relever la garde des jardins. C\u2019\xE9tait simple."},{speaker:"akaza",expression:"TRISTE",text:"Simple\u2026"},{speaker:"dame-onishima",expression:"EVENTAIL",text:"Tu crois que je ne t\u2019aime pas, Akaza ? Je t\u2019ai prot\xE9g\xE9e de toi-m\xEAme. Comme une m\xE8re doit le faire."},{speaker:"akaza",expression:"TRISTE",text:"Ce n\u2019est pas de l\u2019amour, m\xE8re. Je ne sais pas ce que c\u2019est, mais ce n\u2019en est pas."},{speaker:"kimiko",expression:"COLERE",side:"left",text:"Akaza. Ses yeux. Regarde ses yeux."},{fx:"flash",fxColor:11563263},{direction:"Une lueur violette passe dans le regard de la reine. La m\xEAme lueur que sous le casque du Shogun."},{speaker:"dame-onishima",expression:"RIRE",text:"Ah, ta petite ninja est observatrice. Oui. L\u2019armure de ton p\xE8re est g\xE9n\xE9reuse. Elle partage son froid avec ceux qui dorment \xE0 ses c\xF4t\xE9s. Il y a bien longtemps que je n\u2019ai plus peur de rien."}]},Dg={id:"onishima-m08-ordre",backdrop:"oni-appartements-reine",trigger:{kind:"before"},entries:[{speaker:"dame-onishima",expression:"COLERE",side:"right",text:"Gardes ! Arr\xEAtez la princesse. Elle a vol\xE9 les archives de son p\xE8re et frapp\xE9 ses gardes. Vivante. Je la veux vivante."},{speaker:"akaza",expression:"DETERMINEE",side:"left",text:"Je ne l\xE8verai pas la main sur vous, m\xE8re. Pas aujourd\u2019hui. Vous serez jug\xE9e, pas assassin\xE9e."},{speaker:"kimiko",expression:"DETERMINEE",side:"left",text:"La porte d\xE9rob\xE9e, derri\xE8re le paravent ! Je l\u2019ouvre, tu me suis. Ne t\u2019arr\xEAte pour personne."}]},Ug={id:"onishima-m08-poursuite",backdrop:"battle",trigger:{kind:"afterTurn",turn:3},entries:[{speaker:"dame-onishima",expression:"COLERE",side:"right",text:"Fermez les portes ! Toutes les portes !"},{speaker:"kimiko",expression:"DETERMINEE",side:"left",text:"Pas celle-l\xE0. Celle-l\xE0, c\u2019est moi qui l\u2019ai cir\xE9e."}]},Fg={id:"onishima-m08-toits",backdrop:"oni-cour-eau-nuit",trigger:{kind:"victory"},transition:"fade",music:"onishima-map-dark",entries:[{direction:"Par la porte d\xE9rob\xE9e, puis par les toits. Les cris de la garde s\u2019\xE9loignent derri\xE8re elles."},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"On les a sem\xE9s. Pour l\u2019instant."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Elle n\u2019a m\xEAme pas h\xE9sit\xE9, Kimiko. Elle me l\u2019a dit comme on dit le prix du riz."}]},Bg={id:"onishima-m08-larmes",backdrop:"oni-pavillon-nuit",trigger:{kind:"victory"},transition:"fade",music:"onishima-map",mood:"calm",musicFade:2,entries:[{direction:"Le pavillon des jardins. Akaza n\u2019y \xE9tait pas revenue depuis la nuit du th\xE9."},{speaker:"akaza",expression:"TRISTE",side:"left",text:"Il \xE9tait assis l\xE0. Il riait de mon sabre de bois. Il avait peur pour moi, et je me moquais de lui."},{speaker:"kimiko",expression:"TRISTE",side:"right",text:"Il t\u2019aimait. Il savait ce qu\u2019il risquait, et il venait quand m\xEAme, chaque soir."},{speaker:"akaza",expression:"TRISTE",text:"Ils l\u2019ont d\xE9cid\xE9 ensemble. Mon p\xE8re et ma m\xE8re. Dans une chambre, entre deux lettres."},{pause:600},{speaker:"akaza",expression:"DETERMINEE",text:"Je vais aller voir mon p\xE8re. Je vais lui prendre cette armure. Tant qu\u2019il la porte, rien de ce qu\u2019il fait ne s\u2019arr\xEAtera."},{speaker:"kimiko",expression:"NEUTRE",text:"Tu sais qu\u2019il ne la rendra pas. Personne ne l\u2019a jamais vu sans elle."},{speaker:"akaza",expression:"DETERMINEE",text:"Alors je la lui arracherai."},{speaker:"kimiko",expression:"DETERMINEE",text:"Pas seule. Jamais seule."}]},jg={id:"onishima-m09-dehors",backdrop:"oni-chateau-jour",trigger:{kind:"before"},music:"onishima-map",entries:[{direction:"Le lendemain matin, devant le pont du ch\xE2teau. Deux silhouettes attendent pr\xE8s de la lanterne de pierre."},{speaker:"merella",expression:"SOURIRE",side:"right",text:"Princesse ! J\u2019ai suivi la br\xFBlure jusqu\u2019ici, comme je vous l\u2019avais \xE9crit. Et j\u2019ai entendu dire que la fille du Shogun \xE9tait recherch\xE9e par toute la garde. Alors j\u2019ai pens\xE9 que vous passeriez par l\xE0."},{show:[{character:"caillou",expression:"JOIE",side:"right"}]},{direction:"Le golem incline lentement sa t\xEAte de pierre en direction d\u2019Akaza. Un grondement bas, presque doux."},{speaker:"caillou",expression:"JOIE",text:"Hmmmrr."},{exit:["caillou"]},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Merella. La pierre que vous cherchez a \xE9t\xE9 vol\xE9e dans votre for\xEAt sur ordre de mon p\xE8re, puis donn\xE9e au G\xE9nie du Sultanat. J\u2019ai le trait\xE9."},{speaker:"merella",expression:"SURPRISE",text:"Au G\xE9nie\u2026 Alors elle a quitt\xE9 vos terres depuis longtemps. Albus devra l\u2019apprendre."},{speaker:"merella",expression:"REFLEXION",text:"Mais il en reste quelque chose ici. Un \xE9clat, dans cette armure dont tout le monde parle. Je le sens d\u2019ici. Ce n\u2019est pas une armure, princesse. C\u2019est une porte."},{speaker:"akaza",expression:"DETERMINEE",text:"Alors je vais la refermer. Je vais prendre cette armure \xE0 mon p\xE8re."},{speaker:"merella",expression:"COLERE",text:"La prendre ? Elle voudra vous prendre aussi. Elle prend tout ce qui la touche."},{speaker:"kimiko",expression:"NEUTRE",side:"left",text:"Nous le savons. Nous y allons quand m\xEAme."},{show:[{character:"caillou",expression:"INQUIET",side:"right"}]},{direction:"Caillou fait un pas lourd vers le ch\xE2teau, puis s\u2019arr\xEAte et pose une main de pierre devant Merella, comme pour la retenir."},{speaker:"caillou",expression:"INQUIET",text:"Grrr\u2026"},{exit:["caillou"]},{speaker:"merella",expression:"NEUTRE",text:"Oui, je sais, mon grand. Ce combat-l\xE0 n\u2019est pas le n\xF4tre. Nous restons dehors."},{speaker:"merella",expression:"SOURIRE",text:"Nous vous attendrons ici, princesse. Et quand vous serez reine, souvenez-vous de la for\xEAt."},{speaker:"akaza",expression:"NEUTRE",text:"Je m\u2019en souviendrai."}]},Gg={id:"onishima-m09-armurerie",backdrop:"oni-armurerie-salle-guerre",trigger:{kind:"before"},music:"onishima-map-dark",entries:[{direction:"L\u2019armurerie, au pied de la salle du tr\xF4ne. Les derniers fid\xE8les du Shogun barrent l\u2019escalier."},{speaker:"soldat-01",expression:"CRI",side:"right",as:"Capitaine des portes",text:"Ordre du Shogun ! La princesse Akaza est aux arr\xEAts. Quiconque l\u2019aide sera trait\xE9 en tra\xEEtre !"},{speaker:"soldat-02",expression:"NEUTRE",side:"left",text:"Alors je suis un tra\xEEtre, capitaine. J\u2019ai vu ce qu\u2019il y a au bout de la route du sud. Je suis avec la princesse."},{speaker:"akaza",expression:"DETERMINEE",side:"left",text:"Ouvrez les portes. Je n\u2019ai rien contre vous. C\u2019est \xE0 mon p\xE8re que je viens parler."},{speaker:"soldat-01",expression:"CRI",as:"Capitaine des portes",text:"Le Shogun ne re\xE7oit personne ! Fermez tout !"}]},Kg={id:"onishima-m09-preuves",backdrop:"battle",trigger:{kind:"afterTurn",turn:7},entries:[{speaker:"kimiko",expression:"COLERE",side:"right",text:"Ils ont allum\xE9 un brasero pr\xE8s des coffres. Ils br\xFBlent les ordres de l\u2019armurerie !"},{speaker:"akaza",expression:"DETERMINEE",side:"left",text:"Qu\u2019ils br\xFBlent du papier. J\u2019ai d\xE9j\xE0 ce qu\u2019il me faut."}]},zg={id:"onishima-m09-portes",backdrop:"oni-armurerie-salle-guerre",trigger:{kind:"victory"},transition:"fade",entries:[{direction:"Les portes de la salle du tr\xF4ne s\u2019ouvrent lentement. Derri\xE8re, tout est sombre."},{speaker:"soldat-02",expression:"NEUTRE",side:"right",text:"La reine s\u2019est enferm\xE9e dans ses appartements, princesse. Ses gardes ont d\xE9pos\xE9 les armes."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Qu\u2019on garde sa porte, Daigo. Personne ne la touche. Elle r\xE9pondra de ce qu\u2019elle a fait, devant tous."},{exit:["soldat-02"]},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"Il est l\xE0-dedans. Il ne s\u2019est pas montr\xE9 une seule fois pendant le combat."},{speaker:"akaza",expression:"DETERMINEE",text:"Il m\u2019attend. Il m\u2019a toujours attendue, depuis le jardin."},{speaker:"kimiko",expression:"NEUTRE",text:"Akaza\u2026 si l\u2019armure essaie de te parler, ne l\u2019\xE9coute pas."},{speaker:"akaza",expression:"DETERMINEE",text:"Je n\u2019\xE9couterai que toi."}]},Hg={id:"onishima-m10-trone",backdrop:"oni-trone-sombre",trigger:{kind:"before"},music:"silence",entries:[{direction:"La salle du tr\xF4ne. Les lanternes br\xFBlent bas. Le Shogun est debout devant son si\xE8ge, seul."},{speaker:"fuji-maudit",expression:"NEUTRE",side:"right",text:"Tu as pris l\u2019exp\xE9dition, les archives, le pavillon, ma garde. Il ne te reste que moi \xE0 prendre."},{speaker:"akaza",expression:"DETERMINEE",side:"left",text:"Je ne suis pas venue prendre votre tr\xF4ne, p\xE8re. Je suis venue prendre votre armure."},{speaker:"fuji-maudit",expression:"NEUTRE",text:"Personne ne me l\u2019a jamais demand\xE9e. Ils ont tous eu trop peur."}]},Vg={id:"onishima-m10-pere",backdrop:"oni-trone-sombre",trigger:{kind:"before"},music:"onishima-boss-01",entries:[{speaker:"akaza",expression:"COLERE",side:"left",text:"Hikaru. Dites son nom."},{speaker:"fuji-maudit",expression:"NEUTRE",side:"right",text:"Hikaru. Je l\u2019ai fait tuer. Ta m\xE8re et moi l\u2019avons d\xE9cid\xE9, et c\u2019est moi qui ai envoy\xE9 les ombres. Je ne te demanderai pas pardon."},{speaker:"akaza",expression:"TRISTE",text:"Pourquoi ? Vous aviez d\xE9j\xE0 tout. La paix, les fronti\xE8res, le pouvoir\u2026"},{speaker:"fuji-maudit",expression:"NEUTRE",text:"J\u2019ai accept\xE9 cette armure pour que plus aucun de mes soldats ne meure \xE0 ma place. Elle a tenu parole. Elle prend seulement autre chose, en \xE9change. Chaque jour un peu plus."},{speaker:"fuji-maudit",expression:"NEUTRE",text:"Je savais ce que je faisais en la prenant, Akaza. Je le sais encore. C\u2019est cela, le pouvoir : savoir, et continuer."},{speaker:"akaza",expression:"DETERMINEE",text:"Alors c\u2019est moi qui vous arr\xEAterai."},{speaker:"fuji-maudit",expression:"COLERE",text:"Essaie. Elle ne me laisse pas perdre."},{fx:"flash",fxColor:11563263}]},$g={id:"onishima-m10-armure-parle",backdrop:"battle",trigger:{kind:"afterTurn",turn:5},entries:[{speaker:"fuji-maudit",expression:"COLERE",side:"right",text:"Tu es forte, Akaza. Avec ce pouvoir, tu pourrais accomplir de grandes choses."},{speaker:"kimiko",expression:"DETERMINEE",side:"left",text:"Ne l\u2019\xE9coute pas, Akaza. Regarde-moi, et frappe."}]},Jg={id:"onishima-m10-genoux",backdrop:"oni-trone-sombre",trigger:{kind:"event",name:"phase-end"},music:"silence",musicFade:1.6,entries:[{direction:"Le Shogun tombe \xE0 genoux. Ses fid\xE8les d\xE9posent les armes. L\u2019armure craque, comme de la glace qui se fend."},{speaker:"fuji-maudit",expression:"NEUTRE",side:"right",text:"Elle\u2026 me l\xE2che. Quinze ans. Quinze ans qu\u2019elle ne m\u2019avait pas l\xE2ch\xE9."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Vous vivrez, p\xE8re. Vous serez jug\xE9."},{direction:"Les attaches de l\u2019armure se d\xE9font une \xE0 une. Les plaques de laque glissent sur le sol. Pour la premi\xE8re fois depuis quinze ans, Fuji est un vieil homme comme les autres."},{speaker:"kimiko",expression:"SURPRISE",side:"left",text:"Akaza\u2026 l\u2019armure. Elle bouge encore."}]},Yg={id:"onishima-m10-revelation",backdrop:"oni-trone-sombre",trigger:{kind:"before"},music:"onishima-boss-02",entries:[{fx:"flash",fxColor:16730682},{direction:"Une fum\xE9e noire s\u2019\xE9l\xE8ve de l\u2019armure vide et prend forme au-dessus du tr\xF4ne."},{speaker:"onikami",expression:"Triomphant",side:"right",text:"Enfin. Quinze ans \xE0 attendre dans cette coquille, \xE0 murmurer \xE0 l\u2019oreille d\u2019un Shogun. Il a \xE9t\xE9 si docile."},{speaker:"akaza",expression:"SURPRISE",side:"left",text:"Onikami. Le d\xE9mon du sanctuaire."},{speaker:"onikami",expression:"Meprisant",text:"Onikami. C\u2019est le nom que m\u2019ont donn\xE9 tes anc\xEAtres. Au d\xE9sert, on m\u2019appelle Shaytan. D\u2019autres m\u2019appellent l\u2019Avide. Autrefois, \xE0 Esperia, j\u2019\xE9tais un sorcier, et c\u2019est moi qui ai fa\xE7onn\xE9 la pierre que ton p\xE8re a vol\xE9e."},{speaker:"onikami",expression:"Intrigue",text:"Quinze ans plus t\xF4t, je ne me suis pas enfui, petite princesse. Je lui ai offert cette armure, et j\u2019y ai laiss\xE9 un \xE9clat de moi-m\xEAme. Il l\u2019a prise. Ils la prennent toujours."},{speaker:"onikami",expression:"Menacant",text:"Il a vol\xE9 la pierre pour moi sans le savoir. Il l\u2019a envoy\xE9e au d\xE9sert, o\xF9 mes autres serviteurs l\u2019attendaient. Et il a fait taire ton amant pour moi, aussi. Les c\u0153urs bris\xE9s font de si belles portes."},{speaker:"akaza",expression:"COLERE",text:"Vous avez pris mon p\xE8re. Vous avez pris Hikaru. Vous ne prendrez rien d\u2019autre."},{speaker:"onikami",expression:"Fureur",text:"Je prendrai l\u2019armure, et toi avec elle. Viens."},{speaker:"kimiko",expression:"DETERMINEE",side:"left",text:"Il faudra passer par moi d\u2019abord."}]},Wg={id:"onishima-m10-tentation",backdrop:"battle",trigger:{kind:"afterTurn",turn:6},entries:[{speaker:"onikami",expression:"Intrigue",side:"right",text:"Prends-la, princesse. Mets l\u2019armure. Plus personne ne te prendra jamais rien. Pas m\xEAme un gar\xE7on des cuisines."},{speaker:"akaza",expression:"COLERE",side:"left",text:"Taisez-vous."}]},Qg={id:"onishima-m10-dissipe",backdrop:"oni-trone-sombre",trigger:{kind:"victory"},entries:[{fx:"flash",fxColor:16730682},{speaker:"onikami",expression:"Fureur",side:"right",text:"Tu crois m\u2019avoir vaincu ? Tu n\u2019as d\xE9truit qu\u2019un \xE9clat. La pierre est ailleurs, et moi avec elle. Je reviendrai par elle, princesse. Je reviens toujours."},{direction:"La fum\xE9e se d\xE9chire et s\u2019\xE9teint. Le silence retombe sur la salle du tr\xF4ne."},{speaker:"kimiko",expression:"NEUTRE",side:"left",text:"Il est parti."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Il a seulement quitt\xE9 cette salle. Ce n\u2019est pas la m\xEAme chose."}]},Xg={id:"onishima-m10-armure",backdrop:"oni-trone-sombre",trigger:{kind:"victory"},music:"onishima-map-dark",musicFade:2,entries:[{direction:"L\u2019armure est rest\xE9e au pied du tr\xF4ne. Elle respire encore, faiblement."},{speaker:"kimiko",expression:"COLERE",side:"right",text:"Laisse-la. Fais-la jeter dans le plus profond puits du clan."},{speaker:"akaza",expression:"NEUTRE",side:"left",text:"Pour qu\u2019un autre la trouve dans dix ans ? Non. Quelqu\u2019un doit la garder. Quelqu\u2019un qui sait ce qu\u2019elle co\xFBte."},{speaker:"kimiko",expression:"TRISTE",text:"Akaza, non\u2026"},{direction:"Akaza pose la main sur l\u2019armure. Le froid remonte le long de son bras, jusqu\u2019au c\u0153ur.",fx:"flash",fxColor:11563263},{exit:["akaza"]},{show:[{character:"akaza-maudite",expression:"NEUTRE",side:"left"}]},{direction:"Quand elle se redresse, l\u2019armure est sur ses \xE9paules. Une lueur violette passe dans ses yeux, puis s\u2019\xE9teint."},{speaker:"akaza-maudite",expression:"NEUTRE",side:"left",text:"Elle me parle. Elle me promet que personne ne mourra plus jamais \xE0 ma place."},{speaker:"kimiko",expression:"COLERE",text:"C\u2019est exactement ce qu\u2019elle a promis \xE0 ton p\xE8re."},{speaker:"akaza-maudite",expression:"DETERMINEE",text:"Je sais. C\u2019est pour cela que je ne l\u2019\xE9couterai pas. Elle ne me changera pas. C\u2019est moi qui la tiendrai."},{speaker:"kimiko",expression:"TRISTE",text:"Ton p\xE8re aussi le croyait."},{speaker:"akaza-maudite",expression:"TRISTE",text:"Alors surveille-moi, Kimiko. Toi, et personne d\u2019autre."}]},Zg={id:"onishima-m10-jugement",backdrop:"oni-trone-jour",trigger:{kind:"victory"},transition:"fade",entries:[{direction:"Quelques jours plus tard. La salle du tr\xF4ne, en plein jour. La cour enti\xE8re est r\xE9unie."},{speaker:"akaza-maudite",expression:"NEUTRE",side:"left",text:"Fuji \u014Cnishima. Dame \u014Cnishima. Vous avez vol\xE9 une pierre sacr\xE9e chez nos voisins. Vous l\u2019avez vendue contre une fronti\xE8re. Vous avez fait assassiner Hikaru, des cuisines du palais, et les seigneurs Ishida et Morikawa."},{direction:"L\u2019ancien Shogun, sans son armure, ne baisse pas les yeux. \xAB Tout cela est vrai. L\u2019armure ne m\u2019a rien ordonn\xE9 que je n\u2019aie voulu. \xBB"},{speaker:"dame-onishima",expression:"REFLEXION",side:"right",text:"Le froid est parti, Akaza. Depuis que ton p\xE8re ne la porte plus, je\u2026 je me souviens de ce que j\u2019ai dit dans ma chambre. Et je n\u2019ai rien \xE0 r\xE9pondre."},{speaker:"akaza-maudite",expression:"NEUTRE",text:"Ce n\u2019est pas une excuse, m\xE8re. Ce n\u2019en sera jamais une."},{speaker:"dame-onishima",expression:"NEUTRE",text:"Je le sais."},{speaker:"akaza-maudite",expression:"DETERMINEE",text:"Vous ne serez pas ex\xE9cut\xE9s. Vous serez enferm\xE9s tous les deux dans le donjon du nord, jusqu\u2019\xE0 ce que je d\xE9cide autrement. Personne ne vous oubliera, et personne ne vous lib\xE9rera."},{direction:"Les gardes emm\xE8nent l\u2019ancien Shogun et sa femme. Aucun des deux ne r\xE9siste."}]},eb={id:"onishima-m10-epilogue",backdrop:"oni-chateau-jour",trigger:{kind:"victory"},transition:"fade",music:"onishima-map",mood:"calm",musicFade:2.4,entries:[{direction:"Devant le ch\xE2teau. Le premier jour du r\xE8gne d\u2019Akaza."},{speaker:"kimiko",expression:"NEUTRE",side:"right",text:"Les nobles ont peur de toi. Ils baissent les yeux quand tu passes."},{speaker:"akaza-maudite",expression:"NEUTRE",side:"left",text:"Qu\u2019ils aient peur, si cela les rend honn\xEAtes. Plus aucun ordre ne partira de ce palais dans le noir."},{speaker:"kimiko",expression:"NEUTRE",text:"Tu as condamn\xE9 un capitaine, hier, pour un vol de riz. Autrefois, tu l\u2019aurais seulement renvoy\xE9."},{speaker:"akaza-maudite",expression:"TRISTE",text:"Je sais. Je l\u2019ai senti, au moment o\xF9 je parlais. Dis-le-moi, chaque fois. M\xEAme quand je ne voudrai pas l\u2019entendre."},{speaker:"kimiko",expression:"NEUTRE",text:"Surtout quand tu ne voudras pas l\u2019entendre."},{pause:500},{speaker:"akaza-maudite",expression:"DETERMINEE",text:"\xC9cris \xE0 l\u2019Alliance Sylvestre. Le clan \u014Cnishima leur doit une pierre et une for\xEAt bless\xE9e. Nos soldats les aideront \xE0 combattre celui qui d\xE9tient l\u2019Obscure Clart\xE9, quel qu\u2019il soit."},{speaker:"kimiko",expression:"JOIE",text:"Une souveraine qui paie ses dettes. On n\u2019en avait plus vu depuis longtemps."},{speaker:"akaza-maudite",expression:"NEUTRE",text:"Hikaru aurait ri. Il aurait dit que je prenais tout trop au s\xE9rieux."},{speaker:"kimiko",expression:"TRISTE",text:"Il aurait eu raison. Il avait souvent raison."},{direction:"Le vent passe dans les \xE9rables rouges. Quelque part sous l\u2019armure, le froid attend."}]},Mp=[Ng,_g,Dg,Ug,Fg,Bg,jg,Gg,Kg,zg,Hg,Vg,$g,Jg,Yg,Wg,Qg,Xg,Zg,eb];var tb={id:"sylvestre-m01-intro",backdrop:"syl-m01-sanctuaire",trigger:{kind:"before"},music:"sylvestre-map",entries:[{direction:"Au c\u0153ur de la for\xEAt, le sanctuaire veille sur une pierre dont la lumi\xE8re ne choisit ni le bien ni le mal."},{speaker:"brumebarbe",expression:"REFLEXION",side:"left",text:"Depuis des si\xE8cles, l\u2019Obscure Clart\xE9 accompagne nos peuples. Sa pr\xE9sence ne nous dispense pas de nous entendre."},{speaker:"lynwel",expression:"NEUTRE",side:"right",text:"Nous entendre ? Nous passons nos journ\xE9es \xE0 demander la permission aux f\xE9es, aux gobelins et aux anciens."},{speaker:"brumebarbe",expression:"SOURIRE",side:"left",text:"Un souverain qui n\u2019\xE9coute personne n\u2019entend bient\xF4t plus que sa propre voix."},{speaker:"lynwel",expression:"RIRE_PRETENTIEUX",side:"right",text:"Les royaumes humains b\xE2tissent des routes et des citadelles. Nous, nous discutons des racines d\u2019un vieux ch\xEAne."},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Ce que tu appelles faiblesse a maintenu cette for\xEAt debout."},{speaker:"lynwel",expression:"NEUTRE",side:"right",text:"Et ce que tu appelles \xE9quilibre nous maintient \xE0 genoux."},{speaker:"ninja-01",expression:"RUSE",side:"right",text:"Le gardien regarde l\u2019autel. L\u2019autre regarde son avenir."},{speaker:"ninja-02",expression:"RUSEE",side:"right",text:"Alors aucun ne regardera derri\xE8re lui."},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Lyn\u2019Wel ! Les ombres, derri\xE8re les piliers !"},{speaker:"lynwel",expression:"COLERE",side:"right",text:"Des intrus ? \xC0 vos armes !"}]},rb={id:"sylvestre-m01-bataille",backdrop:"battle",trigger:{kind:"afterTurn",turn:0},music:"sylvestre-combat-02",entries:[{speaker:"ninja-01",expression:"ATTAQUE",side:"right",text:"La pierre vient avec nous !"},{speaker:"lynwel",expression:"COLERE",side:"right",text:"Pas tant que nous tenons cette clairi\xE8re."},{speaker:"brumebarbe",expression:"MYSTERIEUX",side:"left",text:"Le sanctuaire doit survivre \xE0 notre orgueil. Ensemble, Lyn\u2019Wel !"}]},sb={id:"sylvestre-m01-apres",backdrop:"syl-m01-sanctuaire",trigger:{kind:"victory"},music:"sylvestre-map",entries:[{speaker:"ninja-02",expression:"ETONNEMENT",side:"right",text:"Le passage est ouvert !"},{direction:"Malgr\xE9 la victoire des deux elfes, un second groupe de ninjas d\xE9robe l\u2019Obscure Clart\xE9 et dispara\xEEt dans les sous-bois."},{speaker:"brumebarbe",expression:"TRISTE",side:"left",text:"Non\u2026 Ils l\u2019ont prise."},{speaker:"lynwel",expression:"COLERE",side:"right",text:"Nous avons gagn\xE9 la bataille ! Comment ont-ils pu\u2026"},{speaker:"brumebarbe",expression:"REFLEXION",side:"left",text:"Nous avons d\xE9fendu le seuil. Ils visaient le c\u0153ur."},{speaker:"lynwel",expression:"SOURIRE_MACHIAVELIQUE",side:"right",text:"Alors le c\u0153ur de cette for\xEAt n\u2019est plus une pierre. Il faudra bien que quelqu\u2019un prenne sa place."},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Tu ne vois qu\u2019un tr\xF4ne l\xE0 o\xF9 je vois un vide."},{speaker:"lynwel",expression:"NEUTRE",side:"right",text:"Ce vide sera combl\xE9. Avec toi, ou sans toi."},{direction:"Les deux anciens alli\xE9s se s\xE9parent. La for\xEAt, elle, garde le souvenir de cette fracture."}]},ib={id:"sylvestre-m02-intro",backdrop:"syl-m02-village",trigger:{kind:"before"},music:"sylvestre-map",entries:[{direction:"Dans un village de maisons rondes sous les collines, Albus r\xE9pare une barri\xE8re avec plus d\u2019id\xE9es que de clous."},{speaker:"albus",expression:"MALICIEUX",side:"left",text:"Si la barri\xE8re s\u2019\xE9croule encore, je dirai qu\u2019elle \xE9tait con\xE7ue pour laisser passer le vent."},{speaker:"merella",expression:"REFLEXION",side:"left",text:"Ou tu pourrais employer des clous."},{show:[{character:"caillou",expression:"JOIE",side:"left"}]},{direction:"[Caillou soul\xE8ve la barri\xE8re d\u2019une seule main, puis la plante droit dans le sol.]"},{speaker:"merella",expression:"SOURIRE",side:"left",text:"Caillou te propose une troisi\xE8me m\xE9thode."},{speaker:"albus",expression:"RIRE",side:"left",text:"Il triche. Il poss\xE8de des bras solides."},{speaker:"brumebarbe",expression:"SOURIRE",side:"left",text:"J\u2019arrive au bon moment, \xE0 ce que je vois."},{speaker:"albus",expression:"SURPRISE",side:"left",text:"Brumebarbe ? Depuis quand les mauvaises nouvelles portent-elles un chapeau aussi haut ?"},{speaker:"brumebarbe",expression:"REFLEXION",side:"left",text:"Depuis qu\u2019un sanctuaire a \xE9t\xE9 pill\xE9, et qu\u2019un certain Lyn\u2019Wel songe \xE0 gouverner toute la for\xEAt."},{speaker:"merella",expression:"NEUTRE",side:"left",text:"Et tu veux que nous fassions quoi ?"},{speaker:"brumebarbe",expression:"MYSTERIEUX",side:"left",text:"Rassembler les peuples. Puis \xE9veiller le Roi des Ch\xEAnes."},{speaker:"merella",expression:"SURPRISE",side:"left",text:"Le Roi des Ch\xEAnes ? Nos grands-m\xE8res le racontaient aux enfants pour les faire dormir."},{speaker:"brumebarbe",expression:"REFLEXION",side:"left",text:"Et c\u2019est lui qui dort, \xE0 pr\xE9sent. Les l\xE9gendes oubli\xE9es sont souvent celles dont on a le plus besoin."},{speaker:"albus",expression:"SURPRISE",side:"left",text:"Tu as travers\xE9 la for\xEAt pour demander \xE7a \xE0 un gnome qui ne sait pas r\xE9parer sa barri\xE8re ?"},{speaker:"merella",expression:"SOURIRE",side:"left",text:"Il sait convaincre les gens de la r\xE9parer \xE0 sa place."},{show:[{character:"caillou",expression:"REFLEXION",side:"left"}]},{direction:"[Caillou frappe trois fois la table du bout des doigts.]"},{speaker:"merella",expression:"RIRE",side:"left",text:"Il dit que nous allons encore rentrer tr\xE8s tard."},{pause:500},{fx:"shake",music:"sylvestre-combat-01",musicFade:0},{direction:"Une palissade vole en \xE9clats. Des cris montent des greniers : des pillards gobelins d\xE9ferlent sur le village !"},{show:[{character:"caillou",expression:"COLERE",side:"left"}]},{speaker:"albus",expression:"SURPRISE",side:"left",text:"Ma barri\xE8re !"}]},ab={id:"sylvestre-m02-attaque",backdrop:"battle",trigger:{kind:"afterTurn",turn:0},music:"sylvestre-combat-01",entries:[{speaker:"merella",expression:"COLERE",side:"left",text:"On ne pille pas notre village !"},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Les questions attendront. Prot\xE9gez les habitants !"},{show:[{character:"caillou",expression:"COLERE",side:"left"}]},{direction:"[Caillou se dresse en rempart devant les premi\xE8res maisons.]"}]},ob={id:"sylvestre-m02-apres",backdrop:"syl-m02-village",trigger:{kind:"victory"},music:"sylvestre-map",entries:[{speaker:"gobelin-01",expression:"EFFRAYE",side:"right",text:"Retraite ! Les cailloux d\u2019ici frappent beaucoup trop fort !"},{speaker:"albus",expression:"SOURIRE",side:"left",text:"C\u2019est d\xE9cid\xE9. Je pars avec vous."},{speaker:"merella",expression:"SURPRISE",side:"left",text:"C\u2019est d\xE9cid\xE9 par qui ?"},{speaker:"albus",expression:"MALICIEUX",side:"left",text:"Par moi, au nom de notre courage partag\xE9."},{speaker:"merella",expression:"SOURIRE",side:"left",text:"Alors je viens pour prot\xE9ger ce courage de ses propres d\xE9cisions."},{show:[{character:"caillou",expression:"JOIE",side:"left"}]},{direction:"[Caillou hoche la t\xEAte et pose une main sur leurs \xE9paules.]"},{speaker:"brumebarbe",expression:"SOURIRE",side:"left",text:"Une compagnie improbable. C\u2019est souvent ainsi que commencent les meilleures histoires."},{direction:"Leur voyage les m\xE8nerait bient\xF4t bien au-del\xE0 des fronti\xE8res de la for\xEAt. Ce qui les attendait l\xE0-bas, nul ne pouvait encore le dire."}]},nb={id:"sylvestre-m03-ellipse",backdrop:"syl-m03-trone-alt",trigger:{kind:"before"},music:"sylvestre-map",transition:"fade",mood:"calm",entries:[{direction:"Des semaines ont pass\xE9. En chemin, Albus avait rencontr\xE9 une humaine nomm\xE9e Cl\xE9a, qui avait choisi de poursuivre la route \xE0 leurs c\xF4t\xE9s."},{speaker:"clea",expression:"TRISTE",side:"left",text:"J\u2019ai cru que les murs d\u2019une ville \xE9taient suffisants pour prot\xE9ger ceux qu\u2019on aime."},{speaker:"albus",expression:"REFLEXION",side:"left",text:"Dans une for\xEAt, les murs sont rares. Les gens, parfois, se serrent les coudes."},{speaker:"merella",expression:"SOURIRE",side:"left",text:"\xC0 condition que les f\xE9es consentent \xE0 nous parler."},{speaker:"clea",expression:"SURPRISE",side:"left",text:"Pourquoi ne le feraient-elles pas ?"},{speaker:"brumebarbe",expression:"SOURIRE",side:"left",text:"Elles adorent parler. Surtout d\u2019elles-m\xEAmes."},{show:[{character:"caillou",expression:"JOIE",side:"left"}]},{direction:"[Caillou incline la t\xEAte vers Cl\xE9a et lui pr\xE9sente une petite fleur.]"},{speaker:"clea",expression:"JOIE",side:"left",text:"Merci, Caillou."}]},lb={id:"sylvestre-m03-intro",backdrop:"syl-m03-trone",trigger:{kind:"before"},music:"sylvestre-map",entries:[{speaker:"fee-01",expression:"BOUDEUSE",side:"right",text:"Halte ! Aucun visiteur ne para\xEEt devant Sa Majest\xE9 sans avoir compliment\xE9 les fleurs."},{speaker:"albus",expression:"MALICIEUX",side:"left",text:"Elles sont splendides. Et je remarque qu\u2019elles ne r\xE9clament pas de compliments en retour."},{speaker:"reine-des-fees",expression:"NEUTRE",side:"right",text:"Vous souhaitez une alliance ? Excellente id\xE9e. Je commanderai donc l\u2019ensemble de vos peuples."},{speaker:"clea",expression:"NEUTRE",side:"left",text:"Nous vous proposons de les rejoindre, pas de les poss\xE9der."},{speaker:"reine-des-fees",expression:"MALICIEUSE",side:"right",text:"Pour une humaine, la nuance te tient visiblement \xE0 c\u0153ur."},{speaker:"merella",expression:"REFLEXION",side:"left",text:"Et \xE0 nous aussi."},{speaker:"reine-des-fees",expression:"COLERE",side:"right",text:"Vous voudriez que ma cour accepte l\u2019autorit\xE9 d\u2019un gnome ?"},{speaker:"albus",expression:"SOURIRE",side:"left",text:"Non. Je voudrais que personne ne soit au-dessus des autres."},{music:"sylvestre-combat-03",musicFade:.5},{speaker:"reine-des-fees",expression:"MAGIE",side:"right",text:"Alors prouvons par l\u2019\xE9preuve qui m\xE9rite d\u2019\xEAtre \xE9cout\xE9."}]},cb={id:"sylvestre-m03-bataille",backdrop:"battle",trigger:{kind:"afterTurn",turn:0},music:"sylvestre-combat-03",entries:[{speaker:"reine-des-fees",expression:"CRI",side:"right",text:"Mes f\xE9es, que les fleurs elles-m\xEAmes portent notre couronne !"},{speaker:"clea",expression:"DETERMINEE",side:"left",text:"La beaut\xE9 ne rend pas une d\xE9cision juste."},{speaker:"albus",expression:"MALICIEUX",side:"left",text:"Et la modestie n\u2019a visiblement pas \xE9t\xE9 invit\xE9e."}]},ub={id:"sylvestre-m03-apres",backdrop:"syl-m03-trone",trigger:{kind:"victory"},music:"sylvestre-map",entries:[{speaker:"reine-des-fees",expression:"SURPRISE",side:"right",text:"Impossible\u2026 Nous avons \xE9t\xE9 d\xE9faites ?"},{speaker:"merella",expression:"SOURIRE",side:"left",text:"Vous avez surtout \xE9t\xE9 entendues. Comme nous."},{speaker:"reine-des-fees",expression:"NEUTRE",side:"right",text:"Fort bien. Mes f\xE9es rejoindront votre\u2026 rassemblement."},{speaker:"albus",expression:"SOURIRE",side:"left",text:"Notre Alliance."},{speaker:"reine-des-fees",expression:"MALICIEUSE",side:"right",text:"Ne vous habituez pas \xE0 me corriger."},{speaker:"clea",expression:"JOIE",side:"left",text:"Alors c\u2019est un d\xE9but."},{speaker:"brumebarbe",expression:"SOURIRE",side:"left",text:"Le premier peuple a r\xE9pondu pr\xE9sent. M\xEAme s\u2019il tient \xE0 le rappeler \xE0 chaque phrase."},{speaker:"reine-des-fees",expression:"MALICIEUSE",side:"right",text:"Et votre Roi des Ch\xEAnes ? Une jolie fable de vieux druide, rien de plus."},{speaker:"brumebarbe",expression:"MYSTERIEUX",side:"left",text:"Une fable qui a plant\xE9 la moiti\xE9 de cette for\xEAt, Majest\xE9."}]},db={id:"sylvestre-m04-intro",backdrop:"syl-m04-camp",trigger:{kind:"before"},music:"sylvestre-map",entries:[{speaker:"clea",expression:"DETERMINEE",side:"left",text:"Ils ont attaqu\xE9 votre village. Pourquoi tenter encore de leur parler ?"},{speaker:"albus",expression:"NEUTRE",side:"left",text:"Parce que des pillards ne repr\xE9sentent pas tous les gobelins."},{speaker:"merella",expression:"SOURIRE",side:"left",text:"Et parce qu\u2019Albus croit que tout se n\xE9gocie, y compris le prix des carottes."},{speaker:"gobelin-02",expression:"MALICIEUX",side:"right",text:"Tiens, des gnomes. Vous venez nous vendre votre amiti\xE9 ?"},{speaker:"albus",expression:"SOURIRE",side:"left",text:"Je viens vous proposer une place dans une alliance libre."},{speaker:"gobelin-01",expression:"RIRE",side:"right",text:"Lyn\u2019Wel nous a d\xE9j\xE0 promis du fer, des routes et des r\xE9serves."},{speaker:"albus",expression:"REFLEXION",side:"left",text:"Et en \xE9change ?"},{speaker:"gobelin-01",expression:"NEUTRE",side:"right",text:"On garde sa route, on suit ses ordres. On mange \xE0 notre faim."},{speaker:"clea",expression:"NEUTRE",side:"left",text:"Je comprends que vous vouliez nourrir les v\xF4tres. Mais avez-vous r\xE9fl\xE9chi \xE0 ce qu\u2019il exige en \xE9change ?"},{speaker:"gobelin-02",expression:"COLERE",side:"right",text:"Les belles paroles ne remplissent pas les marmites !"},{speaker:"gobelin-01",expression:"CRI",side:"right",text:"Fermez le camp ! Lyn\u2019Wel paiera bien pour des espions !"},{fx:"shake",music:"sylvestre-combat-01",musicFade:.4},{direction:"Des lances se dressent de toutes parts. Derri\xE8re la d\xE9l\xE9gation, la palissade se referme."},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Restez group\xE9s. Nous sortons d\u2019ici ensemble."}]},pb={id:"sylvestre-m04-bataille",backdrop:"battle",trigger:{kind:"afterTurn",turn:0},music:"sylvestre-combat-01",entries:[{speaker:"gobelin-01",expression:"CRI",side:"right",text:"Personne ne sort ! Bloquez la palissade !"},{speaker:"albus",expression:"COLERE",side:"left",text:"Nous n\u2019\xE9tions pas venus faire la guerre."},{speaker:"merella",expression:"REFLEXION",side:"left",text:"Le fond du camp. Leur cl\xF4ture y est plus vieille que la barri\xE8re d\u2019Albus."}]},hb={id:"sylvestre-m04-apres",backdrop:"syl-m04-camp",trigger:{kind:"victory"},music:"sylvestre-map",entries:[{direction:"Les cris du camp s\u2019\xE9loignent. Sous le couvert des arbres, la d\xE9l\xE9gation s\u2019arr\xEAte enfin."},{speaker:"albus",expression:"TRISTE",side:"left",text:"J\u2019\xE9tais venu leur tendre la main. Ils ont pr\xE9f\xE9r\xE9 nous montrer la porte."},{speaker:"merella",expression:"NEUTRE",side:"left",text:"La porte, et une bonne partie de leurs lances."},{speaker:"reine-des-fees",expression:"NEUTRE",side:"right",text:"Certains peuples ont un go\xFBt regrettable pour la mauvaise compagnie."},{speaker:"clea",expression:"DETERMINEE",side:"left",text:"Ou une peur que leurs voisins ne prennent pas au s\xE9rieux."},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Celui qu\u2019on nommait l\u2019Avide se serait r\xE9joui de nous voir ainsi divis\xE9s."},{speaker:"merella",expression:"NEUTRE",side:"left",text:"On repart sans eux. Mais au moins, on sait de quel c\xF4t\xE9 ils se trouvent."}]},mb={id:"sylvestre-m05-intro",backdrop:"syl-m05-route",trigger:{kind:"before"},music:"sylvestre-map",entries:[{speaker:"fee-01",expression:"BOUDEUSE",side:"right",text:"C\u2019est une honte ! On me refuse l\u2019acc\xE8s \xE0 une route o\xF9 j\u2019ai d\xE9j\xE0 sem\xE9 des fleurs !"},{direction:"Derri\xE8re la barri\xE8re se tient une elfe en armure, droite comme une lance : Kyyra, commandante de la garde et bras droit de Lyn\u2019Wel."},{speaker:"kyyra",expression:"AUTORITAIRE",side:"right",text:"La fronti\xE8re est ferm\xE9e aux convois non autoris\xE9s. Sans exception."},{speaker:"clea",expression:"NEUTRE",side:"left",text:"Pourtant, ce marchand elfe vient de passer."},{speaker:"kyyra",expression:"REFLEXION",side:"right",text:"Il a un sauf-conduit."},{speaker:"albus",expression:"MALICIEUX",side:"left",text:"Et les autres peuples peuvent-ils en acheter un ?"},{speaker:"kyyra",expression:"NEUTRE",side:"right",text:"Les nouvelles lois garantissent la s\xE9curit\xE9 de la for\xEAt."},{speaker:"merella",expression:"REFLEXION",side:"left",text:"Pourquoi garantissent-elles surtout le passage des Elfes ?"},{speaker:"orc-01",expression:"RIRE",side:"right",text:"Parce que les elfes paient bien pour les garder !"},{speaker:"kyyra",expression:"COLERE",side:"right",text:"Soldat. Silence."},{speaker:"clea",expression:"COLERE",side:"left",text:"Ce n\u2019est pas une fronti\xE8re si elle sert uniquement \xE0 distinguer ceux qui ont des droits."},{speaker:"kyyra",expression:"AUTORITAIRE",side:"right",text:"Je ne discuterai pas les ordres de mon commandant sur cette route."},{speaker:"albus",expression:"NEUTRE",side:"left",text:"Alors nous passerons sans votre permission."},{music:"sylvestre-combat-02",musicFade:.5},{speaker:"kyyra",expression:"COLERE",side:"right",text:"Garde ! Fermez la ligne !"}]},fb={id:"sylvestre-m05-bataille",backdrop:"battle",trigger:{kind:"afterTurn",turn:0},music:"sylvestre-combat-02",entries:[{speaker:"kyyra",expression:"AUTORITAIRE",side:"right",text:"Tenez vos positions. Personne ne franchit ce poste sans mon ordre."},{speaker:"orc-01",expression:"CRI",side:"right",text:"On va leur apprendre l\u2019ordre !"},{speaker:"kyyra",expression:"COLERE",side:"right",text:"Ta ligne, soldat. Pas ta bouche."},{speaker:"clea",expression:"DETERMINEE",side:"left",text:"Une route ne devrait pas appartenir \xE0 un seul peuple."}]},yb={id:"sylvestre-m05-apres",backdrop:"syl-m05-route",trigger:{kind:"victory"},music:"sylvestre-map",entries:[{direction:"La ligne elfique a c\xE9d\xE9. La d\xE9l\xE9gation est pass\xE9e."},{speaker:"kyyra",expression:"AUTORITAIRE",side:"right",text:"Repliez-vous au poste avanc\xE9. Rassemblez les bless\xE9s et faites votre rapport."},{speaker:"clea",expression:"DETERMINEE",side:"left",text:"Et les lois qui ont provoqu\xE9 tout cela ?"},{speaker:"kyyra",expression:"NEUTRE",side:"right",text:"Elles ne se discutent pas sur cette route. Ni avec vous."},{speaker:"merella",expression:"NEUTRE",side:"left",text:"Tu n\u2019as pas l\u2019air d
