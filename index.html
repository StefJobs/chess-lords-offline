e toutes les aimer, pourtant."},{speaker:"kyyra",expression:"REFLEXION",side:"right",text:"Qui vous dit que je dois approuver chaque ordre pour rester fid\xE8le \xE0 mon serment ?"},{direction:"Elle soutient un instant le regard de Cl\xE9a, puis rejoint ses soldats sans un mot de plus."}]},gb={id:"sylvestre-m06-intro",backdrop:"syl-m06-passe",trigger:{kind:"before"},music:"sylvestre-map",entries:[{speaker:"lynwel",expression:"NEUTRE",side:"right",text:"Vous avez travers\xE9 mes fronti\xE8res, humili\xE9 mes soldats et d\xE9bauch\xE9 mes futurs alli\xE9s."},{speaker:"albus",expression:"MALICIEUX",side:"left",text:"Pour la derni\xE8re partie, je te rassure : les gobelins nous ont dit non."},{speaker:"lynwel",expression:"RIRE_PRETENTIEUX",side:"right",text:"Ils ont compris ce que toi tu refuses de voir. Le monde respecte les peuples puissants."},{speaker:"merella",expression:"COLERE",side:"left",text:"Alors pourquoi les tiens auraient-ils plus de valeur que les autres ?"},{speaker:"lynwel",expression:"NEUTRE",side:"right",text:"Parce que les Elfes ont la m\xE9moire, la discipline et le savoir pour diriger."},{speaker:"clea",expression:"DETERMINEE",side:"left",text:"Les royaumes humains connaissent ce discours. Il finit rarement bien pour ceux qu\u2019on pr\xE9tend prot\xE9ger."},{speaker:"kyyra",expression:"REFLEXION",side:"right",text:"Mon seigneur, la coalition a d\xE9j\xE0 prouv\xE9 sa valeur. Une n\xE9gociation reste possible."},{music:"sylvestre-boss-01",musicFade:.6},{speaker:"lynwel",expression:"COLERE",side:"right",text:"N\xE9gocier ma propre souverainet\xE9 ?"},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Je t\u2019ai connu capable de d\xE9fendre la for\xEAt sans vouloir la poss\xE9der. Le Roi des Ch\xEAnes n\u2019a jamais voulu d\u2019une for\xEAt \xE0 genoux."},{speaker:"lynwel",expression:"NEUTRE",side:"right",text:"La for\xEAt n\u2019a plus besoin de lui. Elle a besoin de lois, de routes et d\u2019un avenir."},{speaker:"lynwel",expression:"SOURIRE_MACHIAVELIQUE",side:"right",text:"Et je t\u2019ai connu plus jeune, plus audacieux. Le temps nous a donc chang\xE9s tous les deux."},{speaker:"albus",expression:"NEUTRE",side:"left",text:"Tu veux imposer l\u2019ordre. Nous voulons que chacun puisse choisir d\u2019y participer."},{speaker:"lynwel",expression:"COLERE",side:"right",text:"Alors \xE9prouvons la valeur de vos choix !"}]},bb={id:"sylvestre-m06-bataille",backdrop:"battle",trigger:{kind:"afterTurn",turn:0},music:"sylvestre-boss-01",entries:[{speaker:"lynwel",expression:"COLERE",side:"right",text:"Que l\u2019on se souvienne de ce jour. La for\xEAt n\u2019appartiendra pas au hasard !"},{speaker:"kyyra",expression:"AUTORITAIRE",side:"right",text:"Soldats, tenez la ligne !"},{speaker:"clea",expression:"DETERMINEE",side:"left",text:"Nous sommes plus nombreux que tu ne le crois : chacun est venu de son plein gr\xE9."}]},xb={id:"sylvestre-m06-apres",backdrop:"syl-m06-passe",trigger:{kind:"victory"},music:"sylvestre-map",entries:[{speaker:"lynwel",expression:"EFFRAYE",side:"right",text:"Une coalition de f\xE9es et de gnomes\u2026 impossible."},{speaker:"kyyra",expression:"TRISTE",side:"right",text:"Mon seigneur, nous devons nous replier. Maintenant."},{speaker:"lynwel",expression:"COLERE",side:"right",text:"Je n\u2019ai pas perdu la guerre."},{speaker:"brumebarbe",expression:"TRISTE",side:"left",text:"N\u2019en fais pas une guerre contre toi-m\xEAme, Lyn\u2019Wel."},{speaker:"lynwel",expression:"SOURIRE_MACHIAVELIQUE",side:"right",text:"Vous prenez ma retenue pour une faiblesse. Je trouverai d\u2019autres forces."},{speaker:"kyyra",expression:"REFLEXION",side:"right",text:"Mon seigneur\u2026 quelles forces ?"},{direction:"Sous les racines de la forteresse, une lueur violette r\xE9pond au regard de Lyn\u2019Wel. Personne ne sait encore qui l\u2019a \xE9veill\xE9e."}]},vb={id:"sylvestre-m07-intro",backdrop:"syl-m07-cite",trigger:{kind:"before"},music:"sylvestre-map",entries:[{direction:"\xC0 l\u2019approche d\u2019une cit\xE9 de roche ancienne, des golems immobiles semblent attendre un signe."},{show:[{character:"caillou",expression:"SURPRISE",side:"left"}]},{direction:"[Caillou touche deux fois le sol puis s\u2019incline devant le Sage Golem.]"},{show:[{character:"sage-golem",expression:"EXPLICATION",side:"right"}]},{direction:"[Le Sage frappe sa canne \xE0 trois reprises ; une vibration traverse les dalles.]"},{show:[{character:"caillou",expression:"REFLEXION",side:"left"}]},{direction:"[Caillou reproduit les vibrations et trace dans l\u2019air un immense cercle.]"},{speaker:"merella",expression:"REFLEXION",side:"left",text:"Leur cit\xE9 a \xE9t\xE9 prise. Ils ont fui devant\u2026 quelque chose d\u2019\xE9norme."},{speaker:"albus",expression:"MALICIEUX",side:"left",text:"\xC9norme pour un golem ? Peut-\xEAtre un gros rocher ?"},{show:[{character:"caillou",expression:"INQUIET",side:"left"}]},{direction:"[Caillou mime deux ailes, quatre pattes et une gueule gigantesque.]"},{speaker:"merella",expression:"SURPRISE",side:"left",text:"Non. Nettement plus inqui\xE9tant."},{speaker:"clea",expression:"SURPRISE",side:"left",text:"Un dragon ?"},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Si c\u2019est celui auquel je pense, nos soucis sont plus anciens que cette guerre."},{music:"sylvestre-combat-02",musicFade:.6},{speaker:"elfe-01",expression:"CRI",side:"right",text:"Halte ! Cette route est d\xE9sormais sous contr\xF4le de Lyn\u2019Wel !"},{speaker:"orc-01",expression:"RIRE",side:"right",text:"M\xEAme les rochers doivent demander la permission !"},{speaker:"merella",expression:"COLERE",side:"left",text:"Ils ne s\u2019arr\xEAteront pas aux golems. Restez pr\xE8s du Sage !"}]},kb={id:"sylvestre-m07-bataille",backdrop:"battle",trigger:{kind:"afterTurn",turn:0},music:"sylvestre-combat-02",entries:[{speaker:"merella",expression:"COLERE",side:"left",text:"Vous chassez des gens qui n\u2019ont m\xEAme pas de voix pour protester !"},{speaker:"albus",expression:"COLERE",side:"left",text:"\xC9cartez-vous de leur ville."},{show:[{character:"sage-golem",expression:"COLERE",side:"right"}]},{direction:"[Le Sage fait vibrer sa canne ; les pierres tremblent.]"}]},Sb={id:"sylvestre-m07-apres",backdrop:"syl-m07-cite",trigger:{kind:"victory"},music:"sylvestre-map",entries:[{direction:"Un grondement lointain remonte des entrailles de la montagne."},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Un dragon ancien, plus vieux que nos l\xE9gendes. Ces montagnes n\u2019ont jamais \xE9t\xE9 son nid\u2026 quelque chose l\u2019en a chass\xE9."},{speaker:"clea",expression:"DETERMINEE",side:"left",text:"Qui voudrait d\xE9placer une cr\xE9ature pareille ?"},{speaker:"brumebarbe",expression:"REFLEXION",side:"left",text:"Quelqu\u2019un qui gagnerait \xE0 voir la for\xEAt divis\xE9e."},{speaker:"merella",expression:"NEUTRE",side:"left",text:"Les golems nous guideront. \xC0 condition de ne pas prendre leurs avertissements pour des \xE9nigmes."},{show:[{character:"caillou",expression:"JOIE",side:"left"}]},{direction:"[Caillou tapote la t\xEAte d\u2019Albus, comme pour v\xE9rifier qu\u2019il a compris.]"},{speaker:"albus",expression:"MALICIEUX",side:"left",text:"D\u2019accord, d\u2019accord. J\u2019\xE9viterai de proposer qu\u2019on frappe \xE0 la porte."}]},Eb={id:"sylvestre-m08-intro",backdrop:"syl-m08-ignir",trigger:{kind:"before"},music:"sylvestre-map",entries:[{direction:"Dans un sanctuaire de lave qui n\u2019aurait jamais d\xFB servir de nid, une chaleur \xE9touffante monte des profondeurs."},{speaker:"reine-des-fees",expression:"MALICIEUSE",side:"right",text:"Mes ailes ont \xE9t\xE9 tiss\xE9es pour la lumi\xE8re, pas pour la braise. Je vous attendrai ici."},{speaker:"albus",expression:"MALICIEUX",side:"left",text:"Ici, ou \xE0 bonne distance ?"},{speaker:"reine-des-fees",expression:"NEUTRE",side:"right",text:"\xC0 une distance digne de mon rang. Revenez entiers : je d\xE9teste les alli\xE9s incomplets."},{exit:["reine-des-fees"]},{show:[{character:"ignir",expression:"SOMMEIL",side:"right"}]},{direction:"Au-dessus d\u2019un escalier de pierre br\xFBlante, une masse \xE9cailleuse d\u2019un rouge incandescent se soul\xE8ve au rythme d\u2019un souffle immense."},{speaker:"clea",expression:"SURPRISE",side:"left",text:"Ce n\u2019est pas une b\xEAte. C\u2019est une montagne avec des griffes."},{speaker:"albus",expression:"REFLEXION",side:"left",text:"Et la montagne r\xEAve probablement de nous manger."},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Ignir\u2026 Je le croyais endormi pour toujours, au-del\xE0 des monts de feu. Il n\u2019a rien \xE0 faire ici."},{speaker:"merella",expression:"REFLEXION",side:"left",text:"Il a l\u2019air aussi furieux d\u2019\xEAtre ici que nous de l\u2019y trouver."},{show:[{character:"caillou",expression:"COLERE",side:"left"}]},{direction:"[Caillou plante ses pieds dans le sol et se met en garde.]"},{music:"sylvestre-ignir-boss",musicFade:.3},{show:[{character:"ignir",expression:"COLERE",side:"right"}]},{direction:"[Ignir ouvre les yeux. Ses ailes se d\xE9ploient lentement, et son rugissement couvre les cascades de lave.]"}]},wb={id:"sylvestre-m08-bataille",backdrop:"battle",trigger:{kind:"afterTurn",turn:0},entries:[{speaker:"merella",expression:"REFLEXION",side:"left",text:"M\xEAme la roche g\xE9mit sous sa chaleur\u2026"},{show:[{character:"ignir",expression:"FLAMMES",side:"right"}]},{direction:"[Ignir gonfle sa poitrine ; une lueur ardente monte dans sa gorge.]"},{speaker:"albus",expression:"COLERE",side:"left",text:"Si quelqu\u2019un a un seau d\u2019eau, c\u2019est le moment de s\u2019en vanter !"}]},Rb={id:"sylvestre-m08-apres",backdrop:"syl-m08-ignir",trigger:{kind:"victory"},music:"sylvestre-map",entries:[{show:[{character:"ignir",expression:"COLERE",side:"right"}]},{direction:"[Bless\xE9 et \xE9puis\xE9, Ignir d\xE9ploie ses ailes, d\xE9colle et s\u2019\xE9chappe vers les montagnes.]"},{speaker:"clea",expression:"SURPRISE",side:"left",text:"Il s\u2019enfuit\u2026 Il est vivant !"},{speaker:"brumebarbe",expression:"SOURIRE",side:"left",text:"Alors ces murs pourront enfin retrouver leurs habitants."},{show:[{character:"sage-golem",expression:"JOIE",side:"right"}]},{direction:"[Le Sage incline son b\xE2ton vers la compagnie ; un grondement doux r\xE9pond \xE0 ses gestes.]"},{show:[{character:"caillou",expression:"JOIE",side:"left"}]},{direction:"[Caillou vibre de joie, puis se tourne vers Merella.]"},{speaker:"merella",expression:"SOURIRE",side:"left",text:"Le Sage dit que son peuple se joindra \xE0 notre alliance. Et que Caillou a toujours \xE9t\xE9 un tr\xE8s bon \xE9l\xE8ve."},{speaker:"albus",expression:"MALICIEUX",side:"left",text:"\xC7a, je veux bien le croire. Il ne lui reste qu\u2019\xE0 apprendre \xE0 \xE9crire les comptes rendus."},{speaker:"brumebarbe",expression:"REFLEXION",side:"left",text:"Un dragon lib\xE9r\xE9, des puissances qui s\u2019\xE9veillent\u2026 Tout cela porte une m\xEAme ombre."}]},Pb={id:"sylvestre-m09-intro",backdrop:"syl-m09-roi",trigger:{kind:"before"},music:"sylvestre-map",entries:[{direction:"Au sanctuaire du Roi des Ch\xEAnes, la for\xEAt semble retenir son souffle."},{speaker:"brumebarbe",expression:"SOURIRE",side:"left",text:"Vous le traitiez de vieille fable, il n\u2019y a pas si longtemps."},{speaker:"reine-des-fees",expression:"COLERE",side:"right",text:"Je refuse de laisser Lyn\u2019Wel d\xE9cider quelles l\xE9gendes m\xE9ritent encore de vivre."},{speaker:"reine-des-fees",expression:"NEUTRE",side:"right",text:"Les invocations les plus d\xE9licates me reviennent, \xE9videmment."},{speaker:"brumebarbe",expression:"SOURIRE",side:"left",text:"Je vous laisse aussi les silences, Majest\xE9, si cela nous permet de commencer."},{speaker:"reine-des-fees",expression:"COLERE",side:"right",text:"Mes silences sont d\u2019une extr\xEAme importance !"},{speaker:"clea",expression:"DETERMINEE",side:"left",text:"Apr\xE8s tout ce chemin, nous n\u2019allons pas \xE9chouer sur une querelle d\u2019orgueil."},{speaker:"merella",expression:"REFLEXION",side:"left",text:"Les runes s\u2019\xE9veillent. Nous ferions mieux de ne pas les faire attendre."},{speaker:"albus",expression:"MALICIEUX",side:"left",text:"Pour une fois, essayons une c\xE9r\xE9monie sans concours d\u2019orgueil."},{speaker:"brumebarbe",expression:"MYSTERIEUX",side:"left",text:"Ce Roi ne s\u2019est pas endormi par faiblesse. Il attendait peut-\xEAtre que la for\xEAt se souvienne de sa propre voix."},{music:"sylvestre-combat-02",musicFade:.4},{speaker:"elfe-01",expression:"CRI",side:"right",text:"Sur ordre de Lyn\u2019Wel : interrompez l\u2019invocation !"},{direction:"Des soldats surgissent de toutes parts. Ils sont bien plus nombreux que les d\xE9fenseurs du sanctuaire."},{speaker:"albus",expression:"COLERE",side:"left",text:"Alors il faudra tenir. Aussi longtemps que durera le rituel."}]},Mb={id:"sylvestre-m09-bataille",backdrop:"battle",trigger:{kind:"afterTurn",turn:0},music:"sylvestre-combat-02",entries:[{speaker:"reine-des-fees",expression:"MAGIE",side:"right",text:"Je tiendrai le fil de la lumi\xE8re."},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Et moi la m\xE9moire des racines. D\xE9fendez-nous !"},{speaker:"albus",expression:"COLERE",side:"left",text:"Personne ne touchera \xE0 ce sanctuaire."}]},Cb={id:"sylvestre-m09-eveil",backdrop:"syl-m09-roi",trigger:{kind:"victory"},music:"sylvestre-map",entries:[{direction:"Deux traditions s\u2019unissent. Les racines vibrent, les pierres r\xE9sonnent et un \xEAtre immense quitte enfin son sommeil."},{fx:"flash",fxColor:10289002},{show:[{character:"roi-des-chenes",expression:"SOMMEIL",side:"right"}]},{direction:"[Le Roi des Ch\xEAnes ouvre lentement les yeux.]"},{speaker:"roi-des-chenes",expression:"MEFIANT",side:"right",text:"Qui trouble un sommeil que la for\xEAt elle-m\xEAme m\u2019avait accord\xE9 ?"},{speaker:"brumebarbe",expression:"NEUTRE",side:"left",text:"Ceux qui refusent qu\u2019elle appartienne \xE0 un seul peuple."},{speaker:"reine-des-fees",expression:"NEUTRE",side:"right",text:"Et ceux qui ont accompli une invocation fort admirable, si je puis me permettre."},{speaker:"roi-des-chenes",expression:"NEUTRE",side:"right",text:"J\u2019entends les cris des feuilles. Et je sens une absence au c\u0153ur de la for\xEAt."},{speaker:"clea",expression:"NEUTRE",side:"left",text:"L\u2019Obscure Clart\xE9 a \xE9t\xE9 d\xE9rob\xE9e. Et Lyn\u2019Wel veut plier tous les peuples \xE0 sa seule loi."},{speaker:"roi-des-chenes",expression:"NEUTRE",side:"right",text:"J\u2019ai vu des souverains promettre la paix avant d\u2019imposer leur volont\xE9. Leur r\xE8gne a pass\xE9. La for\xEAt demeure."},{speaker:"roi-des-chenes",expression:"MAGIE",side:"right",text:"Mais ce n\u2019est pas l\u2019orgueil seul que je sens. Une faim tr\xE8s ancienne r\xF4de sous les racines."},{speaker:"roi-des-chenes",expression:"MEFIANT",side:"right",text:"Shaytan\u2026 Onikami\u2026 Voil\xE0 des noms que je croyais enfouis depuis longtemps."},{speaker:"albus",expression:"REFLEXION",side:"left",text:"Tu sais ce qui s\u2019\xE9veille ?"},{speaker:"roi-des-chenes",expression:"MAGIE",side:"right",text:"Je reconnais cette faim. Elle attend que les vivants se d\xE9chirent pour s\u2019approcher."},{speaker:"brumebarbe",expression:"REFLEXION",side:"left",text:"Alors la for\xEAt a besoin de toi."},{speaker:"roi-des-chenes",expression:"NEUTRE",side:"right",text:"La for\xEAt n\u2019a besoin de personne pour la gouverner. Mais elle a besoin d\u2019\xEAtre d\xE9fendue."},{speaker:"roi-des-chenes",expression:"MAGIE",side:"right",text:"Je marcherai avec votre alliance. Non pour servir l\u2019un de vous : parce que ce danger nous concerne tous."}]},Tb={id:"sylvestre-m10-intro",backdrop:"syl-m10-champ",trigger:{kind:"before"},music:"sylvestre-map",entries:[{direction:"Les peuples alli\xE9s occupent la clairi\xE8re des anciens. \xC0 l\u2019horizon, l\u2019arm\xE9e de Lyn\u2019Wel avance sous une lumi\xE8re violette inhabituelle."},{speaker:"lynwel",expression:"NEUTRE",side:"right",text:"Une derni\xE8re fois : rendez-vous. Je pr\xE9serverai vos foyers et vos privil\xE8ges."},{speaker:"albus",expression:"NEUTRE",side:"left",text:"Nous n\u2019avons pas travers\xE9 la for\xEAt pour obtenir des privil\xE8ges. Nous voulons les m\xEAmes droits pour tous."},{speaker:"lynwel",expression:"RIRE_PRETENTIEUX",side:"right",text:"Les m\xEAmes droits ? \xC0 ceux qui ne peuvent m\xEAme pas d\xE9fendre leur village ?"},{speaker:"merella",expression:"COLERE",side:"left",text:"Les m\xEAmes droits, oui. Et une d\xE9fense commune."},{speaker:"clea",expression:"DETERMINEE",side:"left",text:"Tu sais b\xE2tir une arm\xE9e. Mais gouverner n\u2019est pas faire taire ceux qui vivent sous tes ordres."},{speaker:"kyyra",expression:"REFLEXION",side:"right",text:"Mon seigneur, nos pertes s\u2019accumulent. Nous pouvons encore n\xE9gocier une tr\xEAve."},{speaker:"lynwel",expression:"COLERE",side:"right",text:"Tu r\xE9p\xE8tes d\xE9sormais les doutes de nos ennemis ?"},{speaker:"kyyra",expression:"TRISTE",side:"right",text:"Je vous rappelle ce que nos soldats sont venus prot\xE9ger."},{speaker:"reine-des-fees",expression:"MALICIEUSE",side:"right",text:"Et il y a tant \xE0 prot\xE9ger, \xE0 commencer par l\u2019\xE9l\xE9gance de cette clairi\xE8re."},{speaker:"albus",expression:"MALICIEUX",side:"left",text:"Pour une fois, Majest\xE9, je vous laisse le dernier mot."},{music:"sylvestre-boss-02",musicFade:.5},{speaker:"lynwel",expression:"COLERE",side:"right",text:"Alors vous avez choisi la guerre."}]},Ab={id:"sylvestre-m10-phase1",backdrop:"battle",trigger:{kind:"afterTurn",turn:0},music:"sylvestre-boss-02",entries:[{speaker:"kyyra",expression:"AUTORITAIRE",side:"right",text:"Derni\xE8re formation. Gardez les lignes et prot\xE9gez les bless\xE9s !"},{speaker:"lynwel",expression:"COLERE",side:"right",text:"Que le monde voie ce que co\xFBte la d\xE9sob\xE9issance !"},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Ce combat doit finir avant que l\u2019ombre qui l\u2019entoure ne grandisse encore."},{speaker:"albus",expression:"NEUTRE",side:"left",text:"Personne ne nous a ordonn\xE9 d\u2019\xEAtre ici. C\u2019est pour cela que nous tiendrons."}]},Ib={id:"sylvestre-m10-ouverture",backdrop:"battle",trigger:{kind:"event",name:"boss-opening"},entries:[{speaker:"albus",expression:"COLERE",side:"left",text:"Un des n\xF4tres\u2026 d\u2019un seul geste !"},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Cette magie est trop froide pour \xEAtre la sienne. Restez unis."}]},Ob={id:"sylvestre-m10-transition",backdrop:"syl-m10-champ",trigger:{kind:"before"},music:"sylvestre-boss-03",entries:[{direction:"Un \xE9clair violet traverse la m\xEAl\xE9e et frappe la Reine des F\xE9es en plein vol."},{speaker:"reine-des-fees",expression:"SURPRISE",side:"right",text:"Mon aile\u2026 Comment ose-t-il ?"},{speaker:"merella",expression:"REFLEXION",side:"left",text:"Elle respire. Mais elle ne pourra pas continuer."},{speaker:"reine-des-fees",expression:"COLERE",side:"right",text:"Ne me regardez pas ainsi. Gagnez, et je vous pardonnerai de m\u2019avoir vue \xE0 terre."},{exit:["reine-des-fees"]},{direction:"L\u2019arm\xE9e ennemie recule. Lyn\u2019Wel, isol\xE9, refuse pourtant de l\xE2cher son \xE9p\xE9e."},{speaker:"kyyra",expression:"TRISTE",side:"right",text:"Mon seigneur\u2026 La bataille est perdue. Nos hommes ont besoin de vous vivant."},{speaker:"lynwel",expression:"EFFRAYE",side:"right",text:"Non. Ils ont besoin d\u2019un chef que rien ne peut vaincre."},{speaker:"brumebarbe",expression:"SOURCILS_FRONCES",side:"left",text:"Ce qui te r\xE9pond n\u2019est pas ta propre force, Lyn\u2019Wel."},{speaker:"lynwel",expression:"SOURIRE_MACHIAVELIQUE",side:"right",text:"On m\u2019a promis de briser toutes les cha\xEEnes de cette for\xEAt."},{speaker:"clea",expression:"SURPRISE",side:"left",text:"Ses yeux\u2026 Regardez !"},{fx:"flash",f
